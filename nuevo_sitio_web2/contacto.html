<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Wisdom Without Code</title><style>:root{--ink:#183044;--navy:#173f56;--blue:#297b91;--aqua:#61c8c5;--mint:#dff3ee;--cream:#fbf8f0;--gold:#efb95f;--muted:#60727d;--line:#cfdfdf}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--navy),#246378);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;font-size:17px}.shell{width:min(calc(100% - 8vw),1180px);margin:auto;padding:34px 0 55px}.top{display:flex;align-items:center;justify-content:space-between;color:#fff}.brand{display:flex;align-items:center;gap:11px;font-weight:850}.mark{display:grid;width:53px;height:53px;place-items:center;border:1px solid rgba(255,255,255,.25);border-radius:16px;background:rgba(255,255,255,.1)}.top-actions,.language{display:flex;align-items:center;gap:8px}.language{padding:3px;border:1px solid rgba(255,255,255,.25);border-radius:11px}.language button{padding:6px 9px;border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,.7);font-weight:850}.language button.active{background:#fff;color:var(--navy)}.home-link{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid rgba(255,255,255,.25);border-radius:11px;color:#fff;text-decoration:none;font-size:12px;font-weight:850}.home-link span:first-child{font-size:20px;line-height:1}.content{display:grid;grid-template-columns:.7fr 1.3fr;align-items:center;gap:7vw;padding-top:55px}.intro{color:#fff}.label{color:#a7ebe5;font-size:12px;font-weight:850;letter-spacing:.12em}h1{margin:15px 0 20px;font-size:clamp(3.4rem,6vw,6.3rem);line-height:.93;letter-spacing:-.065em}.intro>p{color:rgba(255,255,255,.7);line-height:1.7}.direct{display:grid;gap:9px;margin-top:25px}.direct div{display:flex;gap:10px;color:rgba(255,255,255,.78);font-size:13px}.card{padding:34px;border-radius:25px;background:var(--cream);box-shadow:0 24px 70px rgba(24,48,68,.16)}.card h2{margin:4px 0 6px;font-size:34px}.card>p{margin:0 0 22px;color:var(--muted);font-size:13px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:850}.field input,.field textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;outline:0}.field textarea{min-height:130px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--aqua);box-shadow:0 0 0 4px rgba(97,200,197,.14)}.submit{width:100%;min-height:52px;margin-top:16px;border:0;border-radius:13px;background:var(--navy);color:#fff;font-weight:850}.message{display:none;margin:12px 0 0;padding:11px;border-radius:10px;font-size:12px}.message.show{display:block}.message.error{background:#ffe5df;color:#843426}.message.success{background:var(--mint);color:#175e55}.actions{display:flex;gap:9px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}.actions a{display:inline-flex;min-height:43px;align-items:center;padding:0 13px;border:1px solid var(--line);border-radius:11px;color:var(--blue);text-decoration:none;font-size:12px;font-weight:850}@media(max-width:850px){.content{grid-template-columns:1fr}.shell{width:calc(100% - 34px)}.card{margin-top:25px}}@media(max-width:560px){.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.actions{flex-direction:column}}</style><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="pie-sitio.css"><link rel="stylesheet" href="encabezado-mejorado.css"></head><body><main class="shell"><header class="top"><div class="brand"><span class="mark">SC</span><span data-en="Wisdom Without Code" data-es="Sabiduría Sin Códigos">Wisdom Without Code</span></div><div class="top-actions"><div class="language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button></div><a class="home-link" id="homeLink" href="/course/" aria-label="Course home"><span aria-hidden="true">⌂</span><span data-en="Home" data-es="Inicio">Home</span></a></div></header><div class="content"><section class="intro"><span class="label" data-en="CONTACT INFORMATION" data-es="INFORMACIÓN DE CONTACTO">CONTACT INFORMATION</span><h1 data-en="Send us a message." data-es="Escríbanos un mensaje.">Send us a message.</h1><p data-en="Complete the form and your inquiry will be stored locally. The response target is two business days." data-es="Complete el formulario y su consulta quedará guardada localmente. La meta de respuesta es de dos días hábiles.">Complete the form and your inquiry will be stored locally. The response target is two business days.</p><div class="direct"><div>✉️ <strong id="contactEmail"></strong></div><div>☎️ <strong id="contactPhone"></strong></div><div>📍 <strong id="contactLocation"></strong></div></div></section><section class="card"><h2 data-en="How can we help?" data-es="¿Cómo podemos ayudarle?">How can we help?</h2><p data-en="All fields are required to save your inquiry." data-es="Todos los campos son necesarios para guardar correctamente la consulta.">All fields are required to save your inquiry.</p><form id="contactForm"><div class="form-grid"><div class="field"><label for="fullName" data-en="Full name" data-es="Nombre completo">Full name</label><input id="fullName" name="fullName" required minlength="2" maxlength="100" data-placeholder-en="First and last name" data-placeholder-es="Nombre y apellidos"></div><div class="field"><label for="email" data-en="Email address" data-es="Correo electrónico">Email address</label><input id="email" name="email" type="email" required maxlength="254" data-placeholder-en="name@example.com" data-placeholder-es="nombre@ejemplo.com"></div><div class="field full"><label for="subject" data-en="Subject" data-es="Asunto">Subject</label><input id="subject" name="subject" required minlength="3" maxlength="150" data-placeholder-en="Course information" data-placeholder-es="Información sobre el curso"></div><div class="field full"><label for="messageText" data-en="Message" data-es="Mensaje">Message</label><textarea id="messageText" name="messageText" required minlength="10" maxlength="5000" data-placeholder-en="Write your inquiry here..." data-placeholder-es="Escriba aquí su consulta..."></textarea></div></div><button class="submit" type="submit" data-en="Send message" data-es="Enviar mensaje">Send message</button><p class="message" id="formMessage" role="status"></p></form><div class="actions"><a href="/register" data-en="Register for the course" data-es="Registrarme en el curso">Register for the course</a><a href="/login" data-en="I already have an account" data-es="Ya tengo una cuenta">I already have an account</a></div></section></div></main><script>let lang=localStorage.getItem('id-course-language')||'en';function applyLanguage(){document.documentElement.lang=lang;document.title=lang==='en'?'Contact | Wisdom Without Code':'Contacto | Sabiduría Sin Códigos';document.querySelectorAll('[data-en]').forEach(el=>el.textContent=el.dataset[lang]);document.querySelectorAll('[data-placeholder-en]').forEach(el=>el.placeholder=el.dataset['placeholder'+(lang==='en'?'En':'Es')]);document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang))}document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;localStorage.setItem('id-course-language',lang);applyLanguage()}));const homeLink=document.getElementById('homeLink');if(location.protocol==='file:')homeLink.href='independencia-digital-ia.html';const contactInformation={email:'informacion@suempresa.com',phone:'+506 0000-0000',location:'Costa Rica'};document.getElementById('contactEmail').textContent=contactInformation.email;document.getElementById('contactPhone').textContent=contactInformation.phone;document.getElementById('contactLocation').textContent=contactInformation.location;const form=document.getElementById('contactForm'),formMessage=document.getElementById('formMessage'),submit=form.querySelector('.submit');form.addEventListener('submit',async event=>{event.preventDefault();formMessage.className='message';submit.disabled=true;try{if(location.protocol==='file:')throw new Error('local');const response=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fullName:form.fullName.value,email:form.email.value,subject:form.subject.value,message:form.messageText.value})});const result=await response.json();if(!response.ok)throw new Error(result.error);form.reset();formMessage.textContent=lang==='en'?'Your message was saved successfully. Our response target is two business days.':result.message;formMessage.className='message success show'}catch(error){formMessage.textContent=lang==='en'?(error.message==='local'?'Open ABRIR-CURSO-PRIVADO.bat to send the message.':'Please review the information and try again.'):(error.message==='local'?'Abra ABRIR-CURSO-PRIVADO.bat para enviar el mensaje.':error.message);formMessage.className='message error show'}finally{submit.disabled=false}});applyLanguage();</script><script src="pie-sitio.js"></script></body></html>
