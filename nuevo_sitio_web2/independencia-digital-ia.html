  <script>

    const documentModuleDetailsEs=["\u003cdiv class=\"doc-divider\"\u003eM\u0026#243;dulo 1: Mi Primer Encuentro con la Inteligencia Artificial (IA)\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eContenidoPrimeros Pasos con Confianza: Un viaje desde los or\u0026#237;genes de la tecnolog\u0026#237;a hasta el presente.Se utilizar\u0026#225;n analog\u0026#237;as sencillas, como la del Chef Robot, para entender que la Inteligencia Artificial no es magia, sino una herramienta que aprende de la informaci\u0026#243;n para ayudarnos en tareas cotidianas.El objetivo principal ser\u0026#225; perder el miedo y comprender el porqu\u0026#233; de esta revoluci\u0026#243;n tecnol\u0026#243;gica.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.1 Dar los primeros pasos con confianza\u003c/h3\u003e\u003cp\u003eCuando aparece una tecnolog\u0026#237;a nueva, es normal sentir dudas. Muchas personas se preguntan si ser\u0026#225; dif\u0026#237;cil, si podr\u0026#225;n usarla o si puede representar un riesgo. Estas preguntas son razonables. Aprender IA no significa confiar ciegamente en una m\u0026#225;quina; significa entenderla lo suficiente para usarla con criterio.\u003c/p\u003e\u003cp\u003eLa IA es una tecnolog\u0026#237;a que permite que una computadora realice tareas que antes asoci\u0026#225;bamos con la inteligencia humana: responder preguntas, ordenar informaci\u0026#243;n, reconocer im\u0026#225;genes, traducir textos o sugerir ideas. La diferencia con una calculadora tradicional es que la IA no solo sigue una operaci\u0026#243;n fija; puede trabajar con lenguaje, contexto y ejemplos.\u003c/p\u003e\u003cp\u003ePiense en un asistente que puede leer una instrucci\u0026#243;n, organizar ideas y proponer un resultado. Ese asistente puede ser muy \u0026#250;til, pero no conoce todos los detalles de su vida. Por eso la decisi\u0026#243;n final siempre queda en sus manos.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eExplicaci\u0026#243;n sencillaLa IA no es una persona dentro de la computadora. Es una herramienta entrenada con informaci\u0026#243;n. Puede ayudar mucho, pero siempre debe revisarse.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.2 Un viaje desde los or\u0026#237;genes de la tecnolog\u0026#237;a hasta hoy\u003c/h3\u003e\u003cp\u003eLa historia de la IA forma parte de una historia m\u0026#225;s grande: la historia de c\u0026#243;mo las personas han creado herramientas para resolver problemas. Primero usamos herramientas f\u0026#237;sicas. Despu\u0026#233;s llegaron calculadoras, computadoras, internet, tel\u0026#233;fonos inteligentes y asistentes digitales.\u003c/p\u003e\u003cp\u003eEn la d\u0026#233;cada de 1950 se comenz\u0026#243; a hablar formalmente de m\u0026#225;quinas capaces de imitar algunos procesos del pensamiento humano. En ese momento las computadoras eran grandes, costosas y limitadas. Durante a\u0026#241;os, la IA avanz\u0026#243; lentamente porque faltaban tres elementos: suficiente informaci\u0026#243;n, suficiente velocidad de c\u0026#243;mputo y formas m\u0026#225;s flexibles de aprender de los datos.\u003c/p\u003e\u003cp\u003eCon internet, millones de documentos, im\u0026#225;genes y conversaciones comenzaron a estar disponibles en formato digital. Con la nube, las computadoras pudieron trabajar con m\u0026#225;s potencia. Con los tel\u0026#233;fonos inteligentes, la tecnolog\u0026#237;a lleg\u0026#243; al bolsillo de casi todos. Finalmente, con los modelos conversacionales, la IA comenz\u0026#243; a sentirse cercana porque se pod\u0026#237;a usar con palabras normales.\u003c/p\u003e\u003cp\u003eEl cambio importante no fue solamente t\u0026#233;cnico. Fue humano: por primera vez, una persona pod\u0026#237;a escribir una pregunta sencilla y recibir una respuesta organizada sin estudiar programaci\u0026#243;n. Este cambio hizo que la IA pasara de ser una tecnolog\u0026#237;a de laboratorio a una herramienta de uso cotidiano.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.3 La analog\u0026#237;a del Chef Robot\u003c/h3\u003e\u003cp\u003eImagine un chef robot que nunca ha cocinado. Primero se le muestran miles de recetas, ingredientes, fotos de platillos y videos de cocina. Con el tiempo, el robot aprende que ciertos ingredientes combinan, que algunas recetas siguen pasos parecidos y que algunos resultados son m\u0026#225;s comunes.\u003c/p\u003e\u003cp\u003eLa IA aprende de una forma parecida. Observa much\u0026#237;simos ejemplos y luego produce una respuesta nueva basada en patrones. Esto no significa que tenga gusto, memoria personal o conciencia. Significa que puede organizar informaci\u0026#243;n de una manera \u0026#250;til.\u003c/p\u003e\u003cp\u003eSi le pide una receta sencilla con pollo, arroz y vegetales, la herramienta no est\u0026#225; cocinando ni probando la comida. Est\u0026#225; combinando patrones de recetas que vio antes para proponer una opci\u0026#243;n razonable. Usted luego decide si la receta le sirve, si debe cambiar ingredientes o si conviene verificar algo.\u003c/p\u003e\u003cp\u003eLa analog\u0026#237;a tambi\u0026#233;n ayuda a entender los errores. Si el chef robot aprendi\u0026#243; de recetas incompletas, podr\u0026#237;a sugerir algo extra\u0026#241;o. De la misma manera, una IA puede equivocarse si interpreta mal la pregunta o si no tiene informaci\u0026#243;n suficiente.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eEjemplo pr\u0026#225;cticoC\u0026#243;digo: \u0026quot;Dame una receta sencilla con arroz, pollo y vegetales. Usa pasos cortos y no incluyas ingredientes dif\u0026#237;ciles de conseguir.\u0026quot;Despu\u0026#233;s de leer la respuesta, puede pedir: \u0026quot;Hazla m\u0026#225;s saludable\u0026quot; o \u0026quot;hazla m\u0026#225;s econ\u0026#243;mica\u0026quot;.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.4 Conceptos b\u0026#225;sicos sin tecnicismos\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eConcepto\u003c/td\u003e\u003ctd\u003eExplicaci\u0026#243;n sencilla\u003c/td\u003e\u003ctd\u003eEjemplo cotidiano\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDato\u003c/td\u003e\u003ctd\u003eUna pieza de informaci\u0026#243;n que la IA puede usar.\u003c/td\u003e\u003ctd\u003eUna receta, una foto, una frase o una fecha.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eModelo\u003c/td\u003e\u003ctd\u003eLa herramienta que aprendi\u0026#243; patrones a partir de datos.\u003c/td\u003e\u003ctd\u003eUn asistente que responde preguntas.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eEntrenamiento\u003c/td\u003e\u003ctd\u003eProceso en el que la IA aprende de muchos ejemplos.\u003c/td\u003e\u003ctd\u003eEl Chef Robot revisando miles de recetas.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRespuesta\u003c/td\u003e\u003ctd\u003eLo que la IA produce cuando usted pregunta.\u003c/td\u003e\u003ctd\u003eUn resumen, una lista o una carta.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eVerificaci\u0026#243;n\u003c/td\u003e\u003ctd\u003eRevisar si la respuesta es correcta.\u003c/td\u003e\u003ctd\u003eConfirmar horario en una p\u0026#225;gina oficial.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.5 \u0026#191;D\u0026#243;nde usamos IA sin darnos cuenta?\u003c/h3\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eEl tel\u0026#233;fono agrupa fotos por personas, lugares o fechas.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eGoogle Maps sugiere la ruta m\u0026#225;s r\u0026#225;pida y detecta tr\u0026#225;fico.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eNetflix o YouTube recomiendan contenido seg\u0026#250;n sus intereses.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eEl banco puede detectar compras sospechosas.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eEl correo electr\u0026#243;nico filtra mensajes no deseados.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eUn traductor autom\u0026#225;tico convierte frases de un idioma a otro.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eLas c\u0026#225;maras mejoran fotos ajustando luz, enfoque y colores.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eLos asistentes de voz reconocen preguntas y ejecutan comandos simples.\u003c/p\u003e\u003c/div\u003e\u003cp\u003eEsto demuestra que la IA no es un mundo totalmente lejano. Ya la hemos estado usando en peque\u0026#241;as formas. La diferencia es que ahora aprenderemos a usarla de manera consciente, con preguntas claras y medidas de seguridad.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.6 Compa\u0026#241;ias que dieron origen a la IA y agregue logos\u003c/h3\u003e\u003cp\u003eCuando hablamos de IA moderna, escuchamos nombres de compa\u0026#241;\u0026#237;as. Conocer brevemente sus historias ayuda a entender por qu\u0026#233; existen varias herramientas y por qu\u0026#233; no todas sirven para lo mismo.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCompa\u0026#241;\u0026#237;a\u003c/td\u003e\u003ctd\u003eHistoria ampliada\u003c/td\u003e\u003ctd\u003eQu\u0026#233; herramienta o idea aporta\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOpenAI\u003c/td\u003e\u003ctd\u003eSe fund\u0026#243; en 2015 con una misi\u0026#243;n centrada en desarrollar IA avanzada y estudiar c\u0026#243;mo hacerla beneficiosa. ChatGPT se present\u0026#243; p\u0026#250;blicamente el 30 de noviembre de 2022. Su impacto fue grande porque convirti\u0026#243; modelos complejos en una conversaci\u0026#243;n sencilla.\u003c/td\u003e\u003ctd\u003eChatGPT populariz\u0026#243; la idea de escribir una pregunta normal y recibir una respuesta organizada.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGoogle\u003c/td\u003e\u003ctd\u003eGoogle ha usado IA durante a\u0026#241;os en b\u0026#250;squedas, traducci\u0026#243;n, mapas, fotos y reconocimiento de voz. Gemini fue anunciado en diciembre de 2023 como una familia de modelos multimodales, es decir, capaces de trabajar con texto, im\u0026#225;genes, audio, video y c\u0026#243;digo.\u003c/td\u003e\u003ctd\u003eGemini conecta IA con herramientas conocidas como b\u0026#250;squeda, documentos, Android y servicios de Google.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMicrosoft\u003c/td\u003e\u003ctd\u003eMicrosoft ha trabajado con IA durante d\u0026#233;cadas, pero Copilot marc\u0026#243; una etapa nueva al integrar asistentes en Word, Excel, Outlook, Teams y Windows. Microsoft 365 Copilot fue anunciado en marzo de 2023.\u003c/td\u003e\u003ctd\u003eCopilot lleva la IA al trabajo diario con documentos, correos, tablas y presentaciones.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAnthropic\u003c/td\u003e\u003ctd\u003eAnthropic fue fundada en 2021 por investigadores que hab\u0026#237;an trabajado en IA avanzada. Su enfoque p\u0026#250;blico enfatiza seguridad, confiabilidad e interpretabilidad. Su asistente Claude es conocido por trabajar bien con textos largos.\u003c/td\u003e\u003ctd\u003eClaude representa una l\u0026#237;nea de herramientas centradas en seguridad y manejo de documentos extensos.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePerplexity\u003c/td\u003e\u003ctd\u003ePerplexity apareci\u0026#243; como un motor de respuestas con IA fundado en 2022. Su propuesta es responder preguntas usando b\u0026#250;squeda web y mostrando fuentes.\u003c/td\u003e\u003ctd\u003eAyuda a practicar verificaci\u0026#243;n, porque invita a revisar de d\u0026#243;nde sale una respuesta.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.7 M\u0026#225;s hitos que ayudan a entender la revoluci\u0026#243;n\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eHito\u003c/td\u003e\u003ctd\u003eQu\u0026#233; ocurri\u0026#243;\u003c/td\u003e\u003ctd\u003ePor qu\u0026#233; ayuda a entender el presente\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eELIZA (a\u0026#241;os 1960)\u003c/td\u003e\u003ctd\u003eUno de los primeros programas que simulaba conversaci\u0026#243;n.\u003c/td\u003e\u003ctd\u003eMostr\u0026#243; que las personas pod\u0026#237;an sentir que una m\u0026#225;quina conversaba.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDeep Blue (1997)\u003c/td\u003e\u003ctd\u003eUna computadora de IBM derrot\u0026#243; al campe\u0026#243;n mundial de ajedrez Garry Kasparov.\u003c/td\u003e\u003ctd\u003eDemostr\u0026#243; fuerza en tareas muy espec\u0026#237;ficas.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWatson (2011)\u003c/td\u003e\u003ctd\u003eIBM Watson gan\u0026#243; en el programa Jeopardy!.\u003c/td\u003e\u003ctd\u003eMostr\u0026#243; avances en preguntas y respuestas.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAlphaGo (2016)\u003c/td\u003e\u003ctd\u003eUn sistema de DeepMind venci\u0026#243; a campeones del juego Go.\u003c/td\u003e\u003ctd\u003eMostr\u0026#243; que la IA pod\u0026#237;a aprender estrategias complejas.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eChatGPT (2022)\u003c/td\u003e\u003ctd\u003eUna herramienta conversacional lleg\u0026#243; al p\u0026#250;blico general.\u003c/td\u003e\u003ctd\u003eLa IA se volvi\u0026#243; f\u0026#225;cil de probar en la vida diaria.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.8 Historia en las noticias: el momento ChatGPT\u003c/h3\u003e\u003cp\u003eCuando ChatGPT se hizo p\u0026#250;blico, muchas personas lo probaron por curiosidad: estudiantes, trabajadores, maestros, periodistas, programadores y familias. Lo sorprendente no fue solo que respondiera, sino que respondiera en lenguaje cotidiano. Para muchas personas, esa fue la primera vez que la IA dej\u0026#243; de parecer ciencia ficci\u0026#243;n.\u003c/p\u003e\u003cp\u003eEse momento inici\u0026#243; una carrera mundial. Google respondi\u0026#243; con Gemini, Microsoft integr\u0026#243; Copilot en sus productos y otras compa\u0026#241;\u0026#237;as lanzaron asistentes propios. Desde entonces, la conversaci\u0026#243;n p\u0026#250;blica cambi\u0026#243;: ya no se pregunta si la IA llegar\u0026#225;, sino c\u0026#243;mo debemos aprender a usarla con seguridad.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eLecci\u0026#243;n del m\u0026#243;duloLa IA avanz\u0026#243; porque se unieron tres cosas: mucha informaci\u0026#243;n, computadoras m\u0026#225;s potentes y herramientas f\u0026#225;ciles de usar. La parte f\u0026#225;cil de usar es la que nos permite aprender hoy.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e1.9 Pr\u0026#225;ctica paso a paso: explicar IA con palabras sencillas\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo de pr\u0026#225;cticaExpl\u0026#237;came qu\u0026#233; es la Inteligencia Artificial en palabras sencillas, con tres ejemplos de la vida diaria.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAbra ChatGPT, Gemini o la herramienta disponible.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCopie el c\u0026#243;digo de pr\u0026#225;ctica.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eLea la respuesta sin prisa.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAnote una frase que s\u0026#237; entendi\u0026#243;.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida una segunda versi\u0026#243;n: \u0026quot;Expl\u0026#237;calo con la analog\u0026#237;a del Chef Robot\u0026quot;.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCompare cu\u0026#225;l explicaci\u0026#243;n le result\u0026#243; m\u0026#225;s clara.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eDespu\u0026#233;s de practicarLo importante no es memorizar la respuesta. Lo importante es descubrir qu\u0026#233; explicaci\u0026#243;n le ayuda a entender mejor.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e1.10 Pr\u0026#225;ctica paso a paso: encontrar IA en mi rutina\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo de pr\u0026#225;cticaAy\u0026#250;dame a identificar cinco lugares donde uso Inteligencia Artificial sin darme cuenta. Preg\u0026#250;ntame primero qu\u0026#233; aplicaciones uso.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEscriba el c\u0026#243;digo.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eResponda las preguntas de la herramienta.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise la lista que recibi\u0026#243;.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eMarque cu\u0026#225;les ejemplos usa realmente.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAgregue un ejemplo propio.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eDespu\u0026#233;s de practicarAl finalizar, escriba una frase: \u0026quot;Hoy descubr\u0026#237; que ya uso IA cuando...\u0026quot;\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e1.11 Caso cotidiano: entender una palabra nueva\u003c/h4\u003e\u003cp\u003eUsted escucha en las noticias la palabra \u0026quot;algoritmo\u0026quot; y no sabe exactamente qu\u0026#233; significa. En lugar de ignorarla, puede pedir una explicaci\u0026#243;n sencilla y ejemplos.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eReto pr\u0026#225;cticoPedir una explicaci\u0026#243;n clara, sin tecnicismos, y luego pedir una analog\u0026#237;a.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoExpl\u0026#237;came qu\u0026#233; es un algoritmo con palabras sencillas y dame una analog\u0026#237;a de cocina.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e1.12 Caso cotidiano: comparar antes y despu\u0026#233;s\u003c/h4\u003e\u003cp\u003eUsted quiere entender c\u0026#243;mo cambi\u0026#243; la tecnolog\u0026#237;a desde las computadoras antiguas hasta los asistentes actuales.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eReto pr\u0026#225;cticoPedir una comparaci\u0026#243;n en tabla para ver la evoluci\u0026#243;n.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoCompara una computadora antigua, un tel\u0026#233;fono inteligente y un asistente de IA en una tabla sencilla.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.13 Resumen del m\u0026#243;dulo\u003c/h3\u003e\u003cp\u003eLa IA no es magia. Es una herramienta que aprende de informaci\u0026#243;n y puede ayudarle a realizar tareas cotidianas. Lo m\u0026#225;s importante es conservar el control: preguntar, revisar y decidir.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.14 Ejercicio de cierre\u003c/h3\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eEscriba dos actividades de su vida diaria donde ya ha usado tecnolog\u0026#237;a inteligente.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eEscriba una tarea que le gustar\u0026#237;a hacer m\u0026#225;s f\u0026#225;cil con IA.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eExplique con sus palabras la analog\u0026#237;a del Chef Robot.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eEscriba una pregunta que todav\u0026#237;a tenga sobre la IA.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"doc-divider\"\u003eM\u0026#243;dulo 1 ampliado: Mi Primer Encuentro con la Inteligencia Artificial (IA)\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.A Lectura ampliada: por qu\u0026#233; la IA se siente diferente\u003c/h3\u003e\u003cp\u003eLa IA se siente diferente a otras tecnolog\u0026#237;as porque conversa. Una calculadora espera n\u0026#250;meros; un buscador espera palabras clave; una aplicaci\u0026#243;n tradicional muestra botones. Un asistente de IA, en cambio, permite escribir una pregunta completa, pedir una explicaci\u0026#243;n y continuar la conversaci\u0026#243;n. Esa sensaci\u0026#243;n de di\u0026#225;logo hace que parezca m\u0026#225;s humana de lo que realmente es.\u003c/p\u003e\u003cp\u003eComprender esta diferencia es importante. La IA puede responder de manera natural, pero no significa que tenga intenci\u0026#243;n, emociones o sabidur\u0026#237;a propia. Su fortaleza est\u0026#225; en organizar lenguaje y patrones. La sabidur\u0026#237;a sigue estando en la persona que pregunta, revisa y decide.\u003c/p\u003e\u003cp\u003ePor eso el primer aprendizaje no es t\u0026#233;cnico: es aprender a relacionarse con la herramienta. Una buena relaci\u0026#243;n con la IA combina curiosidad y prudencia. Curiosidad para explorar. Prudencia para verificar.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.B Historia ampliada: de reglas a aprendizaje\u003c/h3\u003e\u003cp\u003eEn los primeros sistemas de IA, los programadores escrib\u0026#237;an muchas reglas. Por ejemplo: si una persona tiene cierto s\u0026#237;ntoma, entonces el sistema suger\u0026#237;a revisar cierta posibilidad. Estos sistemas pod\u0026#237;an ayudar, pero eran r\u0026#237;gidos. Si la situaci\u0026#243;n cambiaba, el sistema no siempre respond\u0026#237;a bien.\u003c/p\u003e\u003cp\u003eLa IA moderna cambi\u0026#243; porque aprendi\u0026#243; a trabajar con ejemplos. En lugar de escribir cada regla a mano, los modelos analizan grandes cantidades de informaci\u0026#243;n y detectan patrones. Esta es la raz\u0026#243;n por la que pueden responder preguntas variadas, traducir, resumir, clasificar im\u0026#225;genes y generar textos.\u003c/p\u003e\u003cp\u003eEsta evoluci\u0026#243;n tambi\u0026#233;n trae responsabilidades. Cuando una herramienta aprende de muchos datos, puede aprender informaci\u0026#243;n incompleta, sesgos o errores. Por eso ninguna respuesta debe recibirse como verdad absoluta.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.C Ejemplo paso a paso: aprender una palabra tecnol\u0026#243;gica\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSituaci\u0026#243;nUsted escucha la palabra \u0026quot;modelo de IA\u0026quot; y no sabe qu\u0026#233; significa. En lugar de quedarse con la duda, puede pedir una explicaci\u0026#243;n sencilla.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo inicialExpl\u0026#237;came qu\u0026#233; es un modelo de IA en palabras sencillas.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eLea la primera respuesta.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eSi todav\u0026#237;a parece complicada, escriba: \u0026quot;hazlo m\u0026#225;s simple\u0026quot;.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eLuego escriba: \u0026quot;dame una analog\u0026#237;a con una receta\u0026quot;.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eDespu\u0026#233;s pida: \u0026quot;dame tres ejemplos de modelos de IA en la vida diaria\u0026quot;.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAnote la explicaci\u0026#243;n que mejor entendi\u0026#243;.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.D Mini historias para practicar comprensi\u0026#243;n\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eHistoria\u003c/td\u003e\u003ctd\u003eQu\u0026#233; demuestra\u003c/td\u003e\u003ctd\u003eC\u0026#243;digo para practicar\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eUna aplicaci\u0026#243;n de fotos agrupa im\u0026#225;genes de una misma persona.\u003c/td\u003e\u003ctd\u003eLa IA reconoce patrones visuales.\u003c/td\u003e\u003ctd\u003eExpl\u0026#237;came c\u0026#243;mo una aplicaci\u0026#243;n puede agrupar fotos por personas sin usar palabras dif\u0026#237;ciles.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eUn mapa calcula una ruta distinta porque hay tr\u0026#225;fico.\u003c/td\u003e\u003ctd\u003eLa IA usa datos cambiantes.\u003c/td\u003e\u003ctd\u003eExpl\u0026#237;came c\u0026#243;mo una aplicaci\u0026#243;n de mapas decide una ruta alternativa.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eUna tienda recomienda productos parecidos a lo que vio antes.\u003c/td\u003e\u003ctd\u003eLa IA detecta preferencias.\u003c/td\u003e\u003ctd\u003eExpl\u0026#237;came c\u0026#243;mo una tienda en l\u0026#237;nea recomienda productos.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eEl correo env\u0026#237;a mensajes extra\u0026#241;os a spam.\u003c/td\u003e\u003ctd\u003eLa IA clasifica informaci\u0026#243;n.\u003c/td\u003e\u003ctd\u003eExpl\u0026#237;came c\u0026#243;mo un filtro de correo identifica mensajes sospechosos.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.E Noticias y conversaci\u0026#243;n p\u0026#250;blica sobre IA\u003c/h3\u003e\u003cp\u003eLa llegada de herramientas conversacionales produjo debates en escuelas, empresas, familias y gobiernos. Algunas personas vieron oportunidades para aprender m\u0026#225;s r\u0026#225;pido. Otras se preocuparon por errores, privacidad, empleos y desinformaci\u0026#243;n. Ambas reacciones son comprensibles.\u003c/p\u003e\u003cp\u003eEl prop\u0026#243;sito de este curso no es decir que la IA es perfecta ni que debe evitarse. El prop\u0026#243;sito es aprender a usarla con equilibrio. Las tecnolog\u0026#237;as importantes no desaparecen porque sean complejas; se vuelven m\u0026#225;s seguras cuando las personas aprenden a comprenderlas.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.F Pr\u0026#225;cticas adicionales del m\u0026#243;dulo 1\u003c/h3\u003e\u003ch4\u003ePracticar explicaci\u0026#243;n por analog\u0026#237;a\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoExpl\u0026#237;came la IA usando una analog\u0026#237;a de biblioteca.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eDespu\u0026#233;s de recibir la respuesta, pida una versi\u0026#243;n m\u0026#225;s corta y compare cu\u0026#225;l entiende mejor.\u003c/p\u003e\u003ch4\u003ePracticar resumen hist\u0026#243;rico\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoResume la historia de la IA en 6 puntos sencillos.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eDespu\u0026#233;s de recibir la respuesta, pida una versi\u0026#243;n m\u0026#225;s corta y compare cu\u0026#225;l entiende mejor.\u003c/p\u003e\u003ch4\u003ePracticar preguntas de curiosidad\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoHazme 5 preguntas para descubrir c\u0026#243;mo podr\u0026#237;a usar IA en mi vida diaria.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eDespu\u0026#233;s de recibir la respuesta, pida una versi\u0026#243;n m\u0026#225;s corta y compare cu\u0026#225;l entiende mejor.\u003c/p\u003e\u003ch4\u003ePracticar l\u0026#237;mites\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoDime tres cosas que la IA puede hacer bien y tres cosas que debo verificar.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eDespu\u0026#233;s de recibir la respuesta, pida una versi\u0026#243;n m\u0026#225;s corta y compare cu\u0026#225;l entiende mejor.\u003c/p\u003e\u003c/section\u003e","\u003cdiv class=\"doc-divider\"\u003eM\u0026#243;dulo 2: Inteligencia Artificial (IA) para la Vida Diaria\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eContenidoUtilidad Real: Un recorrido pr\u0026#225;ctico por el ecosistema de los asistentes virtuales m\u0026#225;s potentes.Conoceremos las diferencias y ventajas de ChatGPT, Google Gemini y Microsoft Copilot.Se aprender\u0026#225; a identificar cu\u0026#225;l de estas herramientas se adapta mejor a sus necesidades personales, ya sea para organizar informaci\u0026#243;n, buscar datos o crear contenido.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.1 \u0026#191;Qu\u0026#233; es un asistente virtual de IA?\u003c/h3\u003e\u003cp\u003eUn asistente virtual de IA es una herramienta que recibe una instrucci\u0026#243;n y responde con texto, ideas, listas, res\u0026#250;menes o propuestas. Usted puede pedirle ayuda para escribir un mensaje, organizar un viaje, entender un documento o preparar preguntas.\u003c/p\u003e\u003cp\u003eLa clave es recordar que el asistente propone. Usted decide. La herramienta no conoce todos los detalles de su vida, por eso es importante darle contexto y revisar la respuesta. Si la informaci\u0026#243;n tiene consecuencias importantes, debe verificarse antes de usarla.\u003c/p\u003e\u003cp\u003eUna forma sencilla de pensar en estas herramientas es compararlas con diferentes tipos de ayudantes: uno conversa muy bien, otro busca informaci\u0026#243;n, otro trabaja dentro de documentos y otro ayuda con dise\u0026#241;os. No hay una sola herramienta perfecta para todo.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.2 ChatGPT: conversaci\u0026#243;n y explicaci\u0026#243;n\u003c/h3\u003e\u003cp\u003eChatGPT se hizo conocido porque permiti\u0026#243; conversar con IA de forma sencilla. Fue desarrollado por OpenAI y se volvi\u0026#243; popular a partir de 2022. Muchas personas lo usan para redactar, resumir, traducir, explicar temas y practicar ideas.\u003c/p\u003e\u003cp\u003eLa historia de OpenAI ayuda a entender por qu\u0026#233; ChatGPT caus\u0026#243; tanto impacto. Antes, la IA parec\u0026#237;a reservada para laboratorios o expertos. ChatGPT puso una ventana de conversaci\u0026#243;n frente al p\u0026#250;blico: usted escribe y la herramienta responde.\u003c/p\u003e\u003cp\u003eChatGPT es especialmente \u0026#250;til cuando quiere explicar una idea, mejorar un texto o practicar una conversaci\u0026#243;n. Tambi\u0026#233;n puede ayudar a transformar un texto complicado en una versi\u0026#243;n m\u0026#225;s sencilla.\u003c/p\u003e\u003ch4\u003eUsos pr\u0026#225;cticos de ChatGPT\u003c/h4\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eRedactar una carta formal o un mensaje familiar.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003ePedir una explicaci\u0026#243;n sencilla de una noticia.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eCrear una lista de compras por categor\u0026#237;as.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003ePreparar preguntas para una cita m\u0026#233;dica.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eConvertir un texto largo en un resumen corto.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003ePracticar una conversaci\u0026#243;n dif\u0026#237;cil antes de tenerla.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003ePedir ideas para organizar un proyecto personal.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003ePr\u0026#225;ctica paso a paso con ChatGPT: mensaje de cita\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo de pr\u0026#225;cticaAy\u0026#250;dame a redactar un mensaje amable para confirmar una cita ma\u0026#241;ana a las 10:00 a.m. Que sea breve y claro.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEscriba el c\u0026#243;digo.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eLea la respuesta.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida: \u0026quot;hazlo m\u0026#225;s corto\u0026quot;.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida: \u0026quot;hazlo m\u0026#225;s c\u0026#225;lido\u0026quot;.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eElija la versi\u0026#243;n que m\u0026#225;s se parece a su forma de hablar.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAntes de enviarlo, revise nombre, hora y fecha.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003ePr\u0026#225;ctica paso a paso con ChatGPT: resumen de texto\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo de pr\u0026#225;cticaResume este texto en cinco puntos sencillos y dime si hay algo que deba verificar: [pegue el texto sin datos privados].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCopie un texto que quiera entender.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eQuite datos personales.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePegue el c\u0026#243;digo y el texto.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eLea el resumen.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePregunte: \u0026quot;\u0026#191;qu\u0026#233; partes debo verificar?\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eBusque la fuente original si el tema es importante.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.3 Google Gemini: b\u0026#250;squeda, organizaci\u0026#243;n y contenido\u003c/h3\u003e\u003cp\u003eGoogle lleva muchos a\u0026#241;os usando IA en b\u0026#250;squeda, mapas, traducci\u0026#243;n, fotos y correo. Gemini representa una evoluci\u0026#243;n hacia asistentes que pueden trabajar con diferentes tipos de informaci\u0026#243;n, como texto e im\u0026#225;genes.\u003c/p\u003e\u003cp\u003eGemini puede ser \u0026#250;til si usted ya usa productos de Google o si desea investigar un tema. Tambi\u0026#233;n puede ayudar a organizar ideas, resumir una noticia o comparar opciones. Como toda herramienta de IA, debe revisarse cuando la informaci\u0026#243;n sea importante.\u003c/p\u003e\u003cp\u003eUna ventaja de Gemini es su relaci\u0026#243;n con el ecosistema de Google. Esto puede facilitar tareas relacionadas con documentos, b\u0026#250;squeda y organizaci\u0026#243;n. Sin embargo, la mejor herramienta siempre ser\u0026#225; la que usted pueda usar con comodidad y seguridad.\u003c/p\u003e\u003ch4\u003eUsos pr\u0026#225;cticos de Gemini\u003c/h4\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eResumir una noticia en puntos sencillos.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eOrganizar ideas para un viaje.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003ePreparar una lista de documentos para un tr\u0026#225;mite.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eExplicar una imagen o contenido visual.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eComparar opciones antes de tomar una decisi\u0026#243;n.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eOrdenar tareas por prioridad.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003ePr\u0026#225;ctica paso a paso con Gemini: noticia clara\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo de pr\u0026#225;cticaResume esta noticia en cinco puntos sencillos. Luego dime qu\u0026#233; datos deber\u0026#237;a verificar antes de creerla.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCopie una noticia corta.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePegue el c\u0026#243;digo con el texto.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eLea el resumen.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAnote los datos que la herramienta recomienda verificar.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eBusque una fuente oficial o una segunda fuente confiable.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003ePr\u0026#225;ctica paso a paso con Gemini: plan de tareas\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo de pr\u0026#225;cticaOrganiza estas tareas por prioridad y sugiere cu\u0026#225;les debo hacer hoy: [pegue una lista].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEscriba una lista de tareas reales.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida que las organice por prioridad.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise si el orden tiene sentido.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida una versi\u0026#243;n m\u0026#225;s simple si la respuesta es larga.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eDecida qu\u0026#233; har\u0026#225; primero.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.4 Microsoft Copilot: documentos, correos y tablas\u003c/h3\u003e\u003cp\u003eMicrosoft present\u0026#243; Copilot como una forma de integrar IA en herramientas de productividad. La idea es que la IA pueda ayudar dentro de Word, Excel, Outlook y otras aplicaciones que muchas personas ya conocen.\u003c/p\u003e\u003cp\u003eCopilot es especialmente \u0026#250;til cuando se trabaja con documentos, correos o tablas. Puede ayudar a mejorar un texto, resumir un correo largo o crear una tabla sencilla para organizar gastos. La clave es revisar el resultado antes de enviarlo o usarlo.\u003c/p\u003e\u003cp\u003eEn Word puede ayudar a redactar o mejorar textos. En Excel puede organizar informaci\u0026#243;n en tablas. En Outlook puede resumir correos y sugerir respuestas. Esto no elimina la necesidad de revisar; simplemente ahorra tiempo en el primer borrador.\u003c/p\u003e\u003ch4\u003eUsos pr\u0026#225;cticos de Copilot\u003c/h4\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eRedactar una carta en Word.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eResumir un correo largo en Outlook.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eCrear una tabla de gastos en Excel.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eOrganizar notas de una reuni\u0026#243;n.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eCambiar el tono de un mensaje para hacerlo m\u0026#225;s cordial.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eCrear un borrador de presentaci\u0026#243;n.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003ePr\u0026#225;ctica paso a paso con Copilot: tabla de gastos\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo de pr\u0026#225;cticaOrganiza estos gastos en una tabla por categor\u0026#237;a y calcula un total aproximado: [pegue lista de gastos].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEscriba una lista de gastos sin datos bancarios.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida una tabla por categor\u0026#237;a.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise si cada gasto qued\u0026#243; en la categor\u0026#237;a correcta.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida un resumen corto.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eUse la tabla solo despu\u0026#233;s de revisar los n\u0026#250;meros.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.5 Perplexity, Canva y herramientas creativas\u003c/h3\u003e\u003cp\u003eAdem\u0026#225;s de ChatGPT, Gemini y Copilot, existen herramientas que conviene conocer. Perplexity se presenta como un motor de respuestas que muestra fuentes. Canva ayuda a crear dise\u0026#241;os, invitaciones y presentaciones. DALL-E y otras herramientas visuales pueden generar im\u0026#225;genes a partir de texto.\u003c/p\u003e\u003cp\u003eEstas herramientas muestran que la IA no es una sola cosa. Algunas ayudan a pensar, otras a buscar, otras a escribir y otras a crear contenido visual. La mejor manera de aprenderlas es practicar con una necesidad concreta.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eHerramienta\u003c/td\u003e\u003ctd\u003eUso principal\u003c/td\u003e\u003ctd\u003eEjemplo\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePerplexity\u003c/td\u003e\u003ctd\u003eB\u0026#250;squeda con respuestas y fuentes\u003c/td\u003e\u003ctd\u003eBuscar informaci\u0026#243;n y revisar de d\u0026#243;nde viene.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eClaude\u003c/td\u003e\u003ctd\u003eLectura y an\u0026#225;lisis de textos largos\u003c/td\u003e\u003ctd\u003eResumir documentos extensos o comparar ideas.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCanva\u003c/td\u003e\u003ctd\u003eDise\u0026#241;o visual con apoyo de IA\u003c/td\u003e\u003ctd\u003eCrear una invitaci\u0026#243;n o una portada sencilla.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDALL-E / generadores de im\u0026#225;genes\u003c/td\u003e\u003ctd\u003eCrear im\u0026#225;genes a partir de texto\u003c/td\u003e\u003ctd\u003eDise\u0026#241;ar una imagen para una tarjeta.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNotebookLM\u003c/td\u003e\u003ctd\u003eOrganizar informaci\u0026#243;n propia\u003c/td\u003e\u003ctd\u003eHacer preguntas sobre documentos cargados por el usuario.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.6 Escoger la herramienta correcta\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eNecesidad\u003c/td\u003e\u003ctd\u003eHerramienta sugerida\u003c/td\u003e\u003ctd\u003ePor qu\u0026#233;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eQuiero que me expliquen algo con calma\u003c/td\u003e\u003ctd\u003eChatGPT\u003c/td\u003e\u003ctd\u003eEs fuerte en conversaci\u0026#243;n y explicaci\u0026#243;n.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eQuiero investigar y organizar informaci\u0026#243;n\u003c/td\u003e\u003ctd\u003eGemini o Perplexity\u003c/td\u003e\u003ctd\u003ePueden apoyar b\u0026#250;squeda y s\u0026#237;ntesis.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eQuiero trabajar con Word, Excel o Outlook\u003c/td\u003e\u003ctd\u003eMicrosoft Copilot\u003c/td\u003e\u003ctd\u003eEst\u0026#225; integrado con herramientas de Microsoft.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eQuiero crear una imagen o dise\u0026#241;o\u003c/td\u003e\u003ctd\u003eCanva, DALL-E u otra herramienta visual\u003c/td\u003e\u003ctd\u003eEst\u0026#225;n orientadas a creatividad.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eQuiero verificar una noticia\u003c/td\u003e\u003ctd\u003eGemini, Perplexity o b\u0026#250;squeda tradicional\u003c/td\u003e\u003ctd\u003eConviene comparar fuentes.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e2.7 Caso pr\u0026#225;ctico: organizar una semana ocupada\u003c/h4\u003e\u003cp\u003eImagine que tiene una semana con citas, llamadas, compras y una visita familiar. En lugar de escribir todo desordenado, puede pedir a la IA que lo convierta en un plan por d\u0026#237;as.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eReto pr\u0026#225;cticoCrear un plan semanal claro y f\u0026#225;cil de seguir.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoOrganiza esta lista de tareas por d\u0026#237;a y por prioridad. Hazlo en una tabla sencilla: [pegue lista].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e2.8 Caso pr\u0026#225;ctico: entender una carta o correo complicado\u003c/h4\u003e\u003cp\u003eA veces llega un correo largo con lenguaje formal. La IA puede resumirlo y destacar si pide dinero, datos personales o alguna acci\u0026#243;n urgente.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eReto pr\u0026#225;cticoComprender el mensaje sin responder todav\u0026#237;a.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoResume este correo en lenguaje sencillo. Luego dime si solicita dinero, contrase\u0026#241;as, c\u0026#243;digos o informaci\u0026#243;n sensible: [pegue texto sin datos privados].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e2.9 Caso pr\u0026#225;ctico: preparar una llamada importante\u003c/h4\u003e\u003cp\u003eAntes de llamar a una oficina, banco o compa\u0026#241;\u0026#237;a, puede pedir a la IA que prepare una lista de preguntas. As\u0026#237; evita olvidar puntos importantes.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eReto pr\u0026#225;cticoPreparar una conversaci\u0026#243;n organizada.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoAy\u0026#250;dame a preparar una lista de preguntas para llamar a [organizaci\u0026#243;n] sobre [tema]. Ord\u0026#233;nalas de la m\u0026#225;s importante a la menos importante.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.10 Historia en las noticias: cuando un chatbot se equivoca\u003c/h3\u003e\u003cp\u003eUn caso conocido ocurri\u0026#243; con Air Canada. Un cliente recibi\u0026#243; informaci\u0026#243;n incorrecta de un chatbot sobre una tarifa por duelo. El tribunal canadiense concluy\u0026#243; que la empresa era responsable por la informaci\u0026#243;n dada en su sitio. La lecci\u0026#243;n es sencilla: los asistentes pueden equivocarse, y por eso la informaci\u0026#243;n importante debe confirmarse.\u003c/p\u003e\u003cp\u003eEste caso es \u0026#250;til porque no se trataba de una herramienta desconocida. Era un chatbot dentro del sitio de una empresa. Aun as\u0026#237;, dio una respuesta equivocada. La ense\u0026#241;anza es clara: cuando hay dinero, viajes, tr\u0026#225;mites o pol\u0026#237;ticas oficiales, la respuesta de una IA debe compararse con la p\u0026#225;gina oficial o con un representante autorizado.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eLecci\u0026#243;n pr\u0026#225;cticaSi una IA le da informaci\u0026#243;n sobre dinero, viajes, salud, leyes o tr\u0026#225;mites, \u0026#250;sela como apoyo inicial. Antes de actuar, confirme con una fuente oficial.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.11 Hacia d\u0026#243;nde vamos en la vida diaria\u003c/h3\u003e\u003cp\u003eCada vez veremos m\u0026#225;s asistentes integrados en tel\u0026#233;fonos, navegadores, documentos y servicios. En lugar de abrir una aplicaci\u0026#243;n separada, la IA estar\u0026#225; dentro de las herramientas que ya usamos. Podr\u0026#225; ayudar a escribir, buscar, resumir, traducir, leer im\u0026#225;genes y organizar tareas.\u003c/p\u003e\u003cp\u003eEsto puede ahorrar tiempo, pero tambi\u0026#233;n exige criterio. La comodidad no debe reemplazar la revisi\u0026#243;n. La habilidad m\u0026#225;s valiosa ser\u0026#225; saber cu\u0026#225;ndo aceptar una sugerencia y cu\u0026#225;ndo verificarla.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.12 Ejercicio de cierre\u003c/h3\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEscriba tres necesidades personales donde una IA podr\u0026#237;a ayudarle.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eElija qu\u0026#233; herramienta usar\u0026#237;a en cada caso.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eExplique por qu\u0026#233; eligi\u0026#243; esa herramienta.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEscriba un c\u0026#243;digo para una de esas necesidades.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise si el c\u0026#243;digo incluye objetivo, contexto y formato.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"doc-divider\"\u003eM\u0026#243;dulo 2 ampliado: Inteligencia Artificial (IA) para la Vida Diaria\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.A Historia ampliada de OpenAI y ChatGPT\u003c/h3\u003e\u003cp\u003eOpenAI naci\u0026#243; en 2015 con el prop\u0026#243;sito de investigar IA avanzada. Durante varios a\u0026#241;os, sus herramientas eran conocidas principalmente por investigadores, desarrolladores y personas muy interesadas en tecnolog\u0026#237;a. El salto al p\u0026#250;blico general lleg\u0026#243; con ChatGPT.\u003c/p\u003e\u003cp\u003eChatGPT fue importante porque redujo la barrera de entrada. No hab\u0026#237;a que instalar programas complicados ni aprender comandos t\u0026#233;cnicos. Bastaba con escribir una pregunta. Esa facilidad explica por qu\u0026#233; tantas personas lo probaron r\u0026#225;pidamente.\u003c/p\u003e\u003cp\u003eLa lecci\u0026#243;n para el usuario es clara: cuando una tecnolog\u0026#237;a se vuelve conversacional, m\u0026#225;s personas pueden usarla. Pero una interfaz f\u0026#225;cil no significa que la respuesta sea perfecta. La facilidad debe acompa\u0026#241;arse de criterio.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.B Historia ampliada de Google y Gemini\u003c/h3\u003e\u003cp\u003eGoogle ha trabajado con IA durante muchos a\u0026#241;os. Cada vez que un buscador entiende una pregunta, cada vez que Google Translate traduce una frase o cada vez que Google Photos organiza im\u0026#225;genes, hay t\u0026#233;cnicas de IA detr\u0026#225;s.\u003c/p\u003e\u003cp\u003eGemini representa un intento de integrar capacidades modernas de IA en el ecosistema de Google. La palabra multimodal es importante: significa que la herramienta puede trabajar con m\u0026#225;s de un tipo de informaci\u0026#243;n, no solo texto.\u003c/p\u003e\u003cp\u003eEsto apunta hacia un futuro donde preguntar, resumir, analizar im\u0026#225;genes y organizar informaci\u0026#243;n ocurrir\u0026#225; dentro de las herramientas que muchas personas ya usan.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.C Historia ampliada de Microsoft y Copilot\u003c/h3\u003e\u003cp\u003eMicrosoft ha acompa\u0026#241;ado la historia de la computaci\u0026#243;n personal durante d\u0026#233;cadas. Word, Excel, PowerPoint y Outlook se convirtieron en herramientas comunes para escribir, calcular, presentar y comunicarse. Copilot intenta agregar IA directamente dentro de ese entorno.\u003c/p\u003e\u003cp\u003eLa idea de Copilot es que la IA act\u0026#250;e como acompa\u0026#241;ante de trabajo: ayuda a redactar, resumir, convertir datos en tablas o generar un primer borrador. El nombre \u0026quot;copiloto\u0026quot; es \u0026#250;til porque recuerda que la persona sigue siendo quien dirige.\u003c/p\u003e\u003cp\u003eEn la pr\u0026#225;ctica, Copilot puede ahorrar tiempo, pero siempre requiere revisi\u0026#243;n. Un texto generado autom\u0026#225;ticamente puede sonar bien y aun as\u0026#237; necesitar correcciones de datos, tono o intenci\u0026#243;n.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.D Comparaci\u0026#243;n extendida de herramientas\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eHerramienta\u003c/td\u003e\u003ctd\u003eFortaleza\u003c/td\u003e\u003ctd\u003eCu\u0026#225;ndo usarla\u003c/td\u003e\u003ctd\u003ePrecauci\u0026#243;n\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eChatGPT\u003c/td\u003e\u003ctd\u003eConversaci\u0026#243;n flexible y explicaci\u0026#243;n.\u003c/td\u003e\u003ctd\u003eCuando quiere redactar, resumir, practicar o entender un tema.\u003c/td\u003e\u003ctd\u003eVerifique datos recientes o delicados.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGemini\u003c/td\u003e\u003ctd\u003eIntegraci\u0026#243;n con b\u0026#250;squeda y servicios de Google.\u003c/td\u003e\u003ctd\u003eCuando quiere investigar, resumir o trabajar con informaci\u0026#243;n conectada a Google.\u003c/td\u003e\u003ctd\u003eNo confunda resumen con verdad confirmada.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCopilot\u003c/td\u003e\u003ctd\u003eTrabajo dentro de Word, Excel, Outlook y Microsoft 365.\u003c/td\u003e\u003ctd\u003eCuando quiere mejorar documentos, correos o tablas.\u003c/td\u003e\u003ctd\u003eRevise n\u0026#250;meros, nombres y destinatarios.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePerplexity\u003c/td\u003e\u003ctd\u003eRespuestas con fuentes.\u003c/td\u003e\u003ctd\u003eCuando quiere investigar y revisar enlaces.\u003c/td\u003e\u003ctd\u003eAbra las fuentes, no se quede solo con el resumen.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCanva\u003c/td\u003e\u003ctd\u003eDise\u0026#241;o visual sencillo.\u003c/td\u003e\u003ctd\u003eCuando quiere tarjetas, invitaciones o presentaciones.\u003c/td\u003e\u003ctd\u003eRevise ortograf\u0026#237;a e im\u0026#225;genes antes de compartir.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.E Ejemplos paso a paso por necesidad\u003c/h3\u003e\u003ch4\u003eOrganizar una lista de compras\u003c/h4\u003e\u003cp\u003eConvertir una lista desordenada en categor\u0026#237;as.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoOrganiza esta lista de compras por categor\u0026#237;as y sugiere si falta algo b\u0026#225;sico: [lista].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEscriba su lista sin preocuparse por el orden.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePegue el c\u0026#243;digo.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise categor\u0026#237;as.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eElimine lo que no necesita.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAgregue cantidades si lo desea.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003ePreparar un viaje\u003c/h4\u003e\u003cp\u003eCrear un primer itinerario con descansos y opciones tranquilas.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoPlanifica un viaje de 3 d\u0026#237;as a [ciudad] con actividades tranquilas, descansos y presupuesto aproximado.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eIndique ciudad y fechas.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida ritmo tranquilo.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida transporte sencillo.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise si hay demasiado movimiento.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eConfirme horarios y precios en sitios oficiales.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003eEntender una factura\u003c/h4\u003e\u003cp\u003eResumir cargos y preparar preguntas.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoAy\u0026#250;dame a entender esta factura. Resume los cargos y prepara preguntas para llamar a servicio al cliente: [texto sin datos privados].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eQuite datos privados.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePegue la informaci\u0026#243;n general.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise el resumen.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eUse las preguntas para llamar.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eNo comparta c\u0026#243;digos ni cuentas.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003eCrear una invitaci\u0026#243;n\u003c/h4\u003e\u003cp\u003eRedactar texto para invitar a familiares o amigos.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoCrea un texto de invitaci\u0026#243;n c\u0026#225;lido y breve para [evento], incluyendo fecha, hora, lugar y una frase amable.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEscriba evento.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAgregue fecha y hora.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise tono.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida versi\u0026#243;n m\u0026#225;s corta para WhatsApp.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise datos antes de enviar.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.F Noticias: herramientas dentro de productos cotidianos\u003c/h3\u003e\u003cp\u003eEn los \u0026#250;ltimos a\u0026#241;os, las compa\u0026#241;\u0026#237;as han movido la IA desde p\u0026#225;ginas separadas hacia herramientas ya conocidas. Microsoft la integr\u0026#243; en documentos y correos. Google la integr\u0026#243; en b\u0026#250;squeda y productividad. OpenAI extendi\u0026#243; ChatGPT para trabajar con texto, im\u0026#225;genes y archivos. Esta tendencia continuar\u0026#225;.\u003c/p\u003e\u003cp\u003eEl beneficio es comodidad: menos pasos para obtener ayuda. El riesgo es confiar demasiado r\u0026#225;pido. Si la herramienta est\u0026#225; dentro de un producto conocido, puede parecer autom\u0026#225;ticamente confiable. Aun as\u0026#237;, conviene revisar resultados importantes.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.G Pr\u0026#225;cticas adicionales del m\u0026#243;dulo 2\u003c/h3\u003e\u003ch4\u003eEscoger herramienta\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoTengo esta necesidad: [describa necesidad]. Recomi\u0026#233;ndame cu\u0026#225;l herramienta de IA usar y explica por qu\u0026#233;.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAjuste el c\u0026#243;digo con su situaci\u0026#243;n real y revise cuidadosamente la respuesta.\u003c/p\u003e\u003ch4\u003eComparar respuestas\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoDame dos formas de resolver esta tarea: una con ChatGPT y otra con Copilot.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAjuste el c\u0026#243;digo con su situaci\u0026#243;n real y revise cuidadosamente la respuesta.\u003c/p\u003e\u003ch4\u003eUsar IA sin datos privados\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoAy\u0026#250;dame a reformular esta pregunta para no incluir informaci\u0026#243;n sensible.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAjuste el c\u0026#243;digo con su situaci\u0026#243;n real y revise cuidadosamente la respuesta.\u003c/p\u003e\u003ch4\u003eCrear plan de aprendizaje\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoCrea un plan de 7 d\u0026#237;as para practicar IA 15 minutos diarios.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAjuste el c\u0026#243;digo con su situaci\u0026#243;n real y revise cuidadosamente la respuesta.\u003c/p\u003e\u003c/section\u003e","\u003cdiv class=\"doc-divider\"\u003eM\u0026#243;dulo 3: El Arte de Conversar mediante \u0026quot;C\u0026#243;digos\u0026quot;\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eContenidoAutonom\u0026#237;a Anal\u0026#237;tica: El n\u0026#250;cleo del programa, donde aprender\u0026#225; el lenguaje secreto para dominar la IA.Se ense\u0026#241;ar\u0026#225; a redactar instrucciones precisas, llamadas prompts, que funcionan como llaves para obtener respuestas exactas en m\u0026#250;ltiples plataformas.Incluye el uso extensivo de texto e im\u0026#225;genes en ChatGPT, Gemini y Copilot, adem\u0026#225;s de una introducci\u0026#243;n a herramientas de b\u0026#250;squeda bibliogr\u0026#225;fica.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.1 \u0026#191;Qu\u0026#233; es un c\u0026#243;digo o comando?\u003c/h3\u003e\u003cp\u003eUn comando es la instrucci\u0026#243;n que usted le escribe a la IA. En este curso tambi\u0026#233;n le llamamos c\u0026#243;digo, no porque sea programaci\u0026#243;n, sino porque funciona como una llave: abre la puerta a una respuesta m\u0026#225;s \u0026#250;til.\u003c/p\u003e\u003cp\u003eUn comando claro evita respuestas vagas. Si usted escribe \u0026quot;ay\u0026#250;dame\u0026quot;, la IA no sabe exactamente qu\u0026#233; necesita. Si escribe \u0026quot;ay\u0026#250;dame a redactar un mensaje corto y amable para cancelar una cita\u0026quot;, la respuesta ser\u0026#225; mucho mejor.\u003c/p\u003e\u003cp\u003eAprender a escribir c\u0026#243;digos no es aprender computaci\u0026#243;n avanzada. Es aprender a pedir mejor. En la vida diaria, muchas veces obtenemos mejor ayuda cuando explicamos bien la situaci\u0026#243;n. Con la IA ocurre lo mismo.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eF\u0026#243;rmula sencillaQuiero + contexto + tono + formato.Ejemplo: \u0026quot;Quiero una explicaci\u0026#243;n sencilla sobre presi\u0026#243;n alta, para entenderla antes de mi cita m\u0026#233;dica, en tono claro, usando una lista de pasos\u0026quot;.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.2 Cuatro partes de un buen c\u0026#243;digo\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eParte\u003c/td\u003e\u003ctd\u003ePregunta que responde\u003c/td\u003e\u003ctd\u003eEjemplo\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eObjetivo\u003c/td\u003e\u003ctd\u003e\u0026#191;Qu\u0026#233; necesito?\u003c/td\u003e\u003ctd\u003eQuiero redactar un correo.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eContexto\u003c/td\u003e\u003ctd\u003e\u0026#191;Cu\u0026#225;l es la situaci\u0026#243;n?\u003c/td\u003e\u003ctd\u003eEs para pedir aclaraci\u0026#243;n de una factura.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTono\u003c/td\u003e\u003ctd\u003e\u0026#191;C\u0026#243;mo debe sonar?\u003c/td\u003e\u003ctd\u003eFormal, amable y breve.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eFormato\u003c/td\u003e\u003ctd\u003e\u0026#191;C\u0026#243;mo quiero la respuesta?\u003c/td\u003e\u003ctd\u003eEn tres p\u0026#225;rrafos cortos.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.3 De c\u0026#243;digo b\u0026#225;sico a c\u0026#243;digo excelente\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eVersi\u0026#243;n\u003c/td\u003e\u003ctd\u003eC\u0026#243;digo\u003c/td\u003e\u003ctd\u003eResultado esperado\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eB\u0026#225;sica\u003c/td\u003e\u003ctd\u003eAy\u0026#250;dame con una carta.\u003c/td\u003e\u003ctd\u003eLa respuesta ser\u0026#225; general.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMejor\u003c/td\u003e\u003ctd\u003eAy\u0026#250;dame a escribir una carta para pedir informaci\u0026#243;n.\u003c/td\u003e\u003ctd\u003eLa respuesta ser\u0026#225; m\u0026#225;s \u0026#250;til.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBuena\u003c/td\u003e\u003ctd\u003eEscribe una carta formal para pedir aclaraci\u0026#243;n de una factura que lleg\u0026#243; m\u0026#225;s alta de lo normal. Que sea breve y respetuosa.\u003c/td\u003e\u003ctd\u003eLa respuesta tendr\u0026#225; objetivo, contexto y tono.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eExcelente\u003c/td\u003e\u003ctd\u003eEscribe una carta formal, breve y respetuosa para pedir aclaraci\u0026#243;n de una factura que lleg\u0026#243; m\u0026#225;s alta de lo normal. Incluye asunto, saludo, tres p\u0026#225;rrafos cortos y cierre amable.\u003c/td\u003e\u003ctd\u003eLa respuesta tendr\u0026#225; estructura lista para revisar.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e3.4 Ejercicio paso a paso: mejorar un c\u0026#243;digo\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo de pr\u0026#225;cticaAy\u0026#250;dame a redactar un mensaje para pedir informaci\u0026#243;n sobre una factura.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eLea la primera respuesta.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAgregue contexto: \u0026quot;la factura lleg\u0026#243; m\u0026#225;s alta de lo normal\u0026quot;.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAgregue tono: \u0026quot;quiero sonar amable\u0026quot;.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAgregue formato: \u0026quot;en tres p\u0026#225;rrafos cortos\u0026quot;.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCompare la primera y la \u0026#250;ltima versi\u0026#243;n.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.5 C\u0026#243;digos para texto\u003c/h3\u003e\u003cp\u003eLos c\u0026#243;digos de texto sirven para escribir, resumir, traducir, explicar o reordenar informaci\u0026#243;n. Puede usarlos en ChatGPT, Gemini o Copilot.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eEjemplos listos para copiar1. Resume este texto en cinco puntos sencillos.2. Expl\u0026#237;came esta palabra sin usar tecnicismos.3. Redacta un mensaje cordial para agradecer una invitaci\u0026#243;n.4. Convierte esta lista desordenada en una tabla.5. Hazme preguntas para ayudarme a organizar esta idea.6. Dame tres versiones: formal, amistosa y muy breve.7. Se\u0026#241;ala qu\u0026#233; informaci\u0026#243;n deber\u0026#237;a verificar antes de usar esta respuesta.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eDespu\u0026#233;s de recibir una respuesta, puede continuar la conversaci\u0026#243;n. No tiene que aceptar la primera versi\u0026#243;n. Puede pedir: \u0026quot;m\u0026#225;s corto\u0026quot;, \u0026quot;m\u0026#225;s amable\u0026quot;, \u0026quot;con ejemplos\u0026quot;, \u0026quot;en una tabla\u0026quot; o \u0026quot;como pasos\u0026quot;.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.6 Banco de c\u0026#243;digos pr\u0026#225;cticos\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSituaci\u0026#243;n\u003c/td\u003e\u003ctd\u003eC\u0026#243;digo listo para usar\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eEntender una noticia\u003c/td\u003e\u003ctd\u003eResume esta noticia en lenguaje sencillo y dime qu\u0026#233; datos debo verificar.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePreparar una cita\u003c/td\u003e\u003ctd\u003eAy\u0026#250;dame a preparar preguntas para una cita sobre este tema: [tema].\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRedactar un mensaje\u003c/td\u003e\u003ctd\u003eEscribe un mensaje breve, cordial y claro para [situaci\u0026#243;n].\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOrganizar compras\u003c/td\u003e\u003ctd\u003eOrganiza esta lista de compras por categor\u0026#237;as: [lista].\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAprender un concepto\u003c/td\u003e\u003ctd\u003eExpl\u0026#237;came [concepto] con una analog\u0026#237;a familiar y tres ejemplos.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eComparar opciones\u003c/td\u003e\u003ctd\u003eCompara estas opciones en una tabla con ventajas y desventajas: [opciones].\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRevisar seguridad\u003c/td\u003e\u003ctd\u003eAnaliza este mensaje y dime si parece sospechoso: [mensaje sin datos privados].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.7 C\u0026#243;digos para im\u0026#225;genes\u003c/h3\u003e\u003cp\u003eAlgunas herramientas permiten subir o analizar im\u0026#225;genes. Esto puede servir para entender una foto, una captura de pantalla, un documento visual o una imagen generada por IA.\u003c/p\u003e\u003cp\u003eDebe tener cuidado con im\u0026#225;genes que incluyan datos privados. Antes de subir una imagen, revise si contiene n\u0026#250;meros de cuenta, direcciones, documentos personales o inform
