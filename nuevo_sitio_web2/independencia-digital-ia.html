 person inside the computer. It is a tool trained with information. It can help a lot, but it should always be checked.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.2 A journey from the origins of technology to today\u003c/h3\u003e\u003cp\u003eThe story of AI is part of a bigger story: the story of how people have created tools to solve problems. First we use physical tools. Then came calculators, computers, the internet, smartphones and digital assistants.\u003c/p\u003e\u003cp\u003eIn the 1950s, we began to formally talk about machines capable of imitating some human thought processes. At that time computers were large, expensive and limited. For years, AI advanced slowly because three elements were missing: enough information, enough computing speed, and more flexible ways to learn from data.\u003c/p\u003e\u003cp\u003eWith the Internet, millions of documents, images and conversations began to be available in digital format. With the cloud, computers were able to work with more power. With smartphones, technology reached almost everyone\u0026#39;s pocket. Finally, with conversational models, AI began to feel close because it could be used with normal words.\u003c/p\u003e\u003cp\u003eThe important change was not only technical. It was human: for the first time, a person could type a simple question and receive an organized answer without studying programming. This change transformed AI from a laboratory technology to an everyday tool.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.3 The Robot Chef analogy\u003c/h3\u003e\u003cp\u003eImagine a robot chef who has never cooked. You are first shown thousands of recipes, ingredients, photos of dishes and cooking videos. Over time, the robot learns that certain ingredients go together, that some recipes follow similar steps, and that some results are more common.\u003c/p\u003e\u003cp\u003eAI learns in a similar way. Look at many examples and then produce a new answer based on patterns. This does not mean that I have taste, personal memory or conscience. It means you can organize information in a useful way.\u003c/p\u003e\u003cp\u003eIf you ask for a simple recipe with chicken, rice and vegetables, the tool is not cooking or tasting the food. You are combining recipe patterns you saw before to come up with a reasonable option. You then decide if the recipe works for you, if you should change ingredients or if something should be checked.\u003c/p\u003e\u003cp\u003eThe analogy also helps to understand errors. If the robot chef learned from incomplete recipes, it might suggest something strange. In the same way, an AI can make a mistake if it misinterprets the question or if it does not have enough information.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003ePractical ExampleCode: \u0026quot;Give me a simple recipe with rice, chicken, and vegetables. Use short steps and don\u0026#39;t include hard-to-find ingredients.\u0026quot; After reading the answer, you can ask: \u0026quot;Make it healthier\u0026quot; or \u0026quot;make it more economical.\u0026quot;\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.4 Basic concepts without technicalities\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eConcept\u003c/td\u003e\u003ctd\u003eSimple explanation\u003c/td\u003e\u003ctd\u003eeveryday example\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eData\u003c/td\u003e\u003ctd\u003eA piece of information that AI can use.\u003c/td\u003e\u003ctd\u003eA recipe, a photo, a phrase or a date.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eModel\u003c/td\u003e\u003ctd\u003eThe tool that learned patterns from data.\u003c/td\u003e\u003ctd\u003eAn assistant who answers questions.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTraining\u003c/td\u003e\u003ctd\u003eProcess in which AI learns from many examples.\u003c/td\u003e\u003ctd\u003eThe Robot Chef reviewing thousands of recipes.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAnswer\u003c/td\u003e\u003ctd\u003eWhat AI produces when you ask.\u003c/td\u003e\u003ctd\u003eA summary, a list or a letter.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eVerification\u003c/td\u003e\u003ctd\u003eCheck if the answer is correct.\u003c/td\u003e\u003ctd\u003eConfirm schedule on an official website.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.5 Where do we use AI without realizing it?\u003c/h3\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eYour phone groups photos by people, places, or dates.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eGoogle Maps suggests the fastest route and detects traffic.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eNetflix or YouTube recommend content based on your interests.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eThe bank can detect suspicious purchases.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eEmail filters unwanted messages.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eAn automatic translator converts phrases from one language to another.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eCameras improve photos by adjusting light, focus and colors.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eVoice assistants recognize questions and execute simple commands.\u003c/p\u003e\u003c/div\u003e\u003cp\u003eThis shows that AI is not a totally distant world. We\u0026#39;ve already been using it in small ways. The difference is that now we will learn to use it consciously, with clear questions and security measures.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.6 Companies that gave rise to AI and added logos\u003c/h3\u003e\u003cp\u003eWhen we talk about modern AI, we hear company names. Briefly knowing their stories helps to understand why there are several tools and why not all of them serve the same purpose.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCompany\u003c/td\u003e\u003ctd\u003eExpanded history\u003c/td\u003e\u003ctd\u003eWhat tool or idea does it provide?\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOpenAI\u003c/td\u003e\u003ctd\u003eIt was founded in 2015 with a mission focused on developing advanced AI and studying how to make it beneficial. ChatGPT was launched publicly on November 30, 2022. Its impact was great because it turned complex models into a simple conversation.\u003c/td\u003e\u003ctd\u003eChatGPT popularized the idea of typing a normal question and receiving an organized response.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003egoogle\u003c/td\u003e\u003ctd\u003eGoogle has used AI for years in search, translation, maps, photos, and voice recognition. Gemini was announced in December 2023 as a family of multimodal models, that is, capable of working with text, images, audio, video and code.\u003c/td\u003e\u003ctd\u003eGemini connects AI with familiar tools like search, documents, Android, and Google services.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMicrosoft\u003c/td\u003e\u003ctd\u003eMicrosoft has worked with AI for decades, but Copilot marked a new stage by integrating assistants into Word, Excel, Outlook, Teams and Windows. Microsoft 365 Copilot was announced in March 2023.\u003c/td\u003e\u003ctd\u003eCopilot brings AI to daily work with documents, emails, tables and presentations.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAnthropic\u003c/td\u003e\u003ctd\u003eAnthropic was founded in 2021 by researchers who had worked on advanced AI. Its public approach emphasizes security, reliability and interpretability. His assistant Claude is known for working well with long texts.\u003c/td\u003e\u003ctd\u003eClaude represents a line of tools focused on security and large document management.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePerplexity\u003c/td\u003e\u003ctd\u003ePerplexity appeared as an AI answer engine founded in 2022. Its proposal is to answer questions using web search and displaying sources.\u003c/td\u003e\u003ctd\u003eIt helps to practice verification, because it invites you to check where an answer comes from.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.7 More milestones that help understand the revolution\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eMilestone\u003c/td\u003e\u003ctd\u003eWhat happened\u003c/td\u003e\u003ctd\u003eWhy it helps to understand the present\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eELIZA (1960s)\u003c/td\u003e\u003ctd\u003eOne of the first programs that simulated conversation.\u003c/td\u003e\u003ctd\u003eHe showed that people could feel that a machine was talking.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDeep Blue (1997)\u003c/td\u003e\u003ctd\u003eAn IBM computer defeated world chess champion Garry Kasparov.\u003c/td\u003e\u003ctd\u003eHe demonstrated strength in very specific tasks.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWatson (2011)\u003c/td\u003e\u003ctd\u003eIBM Watson won on the show Jeopardy!.\u003c/td\u003e\u003ctd\u003eShowed progress in questions and answers.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAlphaGo (2016)\u003c/td\u003e\u003ctd\u003eA DeepMind system beat Go game champions.\u003c/td\u003e\u003ctd\u003eIt showed that AI could learn complex strategies.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eChatGPT (2022)\u003c/td\u003e\u003ctd\u003eA conversational tool reached the general public.\u003c/td\u003e\u003ctd\u003eAI became easy to test in daily life.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.8 History in the news: the ChatGPT moment\u003c/h3\u003e\u003cp\u003eWhen ChatGPT went public, many people tried it out of curiosity: students, workers, teachers, journalists, programmers, and families. What was surprising was not only that he responded, but that he responded in everyday language. For many people, that was the first time AI stopped seeming like science fiction.\u003c/p\u003e\u003cp\u003eThat moment started a global career. Google responded with Gemini, Microsoft integrated Copilot into its products, and other companies launched their own assistants. Since then, the public conversation has changed: it is no longer asking whether AI will come, but rather how we should learn to use it safely.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eModule LessonAI advanced because three things came together: a lot of information, more powerful computers, and easy-to-use tools. The easy-to-use part is what allows us to learn today.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e1.9 Step-by-step practice: explain AI in simple words\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCode of practice Explain to me what Artificial Intelligence is in simple words, with three examples from daily life.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eOpen ChatGPT, Gemini or the available tool.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCopy the code of practice.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRead the answer without rushing.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite down a sentence that you did understand.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for a second version: \u0026quot;Explain it with the Robot Chef analogy.\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCompare which explanation was clearer to you.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eAfter practicingThe important thing is not to memorize the answer. The important thing is to discover which explanation helps you understand better.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e1.10 Step-by-step practice: finding AI in my routine\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCode of PracticeHelp me identify five places where I use Artificial Intelligence without realizing it. Ask me first what apps I use.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite the code.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAnswer the tool\u0026#39;s questions.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eReview the list you received.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCheck which examples you actually use.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAdd an example of your own.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eAfter practicingAt the end, write a sentence: \u0026quot;Today I discovered that I already use AI when...\u0026quot;\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e1.11 Everyday case: understanding a new word\u003c/h4\u003e\u003cp\u003eYou hear the word \u0026quot;algorithm\u0026quot; in the news and don\u0026#39;t know exactly what it means. Instead of ignoring it, you can ask for a simple explanation and examples.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003ePractical challengeAsk for a clear explanation, without technicalities, and then ask for an analogy.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeExplain to me what an algorithm is in simple words and give me a cooking analogy.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e1.12 Everyday case: compare before and after\u003c/h4\u003e\u003cp\u003eYou want to understand how technology changed from ancient computers to today\u0026#39;s assistants.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003ePractical challengeAsk for a table comparison to see the evolution.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested CodeCompare an old computer, a smartphone, and an AI assistant in a simple table.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.13 Module Summary\u003c/h3\u003e\u003cp\u003eAI is not magic. It is a tool that learns from information and can help you perform everyday tasks. The most important thing is to maintain control: ask, review and decide.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.14 Closing exercise\u003c/h3\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eWrite down two activities from your daily life where you have already used smart technology.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eWrite down a task you would like to make easier with AI.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eExplain the Robot Chef analogy in your own words.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eWrite down a question you still have about AI.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"doc-divider\"\u003eExpanded Module 1: My First Encounter with Artificial Intelligence (AI)\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.A Extended Reading: Why AI Feels Different\u003c/h3\u003e\u003cp\u003eAI feels different from other technologies because it talks. A calculator expects numbers; a search engine expects keywords; a traditional application displays buttons. An AI assistant, on the other hand, allows you to write a complete question, ask for an explanation, and continue the conversation. That sense of dialogue makes her seem more human than she really is.\u003c/p\u003e\u003cp\u003eUnderstanding this difference is important. AI can respond naturally, but it does not mean that it has intention, emotions or wisdom of its own. Their strength is in organizing language and patterns. Wisdom remains in the person who asks, reviews and decides.\u003c/p\u003e\u003cp\u003eThat is why the first learning is not technical: it is learning to relate to the tool. A good relationship with AI combines curiosity and prudence. Curiosity to explore. Prudence to verify.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.B Expanded history: from rules to learning\u003c/h3\u003e\u003cp\u003eIn early AI systems, programmers wrote many rules. For example: if a person has a certain symptom, then the system would suggest checking a certain possibility. These systems could help, but they were rigid. If the situation changed, the system did not always respond well.\u003c/p\u003e\u003cp\u003eModern AI changed because it learned to work with examples. Instead of writing each rule by hand, models analyze large amounts of information and detect patterns. This is the reason why they can answer various questions, translate, summarize, classify images and generate texts.\u003c/p\u003e\u003cp\u003eThis evolution also brings responsibilities. When a tool learns from a lot of data, it can learn incomplete information, biases, or errors. That is why no answer should be received as absolute truth.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.C Step-by-step example: learning a technological word\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSituationYou hear the word \u0026quot;AI model\u0026quot; and don\u0026#39;t know what it means. Instead of wondering, you can ask for a simple explanation.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eInitial codeExplain to me what an AI model is in simple words.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRead the first answer.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eIf it still seems complicated, write: \u0026quot;make it simpler.\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eThen write: \u0026quot;give me a recipe analogy.\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eThen ask: \u0026quot;give me three examples of AI models in everyday life.\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite down the explanation that you understood best.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.D Mini stories to practice comprehension\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eHistory\u003c/td\u003e\u003ctd\u003eWhat does it prove?\u003c/td\u003e\u003ctd\u003eCode to practice\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eA photo application groups together images of the same person.\u003c/td\u003e\u003ctd\u003eAI recognizes visual patterns.\u003c/td\u003e\u003ctd\u003eExplain to me how an app can group photos by people without using difficult words.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eA map calculates a different route because there is traffic.\u003c/td\u003e\u003ctd\u003eAI uses changing data.\u003c/td\u003e\u003ctd\u003eExplain to me how a mapping application decides an alternative route.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eA store recommends products similar to what you saw before.\u003c/td\u003e\u003ctd\u003eAI detects preferences.\u003c/td\u003e\u003ctd\u003eExplain to me how an online store recommends products.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eThe mail sends strange messages to spam.\u003c/td\u003e\u003ctd\u003eAI classifies information.\u003c/td\u003e\u003ctd\u003eExplain to me how a mail filter identifies suspicious messages.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.E News and public conversation about AI\u003c/h3\u003e\u003cp\u003eThe arrival of conversational tools produced debates in schools, companies, families and governments. Some people saw opportunities to learn faster. Others worried about errors, privacy, jobs and misinformation. Both reactions are understandable.\u003c/p\u003e\u003cp\u003eThe purpose of this course is not to say that AI is perfect or that it should be avoided. The purpose is to learn to use it with balance. Important technologies don\u0026#39;t disappear because they are complex; They become safer when people learn to understand them.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.F Additional practices of module 1\u003c/h3\u003e\u003ch4\u003ePractice explanation by analogy\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeExplain AI to me using a library analogy.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAfter you receive the answer, ask for a shorter version and compare which one you understand best.\u003c/p\u003e\u003ch4\u003ePractice historical summary\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeSummarize the history of AI in 6 simple points.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAfter you receive the answer, ask for a shorter version and compare which one you understand best.\u003c/p\u003e\u003ch4\u003ePractice curiosity questions\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeAsk me 5 questions to find out how I could use AI in my daily life.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAfter you receive the answer, ask for a shorter version and compare which one you understand best.\u003c/p\u003e\u003ch4\u003ePractice limits\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested code Tell me three things AI can do well and three things I should check.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAfter you receive the answer, ask for a shorter version and compare which one you understand best.\u003c/p\u003e\u003c/section\u003e ","\u003cdiv class=\"doc-divider\"\u003eModule 2: Artificial Intelligence (AI) for Daily Life\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eContentReal Utility: A practical tour of the ecosystem of the most powerful virtual assistants. We will learn about the differences and advantages of ChatGPT, Google Gemini and Microsoft Copilot. You will learn to identify which of these tools best suits your personal needs, whether to organize information, search for data or create content.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.1 What is an AI virtual assistant?\u003c/h3\u003e\u003cp\u003eAn AI virtual assistant is a tool that receives an instruction and responds with text, ideas, lists, summaries or proposals. You can ask for help writing a message, organizing a trip, understanding a document, or preparing questions.\u003c/p\u003e\u003cp\u003eThe key is to remember that the assistant proposes. You decide. The tool doesn\u0026#39;t know all the details of your life, so it\u0026#39;s important to give it context and review the response. If the information has important consequences, it should be verified before use.\u003c/p\u003e\u003cp\u003eAn easy way to think about these tools is to compare them to different types of helpers: one talks very well, another searches for information, another works within documents, and another helps with designs. There is no single perfect tool for everything.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.2 ChatGPT: conversation and explanation\u003c/h3\u003e\u003cp\u003eChatGPT became known because it made it easy to chat with AI. It was developed by OpenAI and became popular as of 2022. Many people use it to write, summarize, translate, explain topics, and practice ideas.\u003c/p\u003e\u003cp\u003eThe story of OpenAI helps understand why ChatGPT made such an impact. Before, AI seemed reserved for laboratories or experts. ChatGPT put a chat window in front of the public: you write and the tool responds.\u003c/p\u003e\u003cp\u003eChatGPT is especially useful when you want to explain an idea, improve a text, or practice a conversation. It can also help transform complicated text into a simpler version.\u003c/p\u003e\u003ch4\u003ePractical uses of ChatGPT\u003c/h4\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eWrite a formal letter or family message.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eAsk for a simple explanation of a news item.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eCreate a shopping list by categories.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003ePrepare questions for a medical appointment.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eConvert a long text into a short summary.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003ePractice a difficult conversation before having it.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eAsk for ideas to organize a personal project.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003eStep-by-step practice with ChatGPT: appointment message\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCode of PracticeHelp me compose a friendly message to confirm an appointment tomorrow at 10:00 a.m. Make it brief and clear.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite the code.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRead the answer.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk: \u0026quot;make it shorter.\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk: \u0026quot;make it warmer.\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eChoose the version that most closely matches the way you speak.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eBefore sending it, check name, time and date.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003eStep-by-step practice with ChatGPT: text summary\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCode of practiceSummarize this text in five simple points and tell me if there is anything I need to check: [paste the text without private data].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCopy a text that you want to understand.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRemove personal data.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePaste the code and text.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRead the summary.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk: \u0026quot;what parts should I check?\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eFind the original source if the topic is important.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.3 Google Gemini: search, organization and content\u003c/h3\u003e\u003cp\u003eGoogle has been using AI in search, maps, translation, photos and email for many years. Gemini represents an evolution toward assistants that can work with different types of information, such as text and images.\u003c/p\u003e\u003cp\u003eGemini can be useful if you already use Google products or if you want to research a topic. It can also help organize ideas, summarize news, or compare options. Like any AI tool, it should be reviewed when the information is important.\u003c/p\u003e\u003cp\u003eAn advantage of Gemini is its relationship with the Google ecosystem. This can make document, searching, and organizing tasks easier. However, the best tool will always be the one you can use comfortably and safely.\u003c/p\u003e\u003ch4\u003ePractical Uses of Gemini\u003c/h4\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eSummarize a news item in simple points.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eOrganize ideas for a trip.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003ePrepare a list of documents for a procedure.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eExplain an image or visual content.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eCompare options before making a decision.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eSort tasks by priority.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003eStep-by-step practice with Gemini: clear news\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCode of PracticeSummarize this news in five simple points. Then tell me what facts I should check before believing her.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCopy a short news item.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePaste the code with the text.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRead the summary.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite down the data that the tool recommends checking.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eFind an official source or a second trusted source.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003eStep-by-step practice with Gemini: task plan\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCode of PracticeOrganize these tasks by priority and suggest which ones I should do today: [paste a list].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite a real to-do list.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk them to organize them by priority.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCheck if the order makes sense.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for a simpler version if the answer is long.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eDecide what you will do first.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.4 Microsoft Copilot: documents, emails and tables\u003c/h3\u003e\u003cp\u003eMicrosoft introduced Copilot as a way to integrate AI into productivity tools. The idea is that AI can help within Word, Excel, Outlook and other applications that many people already know.\u003c/p\u003e\u003cp\u003eCopilot is especially useful when working with documents, emails or tables. It can help improve a text, summarize a long email, or create a simple table to organize expenses. The key is to review the result before sending or using it.\u003c/p\u003e\u003cp\u003eIn Word it can help write or improve texts. In Excel you can organize information in tables. In Outlook you can summarize emails and suggest replies. This does not eliminate the need to review; it just saves time on the first draft.\u003c/p\u003e\u003ch4\u003ePractical uses of Copilot\u003c/h4\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eWrite a letter in Word.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eSummarize a long email in Outlook.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eCreate an expense table in Excel.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eOrganize meeting notes.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eChange the tone of a message to make it more cordial.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eCreate a draft presentation.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003eStep-by-step practice with Copilot: expense table\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCode of PracticeOrganize these expenses in a table by category and calculate an approximate total: [paste list of expenses].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite a list of expenses without bank details.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eOrder one table per category.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCheck if each expense fell into the correct category.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for a short summary.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eUse the table only after reviewing the numbers.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.5 Perplexity, Canva and creative tools\u003c/h3\u003e\u003cp\u003eIn addition to ChatGPT, Gemini and Copilot, there are tools that are worth knowing. Perplexity presents itself as an answer engine that displays sources. Canva helps create designs, invitations and presentations. DALL-E and other visual tools can generate images from text.\u003c/p\u003e\u003cp\u003eThese tools show that AI is not a single thing. Some help you think, others help you search, others help you write, and others help you create visual content. The best way to learn them is to practice with a specific need.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eTool\u003c/td\u003e\u003ctd\u003eMain use\u003c/td\u003e\u003ctd\u003eExample\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePerplexity\u003c/td\u003e\u003ctd\u003eSearch with answers and sources\u003c/td\u003e\u003ctd\u003eSearch for information and review where it comes from.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eClaude\u003c/td\u003e\u003ctd\u003eReading and analysis of long texts\u003c/td\u003e\u003ctd\u003eSummarize long documents or compare ideas.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ecanva\u003c/td\u003e\u003ctd\u003eVisual design with AI support\u003c/td\u003e\u003ctd\u003eCreate a simple invitation or cover.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDALL-E / image generators\u003c/td\u003e\u003ctd\u003eCreate images from text\u003c/td\u003e\u003ctd\u003eDesign an image for a card.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNotebookLM\u003c/td\u003e\u003ctd\u003eOrganize your own information\u003c/td\u003e\u003ctd\u003eAsk questions about documents uploaded by the user.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.6 Choose the right tool\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eNeed\u003c/td\u003e\u003ctd\u003eSuggested tool\u003c/td\u003e\u003ctd\u003ewhy\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eI want you to explain something to me calmly\u003c/td\u003e\u003ctd\u003eChatGPT\u003c/td\u003e\u003ctd\u003eHe is strong in conversation and explanation.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eI want to research and organize information\u003c/td\u003e\u003ctd\u003eGemini or Perplexity\u003c/td\u003e\u003ctd\u003eThey can support search and synthesis.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eI want to work with Word, Excel or Outlook\u003c/td\u003e\u003ctd\u003eMicrosoft Copilot\u003c/td\u003e\u003ctd\u003eIt is integrated with Microsoft tools.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eI want to create an image or design\u003c/td\u003e\u003ctd\u003eCanva, DALL-E or other visual tool\u003c/td\u003e\u003ctd\u003eThey are oriented towards creativity.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eI want to verify a news\u003c/td\u003e\u003ctd\u003eGemini, Perplexity or traditional search\u003c/td\u003e\u003ctd\u003eIt is advisable to compare sources.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e2.7 Case study: organizing a busy week\u003c/h4\u003e\u003cp\u003eImagine you have a week of appointments, calls, shopping, and a family visit. Instead of writing everything out of order, you can ask the AI ​​to turn it into a plan for days.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003ePractical challengeCreate a clear and easy-to-follow weekly plan.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeOrganize this task list by day and by priority. Do it in a simple table: [paste list].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e2.8 Practical case: understanding a complicated letter or email\u003c/h4\u003e\u003cp\u003eSometimes a long email arrives with formal language. The AI ​​can summarize it and highlight whether you are asking for money, personal data or some urgent action.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003ePractical challengeUnderstand the message without responding yet.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeSummarize this email in plain language. Then tell me if it asks for money, passwords, codes or sensitive information: [paste text without private data].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e2.9 Case study: preparing an important call\u003c/h4\u003e\u003cp\u003eBefore calling an office, bank or company, you can ask the AI to prepare a list of questions. This way you avoid forgetting important points.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003ePractical challengePrepare an organized conversation.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeHelp me prepare a list of questions to call [organization] about [topic]. Order them from most important to least important.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.10 Story in the news: when a chatbot makes a mistake\u003c/h3\u003e\u003cp\u003eA known case occurred with Air Canada. A customer received incorrect information from a chatbot about a bereavement fee. The Canadian court concluded that the company was responsible for the information given on its site. The lesson is simple: attendees can make mistakes, and that\u0026#39;s why important information must be confirmed.\u003c/p\u003e\u003cp\u003eThis case is useful because it was not an unknown tool. It was a chatbot within a company site. Still, he gave the wrong answer. The lesson is clear: when money, travel, paperwork or official policies are involved, an AI\u0026#39;s response should be compared to the official page or an authorized representative.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003ePractical lessonIf an AI gives you information about money, travel, health, laws or procedures, use it as initial support. Before acting, confirm with an official source.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.11 Where we are going in daily life\u003c/h3\u003e\u003cp\u003eWe will increasingly see assistants integrated into phones, browsers, documents and services. Instead of opening a separate app, the AI ​​will be within the tools we already use. It will be able to help you write, search, summarize, translate, read images and organize tasks.\u003c/p\u003e\u003cp\u003eThis can save time, but it also requires judgment. Convenience should not replace review. The most valuable skill will be knowing when to accept a suggestion and when to verify it.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.12 Closing exercise\u003c/h3\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite three personal needs where an AI could help you.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eChoose which tool you would use in each case.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eExplain why you chose that tool.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite some code for one of those needs.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eReview if the code includes goal, context, and format.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"doc-divider\"\u003eExpanded Module 2: Artificial Intelligence (AI) for Daily Life\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.A Expanded history of OpenAI and ChatGPT\u003c/h3\u003e\u003cp\u003eOpenAI was born in 2015 with the purpose of researching advanced AI. For several years, its tools were known mainly by researchers, developers and people very interested in technology. The jump to the general public came with ChatGPT.\u003c/p\u003e\u003cp\u003eChatGPT was important because it lowered the barrier to entry. There was no need to install complicated programs or learn technical commands. It was enough to write a question. That ease explains why so many people quickly tried it.\u003c/p\u003e\u003cp\u003eThe lesson for the user is clear: when a technology becomes conversational, more people can use it. But an easy interface doesn\u0026#39;t mean the answer is perfect. Ease must be accompanied by judgment.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.B Extended history of Google and Gemini\u003c/h3\u003e\u003cp\u003eGoogle has been working with AI for many years. Every time a search engine understands a question, every time Google Translate translates a phrase or every time Google Photos organizes images, there are AI techniques behind it.\u003c/p\u003e\u003cp\u003eGemini represents an attempt to integrate modern AI capabilities into the Google ecosystem. The word multimodal is important: it means that the tool can work with more than one type of information, not just text.\u003c/p\u003e\u003cp\u003eThis points to a future where asking, summarizing, analyzing images, and organizing information will occur within the tools that many people already use.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.C Extended history of Microsoft and Copilot\u003c/h3\u003e\u003cp\u003eMicrosoft has accompanied the history of personal computing for decades. Word, Excel, PowerPoint, and Outlook became common tools for writing, calculating, presenting, and communicating. Copilot attempts to add AI directly within that environment.\u003c/p\u003e\u003cp\u003eThe idea of Copilot is that AI acts as a work companion: it helps to write, summarize, convert data into tables or generate a first draft. The name \u0026quot;copilot\u0026quot; is useful because it remembers that the person is still the one leading.\u003c/p\u003e\u003cp\u003eIn practice, Copilot can save time, but it always requires revision. Automatically generated text can sound good and still need corrections in data, tone, or intent.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.D Extended Tool Comparison\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eTool\u003c/td\u003e\u003ctd\u003eStrength\u003c/td\u003e\u003ctd\u003eWhen to use it\u003c/td\u003e\u003ctd\u003eCaution\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eChatGPT\u003c/td\u003e\u003ctd\u003eFlexible conversation and explanation.\u003c/td\u003e\u003ctd\u003eWhen you want to write, summarize, practice or understand a topic.\u003c/td\u003e\u003ctd\u003eCheck recent or sensitive data.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGemini\u003c/td\u003e\u003ctd\u003eIntegration with Google search and services.\u003c/td\u003e\u003ctd\u003eWhen you want to research, summarize or work with information connected to Google.\u003c/td\u003e\u003ctd\u003eDo not confuse summary with confirmed truth.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCopilot\u003c/td\u003e\u003ctd\u003eI work within Word, Excel, Outlook and Microsoft 365.\u003c/td\u003e\u003ctd\u003eWhen you want to improve documents, emails or tables.\u003c/td\u003e\u003ctd\u003eReview numbers, names and recipients.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePerplexity\u003c/td\u003e\u003ctd\u003eAnswers with sources.\u003c/td\u003e\u003ctd\u003eWhen you want to research and review links.\u003c/td\u003e\u003ctd\u003eOpen the sources, don\u0026#39;t just stick to the summary.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ecanva\u003c/td\u003e\u003ctd\u003eSimple visual design.\u003c/td\u003e\u003ctd\u003eWhen you want cards, invitations or presentations.\u003c/td\u003e\u003ctd\u003eCheck spelling and images before sharing.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.E Step-by-step examples by necessity\u003c/h3\u003e\u003ch4\u003eOrganize a shopping list\u003c/h4\u003e\u003cp\u003eConvert an unordered list into categories.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeOrganize this shopping list by category and suggest if something basic is missing: [list].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite your list without worrying about the order.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePaste the code.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eReview categories.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEliminate what you don\u0026#39;t need.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAdd quantities if you wish.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003ePrepare a trip\u003c/h4\u003e\u003cp\u003eCreate a first itinerary with breaks and quiet options.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codePlan a 3-day trip to [city] with leisurely activities, breaks, and an approximate budget.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eIndicate city and dates.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for a calm pace.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for easy transportation.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCheck for too much movement.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eConfirm schedules and prices on official sites.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003eUnderstanding an invoice\u003c/h4\u003e\u003cp\u003eSummarize charges and prepare questions.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeHelp me understand this invoice. Summarize the charges and prepare questions to call customer service: [text without private data].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRemove private data.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePaste the general information.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eReview the summary.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eUse the questions to call.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eDo not share codes or accounts.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003eCreate an invitation\u003c/h4\u003e\u003cp\u003eWrite text to invite family or friends.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested CodeCreate a short, warm invitation text for [event], including date, time, location, and a kind phrase.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eType event.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAdd date and time.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCheck tone.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRequest shorter version for WhatsApp.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eReview data before sending.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.F News: tools within everyday products\u003c/h3\u003e\u003cp\u003eIn recent years, companies have moved AI from separate pages to familiar tools. Microsoft integrated it into documents and emails. Google integrated it into search and productivity. OpenAI extended ChatGPT to work with text, images and files. This trend will continue.\u003c/p\u003e\u003cp\u003eThe benefit is convenience: fewer steps to get help. The risk is trusting too quickly. If the tool is within a well-known product, it may automatically appear trustworthy. Even so, it is worth reviewing important results.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e2.G Additional practices of module 2\u003c/h3\u003e\u003ch4\u003eChoose tool\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested code I have this need: [describe need]. Recommend me which AI tool to use and explain why.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAdjust the code with your actual situation and review the response carefully.\u003c/p\u003e\u003ch4\u003eCompare answers\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested code Give me two ways to solve this task: one with ChatGPT and one with Copilot.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAdjust the code with your actual situation and review the response carefully.\u003c/p\u003e\u003ch4\u003eUse AI without private data\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeHelp me rephrase this question so as not to include sensitive information.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAdjust the code with your actual situation and review the response carefully.\u003c/p\u003e\u003ch4\u003eCreate learning plan\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeCreate a 7-day plan to practice AI for 15 minutes a day.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAdjust the code with your actual situation and review the response carefully.\u003c/p\u003e\u003c/section\u003e ","\u003cdiv class=\"doc-divider\"\u003eModule 3: The Art of Conversing through \u0026quot;Codes\u0026quot;\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eContentAnalytical Autonomy: The core of the program, where you will learn the secret language to master AI. You will be taught how to write precise instructions, called prompts, which function as keys to obtain exact answers on multiple platforms. Includes extensive use of text and images in ChatGPT, Gemini and Copilot, as well as an introduction to bibliographic search tools.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.1 What is a code or command?\u003c/h3\u003e\u003cp\u003eA command is the instruction you type to the AI. In this course we also call it code, not because it is programming, but because it works like a key: it opens the door to a more useful answer.\u003c/p\u003e\u003cp\u003eA clear command avoids vague responses. If you type \u0026quot;help me\u0026quot;, the AI ​​doesn\u0026#39;t know exactly what you need. If you write \u0026quot;help me write a short and sweet message to cancel an appointment,\u0026quot; the response will be much better.\u003c/p\u003e\u003cp\u003eLearning to write code is not learning advanced computing. It\u0026#39;s learning to ask better. In daily life, we often get better help when we explain the situation well. The same thing happens with AI.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSimple formula I want + context + tone + format. Example: \u0026quot;I want a simple explanation about high blood pressure, to understand before my doctor\u0026#39;s appointment, in a clear tone, using a list of steps.\u0026quot;\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.2 Four parts of good code\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003ePart\u003c/td\u003e\u003ctd\u003eQuestion that answers\u003c/td\u003e\u003ctd\u003eExample\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eObjective\u003c/td\u003e\u003ctd\u003eWhat do I need?\u003c/td\u003e\u003ctd\u003eI want to write an email.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eContext\u003c/td\u003e\u003ctd\u003eWhat is the situation?\u003c/td\u003e\u003ctd\u003eIt is to request clarification of an invoice.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTone\u003c/td\u003e\u003ctd\u003eHow should it sound?\u003c/td\u003e\u003ctd\u003eFormal, friendly and brief.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eFormat\u003c/td\u003e\u003ctd\u003eHow do I want the answer?\u003c/td\u003e\u003ctd\u003eIn three short paragraphs.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.3 From basic code to excellent code\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eVersion\u003c/td\u003e\u003ctd\u003eCode\u003c/td\u003e\u003ctd\u003eExpected result\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBasic\u003c/td\u003e\u003ctd\u003eHelp me with a letter.\u003c/td\u003e\u003ctd\u003eThe answer will be general.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ebetter\u003c/td\u003e\u003ctd\u003eHelp me write a letter to request information.\u003c/td\u003e\u003ctd\u003eThe answer will be more helpful.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGood\u003c/td\u003e\u003ctd\u003eWrite a formal letter to ask for clarification of a bill that arrived higher than normal. Keep it brief and respectful.\u003c/td\u003e\u003ctd\u003eThe answer will have objective, context and tone.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eExcellent\u003c/td\u003e\u003ctd\u003eWrite a formal, brief and respectful letter to ask for clarification of a bill that arrived higher than normal. Includes subject, greeting, three short paragraphs and polite closing.\u003c/td\u003e\u003ctd\u003eThe response will have structure ready to review.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e3.4 Step-by-step exercise: improving code\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCode of practiceHelp me compose a message to request information about an invoice.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRead the first answer.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAdd context: \u0026quot;the bill came in higher than usual.\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAdd tone: \u0026quot;I want to sound friendly.\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAdd formatting: \u0026quot;in three short paragraphs.\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCompare the first and latest version.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.5 Codes for text\u003c/h3\u003e\u003cp\u003eText codes are used to write, summarize, translate, explain or reorder information. You can use them in ChatGPT, Gemini or Copilot.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eExamples ready to copy1. Summarize this text in five simple points.2. Explain this word to me without using technicalities.3. Write a cordial message to thank you for an invitation.4. Convert this unordered list into a table.5. Ask me questions to help me organize this idea.6. Give me three versions: formal, friendly and very brief.7. Point out what information you should verify before using this answer.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAfter receiving a response, you can continue the conversation. You don\u0026#39;t have to accept the first version. You can ask: \u0026quot;shorter,\u0026quot; \u0026quot;kinder,\u0026quot; \u0026quot;with examples,\u0026quot; \u0026quot;in a table,\u0026quot; or \u0026quot;like steps.\u0026quot;\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.6 Practical code bank\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSituation\u003c/td\u003e\u003ctd\u003eReady to use code\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eUnderstand a news\u003c/td\u003e\u003ctd\u003eSummarize this news in simple language and tell me what data I should verify.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePrepare an appointment\u003c/td\u003e\u003ctd\u003eHelp me prepare questions for a date on this topic: [topic].\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCompose a message\u003c/td\u003e\u003ctd\u003eWrite a short, friendly and clear message for [situation].\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOrganize purchases\u003c/td\u003e\u003ctd\u003eOrganize this shopping list by category: [list].\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLearn a concept\u003c/td\u003e\u003ctd\u003eExplain [concept] to me with a familiar analogy and three examples.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCompare options\u003c/td\u003e\u003ctd\u003eCompare these options in a table with advantages and disadvantages: [options].\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eReview security\u003c/td\u003e\u003ctd\u003eAnalyze this message and tell me if it looks suspicious: [message without private data].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.7 Codes for images\u003c/h3\u003e\u003cp\u003eSome tools allow you to upload or analyze images. This can be used to understand a photo, a screenshot, a visual document or an AI-generated image.\u003c/p\u003e\u003cp\u003eYou should be careful with images that include private data. Before uploading an image, check to see if it contains account numbers, addresses, personal documents or medical information. If you have doubts, don\u0026#39;t upload it.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCommands for images1. Describe this image in simple language.2. What important elements do you see in this capture?3. Help me convert this image into a list of steps.4. Is there anything suspicious about this message capture?5. Create an alternate description for this image.6. If this image were an invitation, suggest text improvements.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e3.8 Image exercise: review a capture\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCode of PracticeAnalyze this screenshot and tell me if it contains signs of fraud. I do not include personal data.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eBefore uploading the image, check if it has private information.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCover or delete sensitive data if necessary.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eUpload the screenshot only if you feel comfortable.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRead the signals that the AI ​​detects.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePlease check yourself before replying to the message.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.9 Codes in ChatGPT, Gemini and Copilot\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eTool\u003c/td\u003e\u003ctd\u003eHow to use the code\u003c/td\u003e\u003ctd\u003eExample\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eChatGPT\u003c/td\u003e\u003ctd\u003eWrite a conversational prompt.\u003c/td\u003e\u003ctd\u003eExplain this topic to me with a family analogy.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGemini\u003c/td\u003e\u003ctd\u003eAsk for summary, comparison or analysis.\u003c/td\u003e\u003ctd\u003eCompare these two options and give me advantages and disadvantages.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCopilot\u003c/td\u003e\u003ctd\u003eAsk for help within documents or emails.\u003c/td\u003e\u003ctd\u003eSummarize this document and create a list of actions.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.10 Introduction to bibliographic search\u003c/h3\u003e\u003cp\u003eWhen information is important, it is advisable to look for sources. Some tools, such as Perplexity or academic search engines, can help find articles, official pages or reference documents.\u003c/p\u003e\u003cp\u003eA good practice is to ask for sources and then open them to confirm. The AI ​​can suggest, but you must verify. A reliable source is usually an official website, a university, a recognized institution or an original document.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCode to investigateI am investigating this topic: [topic]. Give me a simple explanation and suggest reliable sources where I can verify the information. Indicates which data I should confirm before using it.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.11 Story in the news: fake quotes in a legal case\u003c/h3\u003e\u003cp\u003eIn 2023, two lawyers in New York were sanctioned after filing legal documents with non-existent cases generated by ChatGPT. The tool produced information that looked formal, but was false. This case became famous because it showed an important risk: an answer can sound safe even if it is wrong.\u003c/p\u003e\u003cp\u003eThe takeaway is not that AI is useless. The lesson is that it must be used with care. The tool can help with writing or research, but should not replace verification when the topic is serious.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eObject LessonWhen an answer will be used for legal, medical, financial, or academic topics, it is not enough for it to sound good. It must be verified.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.12 Where are we going: multimodal AI and personal assistants\u003c/h3\u003e\u003cp\u003eWe\u0026#39;re moving toward more multimodal assistants: tools that understand text, images, audio and video. We will also see agents that can help complete longer tasks, such as organizing documents, preparing reports or accompanying processes step by step.\u003c/p\u003e\u003cp\u003eThis can be very useful, but it also requires more judgment. As technology becomes more capable, the most important skill will be knowing how to ask, review and decide. The future will not only reward those who have the newest tool, but also those who know how to use it with good judgment.\u003c/p\u003e\u003cp\u003eAnother important trend is personalization. Attendees will be able to remember preferences, help maintain routines, and work across multiple devices. This will be convenient, but it will also make it more important to protect privacy and review what permissions are granted.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.13 Closing exercise\u003c/h3\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite basic code about a real need.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eImprove it using objective, context, tone and format.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk the AI for a second version.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCheck if the answer is useful and safe.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite down what you would need to verify.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"doc-divider\"\u003eExpanded Module 3: The Art of Conversing through \u0026quot;Codes\u0026quot;\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.A Why codes change results\u003c/h3\u003e\u003cp\u003eThe same tool can give a poor or excellent answer depending on how you ask it. This doesn\u0026#39;t mean you have to write perfect. It means you can learn to guide the conversation.\u003c/p\u003e\u003cp\u003eGood code works like a clear conversation with a person who wants to help. If you explain the purpose, context, tone, and format, the response will be more likely to be helpful.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.B Conversation techniques with AI\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eTechnique\u003c/td\u003e\u003ctd\u003eHow to use\u003c/td\u003e\u003ctd\u003eExample\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRequest simplification\u003c/td\u003e\u003ctd\u003eWhen the answer is very technical.\u003c/td\u003e\u003ctd\u003eMake it simpler and use everyday examples.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRequest format\u003c/td\u003e\u003ctd\u003eWhen you want order.\u003c/td\u003e\u003ctd\u003ePut it in a table with two columns.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAsk for alternatives\u003c/td\u003e\u003ctd\u003eWhen you want to compare.\u003c/td\u003e\u003ctd\u003eGive me three versions: brief, formal and friendly.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAsk questions\u003c/td\u003e\u003ctd\u003eWhen you don\u0026#39;t know where to start.\u003c/td\u003e\u003ctd\u003eAsk me questions to better understand my need.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRequest verification\u003c/td\u003e\u003ctd\u003eWhen the topic is delicate.\u003c/td\u003e\u003ctd\u003eTell me which parts I should confirm with an official source.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.C Workshop: transform ideas into codes\u003c/h3\u003e\u003ch4\u003eNeed: Cancel an appointment\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eBasic code\u003c/td\u003e\u003ctd\u003eImproved code\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHelp me cancel.\u003c/td\u003e\u003ctd\u003eWrite a short and sweet message to cancel an appointment tomorrow. Includes apology and ask for options to reschedule.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eNeed: Ask for a general medical explanation\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eBasic code\u003c/td\u003e\u003ctd\u003eImproved code\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eExplain this medicine to me.\u003c/td\u003e\u003ctd\u003eExplain to me in plain language what questions I should ask my doctor about a new medication. Don\u0026#39;t give a diagnosis.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eNeed: Organize expenses\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eBasic code\u003c/td\u003e\u003ctd\u003eImproved code\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMake me a table.\u003c/td\u003e\u003ctd\u003eOrganize this list of expenses by category and calculate an approximate total. Indicates what data I should review.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eNeed: Understand news\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eBasic code\u003c/td\u003e\u003ctd\u003eImproved code\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSummarize this.\u003c/td\u003e\u003ctd\u003eSummarize this news in five simple points and tell me which claims I should verify before sharing it.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eNeed: Create card\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eBasic code\u003c/td\u003e\u003ctd\u003eImproved code\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMake an invitation.\u003c/td\u003e\u003ctd\u003eWrite a warm invitation for a family lunch, with a cheerful tone and maximum 70 words.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.D Expanded bank of codes by category\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCategory\u003c/td\u003e\u003ctd\u003eCode ready to copy\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eExplanation\u003c/td\u003e\u003ctd\u003eExplain [topic] to me as if it were the first time I heard it. Use an analogy and three examples.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSummary\u003c/td\u003e\u003ctd\u003eSummarize this text in five points and separate facts, opinions and doubts.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eComparison\u003c/td\u003e\u003ctd\u003eCompare [option A] and [option B] in a table with advantages, disadvantages, and questions to check.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLetter\u003c/td\u003e\u003ctd\u003eWrite a formal letter on [topic], brief, clear and respectful. Includes subject and closing.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSuspicious email\u003c/td\u003e\u003ctd\u003eAnalyze this message without personal data and tell me if there are signs of fraud.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eImage\u003c/td\u003e\u003ctd\u003e
