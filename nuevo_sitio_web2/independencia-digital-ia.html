aci\u0026#243;n m\u0026#233;dica. Si tiene dudas, no la suba.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eComandos para im\u0026#225;genes1. Describe esta imagen en lenguaje sencillo.2. \u0026#191;Qu\u0026#233; elementos importantes ves en esta captura?3. Ay\u0026#250;dame a convertir esta imagen en una lista de pasos.4. \u0026#191;Hay algo sospechoso en esta captura de mensaje?5. Crea una descripci\u0026#243;n alternativa para esta imagen.6. Si esta imagen fuera una invitaci\u0026#243;n, sugiere mejoras de texto.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003e3.8 Ejercicio con imagen: revisar una captura\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo de pr\u0026#225;cticaAnaliza esta captura de pantalla y dime si contiene se\u0026#241;ales de fraude. No incluyo datos personales.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAntes de subir la imagen, revise si tiene informaci\u0026#243;n privada.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCubra o elimine datos sensibles si es necesario.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eSuba la captura solo si se siente c\u0026#243;modo.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eLea las se\u0026#241;ales que la IA detecta.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eVerifique por su cuenta antes de responder al mensaje.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.9 C\u0026#243;digos en ChatGPT, Gemini y Copilot\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eHerramienta\u003c/td\u003e\u003ctd\u003eC\u0026#243;mo usar el c\u0026#243;digo\u003c/td\u003e\u003ctd\u003eEjemplo\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eChatGPT\u003c/td\u003e\u003ctd\u003eEscriba una instrucci\u0026#243;n conversacional.\u003c/td\u003e\u003ctd\u003eExpl\u0026#237;came este tema con una analog\u0026#237;a familiar.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGemini\u003c/td\u003e\u003ctd\u003ePida resumen, comparaci\u0026#243;n o an\u0026#225;lisis.\u003c/td\u003e\u003ctd\u003eCompara estas dos opciones y dame ventajas y desventajas.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCopilot\u003c/td\u003e\u003ctd\u003ePida ayuda dentro de documentos o correos.\u003c/td\u003e\u003ctd\u003eResume este documento y crea una lista de acciones.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.10 Introducci\u0026#243;n a b\u0026#250;squeda bibliogr\u0026#225;fica\u003c/h3\u003e\u003cp\u003eCuando una informaci\u0026#243;n es importante, conviene buscar fuentes. Algunas herramientas, como Perplexity o buscadores acad\u0026#233;micos, pueden ayudar a encontrar art\u0026#237;culos, p\u0026#225;ginas oficiales o documentos de referencia.\u003c/p\u003e\u003cp\u003eUna buena pr\u0026#225;ctica es pedir fuentes y luego abrirlas para confirmar. La IA puede sugerir, pero usted debe verificar. Una fuente confiable suele ser una p\u0026#225;gina oficial, una universidad, una instituci\u0026#243;n reconocida o un documento original.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo para investigarEstoy investigando este tema: [tema]. Dame una explicaci\u0026#243;n sencilla y sugiere fuentes confiables donde pueda verificar la informaci\u0026#243;n. Indica cu\u0026#225;les datos debo confirmar antes de usarlos.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.11 Historia en las noticias: citas falsas en un caso legal\u003c/h3\u003e\u003cp\u003eEn 2023, dos abogados en Nueva York fueron sancionados despu\u0026#233;s de presentar documentos legales con casos inexistentes generados por ChatGPT. La herramienta produjo informaci\u0026#243;n que parec\u0026#237;a formal, pero era falsa. Este caso se volvi\u0026#243; famoso porque mostr\u0026#243; un riesgo importante: una respuesta puede sonar segura aunque est\u0026#233; equivocada.\u003c/p\u003e\u003cp\u003eLa ense\u0026#241;anza no es que la IA sea in\u0026#250;til. La ense\u0026#241;anza es que debe usarse con cuidado. La herramienta puede ayudar a redactar o investigar, pero no debe reemplazar la verificaci\u0026#243;n cuando el tema es serio.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eLecci\u0026#243;n pr\u0026#225;cticaCuando una respuesta se usar\u0026#225; para temas legales, m\u0026#233;dicos, financieros o acad\u0026#233;micos, no basta con que suene bien. Debe verificarse.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.12 Hacia d\u0026#243;nde vamos: IA multimodal y asistentes personales\u003c/h3\u003e\u003cp\u003eEstamos avanzando hacia asistentes m\u0026#225;s multimodales: herramientas que entienden texto, im\u0026#225;genes, audio y video. Tambi\u0026#233;n veremos agentes que pueden ayudar a completar tareas m\u0026#225;s largas, como organizar documentos, preparar reportes o acompa\u0026#241;ar procesos paso a paso.\u003c/p\u003e\u003cp\u003eEsto puede ser muy \u0026#250;til, pero tambi\u0026#233;n exige m\u0026#225;s criterio. Mientras la tecnolog\u0026#237;a se vuelve m\u0026#225;s capaz, la habilidad m\u0026#225;s importante ser\u0026#225; saber preguntar, revisar y decidir. El futuro no premiar\u0026#225; solamente a quien tenga la herramienta m\u0026#225;s nueva, sino a quien sepa usarla con buen juicio.\u003c/p\u003e\u003cp\u003eOtra tendencia importante es la personalizaci\u0026#243;n. Los asistentes podr\u0026#225;n recordar preferencias, ayudar a mantener rutinas y trabajar en varios dispositivos. Esto ser\u0026#225; c\u0026#243;modo, pero tambi\u0026#233;n har\u0026#225; m\u0026#225;s importante proteger la privacidad y revisar qu\u0026#233; permisos se conceden.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.13 Ejercicio de cierre\u003c/h3\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEscriba un c\u0026#243;digo b\u0026#225;sico sobre una necesidad real.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eMej\u0026#243;relo usando objetivo, contexto, tono y formato.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida a la IA una segunda versi\u0026#243;n.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise si la respuesta es \u0026#250;til y segura.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAnote qu\u0026#233; tendr\u0026#237;a que verificar.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"doc-divider\"\u003eM\u0026#243;dulo 3 ampliado: El Arte de Conversar mediante \u0026quot;C\u0026#243;digos\u0026quot;\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.A Por qu\u0026#233; los c\u0026#243;digos cambian los resultados\u003c/h3\u003e\u003cp\u003eUna misma herramienta puede dar una respuesta pobre o excelente dependiendo de c\u0026#243;mo se le pregunte. Esto no significa que usted deba escribir perfecto. Significa que puede aprender a guiar la conversaci\u0026#243;n.\u003c/p\u003e\u003cp\u003eUn buen c\u0026#243;digo funciona como una conversaci\u0026#243;n clara con una persona que quiere ayudar. Si usted explica el objetivo, el contexto, el tono y el formato, la respuesta tendr\u0026#225; m\u0026#225;s posibilidades de ser \u0026#250;til.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.B T\u0026#233;cnicas de conversaci\u0026#243;n con IA\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eT\u0026#233;cnica\u003c/td\u003e\u003ctd\u003eC\u0026#243;mo se usa\u003c/td\u003e\u003ctd\u003eEjemplo\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePedir simplificaci\u0026#243;n\u003c/td\u003e\u003ctd\u003eCuando la respuesta es muy t\u0026#233;cnica.\u003c/td\u003e\u003ctd\u003eHazlo m\u0026#225;s sencillo y usa ejemplos cotidianos.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePedir formato\u003c/td\u003e\u003ctd\u003eCuando quiere orden.\u003c/td\u003e\u003ctd\u003ePonlo en una tabla con dos columnas.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePedir alternativas\u003c/td\u003e\u003ctd\u003eCuando quiere comparar.\u003c/td\u003e\u003ctd\u003eDame tres versiones: breve, formal y amistosa.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePedir preguntas\u003c/td\u003e\u003ctd\u003eCuando no sabe por d\u0026#243;nde empezar.\u003c/td\u003e\u003ctd\u003eHazme preguntas para entender mejor mi necesidad.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePedir verificaci\u0026#243;n\u003c/td\u003e\u003ctd\u003eCuando el tema es delicado.\u003c/td\u003e\u003ctd\u003eDime qu\u0026#233; partes debo confirmar con una fuente oficial.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.C Taller: transformar ideas en c\u0026#243;digos\u003c/h3\u003e\u003ch4\u003eNecesidad: Cancelar una cita\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo b\u0026#225;sico\u003c/td\u003e\u003ctd\u003eC\u0026#243;digo mejorado\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAy\u0026#250;dame a cancelar.\u003c/td\u003e\u003ctd\u003eRedacta un mensaje breve y amable para cancelar una cita ma\u0026#241;ana. Incluye disculpa y pregunta por opciones para reprogramar.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eNecesidad: Pedir explicaci\u0026#243;n m\u0026#233;dica general\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo b\u0026#225;sico\u003c/td\u003e\u003ctd\u003eC\u0026#243;digo mejorado\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eExpl\u0026#237;came este medicamento.\u003c/td\u003e\u003ctd\u003eExpl\u0026#237;came en lenguaje sencillo qu\u0026#233; preguntas debo hacer a mi m\u0026#233;dico sobre un nuevo medicamento. No des diagn\u0026#243;stico.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eNecesidad: Organizar gastos\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo b\u0026#225;sico\u003c/td\u003e\u003ctd\u003eC\u0026#243;digo mejorado\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHazme una tabla.\u003c/td\u003e\u003ctd\u003eOrganiza esta lista de gastos por categor\u0026#237;a y calcula un total aproximado. Se\u0026#241;ala qu\u0026#233; datos debo revisar.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eNecesidad: Entender noticia\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo b\u0026#225;sico\u003c/td\u003e\u003ctd\u003eC\u0026#243;digo mejorado\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eResume esto.\u003c/td\u003e\u003ctd\u003eResume esta noticia en cinco puntos sencillos y dime qu\u0026#233; afirmaciones debo verificar antes de compartirla.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eNecesidad: Crear tarjeta\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo b\u0026#225;sico\u003c/td\u003e\u003ctd\u003eC\u0026#243;digo mejorado\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHaz una invitaci\u0026#243;n.\u003c/td\u003e\u003ctd\u003eEscribe una invitaci\u0026#243;n c\u0026#225;lida para un almuerzo familiar, con tono alegre y m\u0026#225;ximo 70 palabras.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.D Banco ampliado de c\u0026#243;digos por categor\u0026#237;a\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCategor\u0026#237;a\u003c/td\u003e\u003ctd\u003eC\u0026#243;digo listo para copiar\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eExplicaci\u0026#243;n\u003c/td\u003e\u003ctd\u003eExpl\u0026#237;came [tema] como si fuera la primera vez que lo escucho. Usa una analog\u0026#237;a y tres ejemplos.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eResumen\u003c/td\u003e\u003ctd\u003eResume este texto en cinco puntos y separa hechos, opiniones y dudas.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eComparaci\u0026#243;n\u003c/td\u003e\u003ctd\u003eCompara [opci\u0026#243;n A] y [opci\u0026#243;n B] en una tabla con ventajas, desventajas y preguntas para verificar.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCarta\u003c/td\u003e\u003ctd\u003eRedacta una carta formal sobre [tema], breve, clara y respetuosa. Incluye asunto y cierre.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCorreo sospechoso\u003c/td\u003e\u003ctd\u003eAnaliza este mensaje sin datos personales y dime si hay se\u0026#241;ales de fraude.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eImagen\u003c/td\u003e\u003ctd\u003eDescribe esta imagen y dime qu\u0026#233; informaci\u0026#243;n importante aparece.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAprendizaje\u003c/td\u003e\u003ctd\u003eCrea una pr\u0026#225;ctica de 10 minutos para aprender [tema] con pasos sencillos.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCreatividad\u003c/td\u003e\u003ctd\u003eDame 10 ideas para [proyecto], con opciones f\u0026#225;ciles de realizar.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.E Uso de im\u0026#225;genes con cuidado\u003c/h3\u003e\u003cp\u003eCuando una herramienta permite analizar im\u0026#225;genes, puede ser tentador subir cualquier captura. Antes de hacerlo, revise si hay nombres, direcciones, n\u0026#250;meros de cuenta, c\u0026#243;digos, rostros de personas que no dieron permiso o informaci\u0026#243;n m\u0026#233;dica. Si hay datos sensibles, describa la situaci\u0026#243;n con palabras en lugar de subir la imagen.\u003c/p\u003e\u003cp\u003eUna buena alternativa es escribir: \u0026quot;Recib\u0026#237; una captura que dice que mi cuenta ser\u0026#225; cerrada hoy si no hago clic en un enlace. \u0026#191;Qu\u0026#233; se\u0026#241;ales de alerta debo revisar?\u0026quot;. As\u0026#237; obtiene ayuda sin compartir la imagen.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.F B\u0026#250;squeda bibliogr\u0026#225;fica y fuentes\u003c/h3\u003e\u003cp\u003eBuscar fuentes no es solo para estudiantes o investigadores. Tambi\u0026#233;n sirve para confirmar noticias, tr\u0026#225;mites, beneficios, cambios de pol\u0026#237;tica, informaci\u0026#243;n de salud y decisiones financieras. La IA puede ayudar a encontrar el camino, pero la confirmaci\u0026#243;n debe venir de una fuente confiable.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eTipo de informaci\u0026#243;n\u003c/td\u003e\u003ctd\u003eFuente m\u0026#225;s confiable\u003c/td\u003e\u003ctd\u003eEjemplo de verificaci\u0026#243;n\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTr\u0026#225;mite gubernamental\u003c/td\u003e\u003ctd\u003eSitio oficial del gobierno\u003c/td\u003e\u003ctd\u003eConfirmar requisitos y fechas.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSalud\u003c/td\u003e\u003ctd\u003eM\u0026#233;dico, cl\u0026#237;nica, hospital o instituci\u0026#243;n reconocida\u003c/td\u003e\u003ctd\u003eConfirmar recomendaciones generales.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBanco o tarjeta\u003c/td\u003e\u003ctd\u003eSitio o tel\u0026#233;fono oficial de la instituci\u0026#243;n\u003c/td\u003e\u003ctd\u003eConfirmar cargos o alertas.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eViajes\u003c/td\u003e\u003ctd\u003eAerol\u0026#237;nea, hotel o agencia oficial\u003c/td\u003e\u003ctd\u003eConfirmar pol\u0026#237;ticas, precios y horarios.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNoticias\u003c/td\u003e\u003ctd\u003eMedios reconocidos y varias fuentes\u003c/td\u003e\u003ctd\u003eComparar cobertura y fecha.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.G Noticias: el riesgo de sonar convincente\u003c/h3\u003e\u003cp\u003eEl caso de los abogados sancionados por usar citas falsas generadas por ChatGPT mostr\u0026#243; algo muy importante: una respuesta puede tener apariencia profesional y aun as\u0026#237; estar equivocada. Esto es especialmente peligroso porque el lenguaje correcto puede dar una falsa sensaci\u0026#243;n de seguridad.\u003c/p\u003e\u003cp\u003eLa pr\u0026#225;ctica correcta no es dejar de usar IA, sino pedir ayuda de forma responsable. Puede ayudar a redactar, resumir y organizar ideas. Pero si una respuesta menciona leyes, estudios, cifras o nombres de documentos, debe verificarse.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.H Pr\u0026#225;cticas adicionales del m\u0026#243;dulo 3\u003c/h3\u003e\u003ch4\u003eMejorar tono\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoReescribe este mensaje en tono amable, claro y respetuoso: [mensaje].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003ePractique pidiendo una segunda versi\u0026#243;n: m\u0026#225;s corta, m\u0026#225;s clara o con ejemplos.\u003c/p\u003e\u003ch4\u003ePedir pasos\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoExpl\u0026#237;came c\u0026#243;mo hacer [tarea] en pasos numerados y con palabras sencillas.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003ePractique pidiendo una segunda versi\u0026#243;n: m\u0026#225;s corta, m\u0026#225;s clara o con ejemplos.\u003c/p\u003e\u003ch4\u003ePedir tabla\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoConvierte esta informaci\u0026#243;n en una tabla con columnas: tema, acci\u0026#243;n y prioridad.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003ePractique pidiendo una segunda versi\u0026#243;n: m\u0026#225;s corta, m\u0026#225;s clara o con ejemplos.\u003c/p\u003e\u003ch4\u003ePedir revisi\u0026#243;n\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoRevisa este texto y dime si hay algo confuso, repetido o demasiado t\u0026#233;cnico.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003ePractique pidiendo una segunda versi\u0026#243;n: m\u0026#225;s corta, m\u0026#225;s clara o con ejemplos.\u003c/p\u003e\u003ch4\u003ePedir fuentes\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoSugiere fuentes confiables para verificar esta informaci\u0026#243;n: [texto].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003ePractique pidiendo una segunda versi\u0026#243;n: m\u0026#225;s corta, m\u0026#225;s clara o con ejemplos.\u003c/p\u003e\u003c/section\u003e","\u003cdiv class=\"doc-divider\"\u003eM\u0026#243;dulo 4: Navegando con Seguridad y Criterio\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eContenidoNavegaci\u0026#243;n Segura: Alfabetizaci\u0026#243;n digital cr\u0026#237;tica para un uso responsable.Aprenderemos a identificar las alucinaciones, o errores, de la IA y desarrollaremos el h\u0026#225;bito de verificar la informaci\u0026#243;n con fuentes confiables.Este m\u0026#243;dulo se enfocar\u0026#225; en proteger la privacidad del usuario y asegurar que la tecnolog\u0026#237;a sea siempre un apoyo, nunca un riesgo.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.1 \u0026#191;Qu\u0026#233; son las alucinaciones de IA?\u003c/h3\u003e\u003cp\u003eUna alucinaci\u0026#243;n ocurre cuando la IA inventa informaci\u0026#243;n o presenta como cierto algo que no est\u0026#225; confirmado. El problema es que la respuesta puede sonar muy segura. Por eso no debemos medir la verdad por el tono de seguridad, sino por la verificaci\u0026#243;n.\u003c/p\u003e\u003cp\u003eLa IA genera respuestas probables. A veces acierta, a veces se equivoca. En temas simples puede ser una gran ayuda. En temas delicados debe ser solo el primer paso.\u003c/p\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003ePuede inventar fechas.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003ePuede mezclar datos de diferentes lugares.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003ePuede crear referencias que no existen.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003ePuede dar una recomendaci\u0026#243;n general que no aplica a su situaci\u0026#243;n.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003ePuede resumir mal un documento si no entiende el contexto.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eRegla sencillaSi la respuesta puede afectar su salud, dinero, seguridad, documentos o decisiones importantes, verifique antes de actuar.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.2 C\u0026#243;mo verificar informaci\u0026#243;n\u003c/h3\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePregunte a la IA: \u0026quot;\u0026#191;Qu\u0026#233; partes de esta respuesta debo verificar?\u0026quot;.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eBusque una fuente oficial: gobierno, banco, hospital, universidad, compa\u0026#241;\u0026#237;a o documento original.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCompare al menos dos fuentes cuando el tema sea importante.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise la fecha de publicaci\u0026#243;n.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eSi el tema involucra dinero, salud o leyes, consulte a una persona calificada.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eGuarde evidencia si una herramienta le dio una instrucci\u0026#243;n importante, pero confirme antes de actuar.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo de verificaci\u0026#243;nLee esta respuesta y dime qu\u0026#233; afirmaciones requieren verificaci\u0026#243;n. Luego sugiere qu\u0026#233; tipo de fuente ser\u0026#237;a confiable para cada afirmaci\u0026#243;n.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.3 Privacidad: lo que no debe compartir\u003c/h3\u003e\u003cp\u003eUna buena pr\u0026#225;ctica de seguridad es tratar a la IA como una herramienta p\u0026#250;blica, especialmente si no sabe exactamente c\u0026#243;mo se almacenan los datos. Puede usarla para aprender y organizar ideas, pero evite pegar informaci\u0026#243;n sensible.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eNo comparta\u003c/td\u003e\u003ctd\u003ePuede escribir en su lugar\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eContrase\u0026#241;as\u003c/td\u003e\u003ctd\u003eDiga: \u0026quot;tengo una contrase\u0026#241;a que quiero hacer m\u0026#225;s segura\u0026quot;.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eN\u0026#250;meros completos de cuenta\u003c/td\u003e\u003ctd\u003eDiga: \u0026quot;tengo una cuenta bancaria, \u0026#191;qu\u0026#233; se\u0026#241;ales debo revisar?\u0026quot;.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digos de verificaci\u0026#243;n\u003c/td\u003e\u003ctd\u003eNunca los pegue en una IA ni los comparta por tel\u0026#233;fono.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eN\u0026#250;mero de Seguro Social o identificaci\u0026#243;n\u003c/td\u003e\u003ctd\u003eUse ejemplos ficticios si necesita practicar.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eInformaci\u0026#243;n m\u0026#233;dica detallada con nombre completo\u003c/td\u003e\u003ctd\u003eQuite nombres, n\u0026#250;meros y datos personales.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDocumentos con direcci\u0026#243;n completa\u003c/td\u003e\u003ctd\u003eUse una versi\u0026#243;n editada o describa la situaci\u0026#243;n sin datos privados.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.4 Noticias reales sobre IA y seguridad\u003c/h3\u003e\u003cp\u003eLa IA ha aparecido en noticias importantes porque puede ayudar, pero tambi\u0026#233;n puede usarse mal. Conocer estos casos nos ayuda a estar alerta y a practicar la regla: Alto, Verifique, Consulte y Decida.\u003c/p\u003e\u003ch4\u003eCaso 1: Robollamada con voz falsa\u003c/h4\u003e\u003cp\u003eEn 2024, autoridades de Estados Unidos investigaron robollamadas que usaron una voz falsa generada con IA imitando al presidente Joe Biden antes de una elecci\u0026#243;n primaria en New Hampshire. La historia mostr\u0026#243; que ya no basta con reconocer una voz; tambi\u0026#233;n hay que verificar el contexto y la fuente.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eQu\u0026#233; aprendemosSi recibe una llamada urgente de alguien conocido pidiendo dinero o acci\u0026#243;n inmediata, cuelgue y llame usted mismo al n\u0026#250;mero que ya conoce.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eCaso 2: Chatbot con informaci\u0026#243;n incorrecta\u003c/h4\u003e\u003cp\u003eEl caso de Air Canada mostr\u0026#243; que un chatbot puede dar informaci\u0026#243;n incorrecta sobre pol\u0026#237;ticas o servicios. Aunque la herramienta parezca oficial, conviene confirmar en documentos oficiales o con atenci\u0026#243;n al cliente.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eQu\u0026#233; aprendemosTome capturas si una herramienta le da una instrucci\u0026#243;n importante, pero confirme antes de gastar dinero o tomar una decisi\u0026#243;n.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eCaso 3: Regulaci\u0026#243;n de IA\u003c/h4\u003e\u003cp\u003eLa Uni\u0026#243;n Europea aprob\u0026#243; una ley de IA que entr\u0026#243; en vigor en 2024 y establece reglas para distintos niveles de riesgo. Esto muestra hacia d\u0026#243;nde va el mundo: m\u0026#225;s uso de IA, pero tambi\u0026#233;n m\u0026#225;s necesidad de reglas, transparencia y responsabilidad.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eQu\u0026#233; aprendemosLa IA seguir\u0026#225; creciendo. La seguridad, la privacidad y la verificaci\u0026#243;n ser\u0026#225;n habilidades b\u0026#225;sicas de la vida digital.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eCaso 4: Derechos de autor y contenido en internet\u003c/h4\u003e\u003cp\u003eVarias compa\u0026#241;\u0026#237;as de medios han cuestionado c\u0026#243;mo algunas herramientas de IA usan contenido publicado en internet. Este debate es importante porque muestra que la IA no solo afecta a usuarios individuales, sino tambi\u0026#233;n a escritores, periodistas, artistas, empresas y educadores.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eQu\u0026#233; aprendemosCuando use IA para crear contenido, revise si debe citar fuentes, pedir permiso o aclarar que se trata de una creaci\u0026#243;n asistida por IA.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.5 Se\u0026#241;ales de alerta en mensajes sospechosos\u003c/h3\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eLe piden actuar de inmediato.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eLe dicen que no consulte a nadie.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eLe piden c\u0026#243;digos, contrase\u0026#241;as o n\u0026#250;meros de cuenta.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eLe ofrecen un premio inesperado.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eEl mensaje tiene errores extra\u0026#241;os o enlaces raros.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eUsa miedo: \u0026quot;su cuenta ser\u0026#225; cerrada\u0026quot;.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eUsa emoci\u0026#243;n: \u0026quot;un familiar est\u0026#225; en problemas\u0026quot;.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eLe piden pagar con tarjetas de regalo, criptomonedas o transferencias urgentes.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003ePr\u0026#225;ctica paso a paso: revisar un mensaje sospechoso\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo de pr\u0026#225;cticaAnaliza este mensaje. No incluyo datos personales. Dime si parece una estafa, qu\u0026#233; se\u0026#241;ales de alerta ves y qu\u0026#233; pasos seguros debo seguir.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCopie el mensaje sospechoso.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eQuite nombres, n\u0026#250;meros y datos privados.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePegue el c\u0026#243;digo de revisi\u0026#243;n.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eLea las se\u0026#241;ales de alerta.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eNo responda todav\u0026#237;a.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eVerifique por un canal oficial.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.6 Verificaci\u0026#243;n de im\u0026#225;genes, videos y voces\u003c/h3\u003e\u003cp\u003eLa IA moderna puede crear im\u0026#225;genes, videos o voces falsas. Por eso, ver una imagen o escuchar una voz ya no siempre es suficiente para confiar. Cuando algo parece urgente o emocional, conviene verificar por otro canal.\u003c/p\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eSi una voz familiar pide dinero, llame usted al n\u0026#250;mero que ya conoce.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eSi una imagen parece escandalosa, busque si otros medios confiables la reportan.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eSi un video parece extra\u0026#241;o, revise fecha, fuente y contexto.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eNo comparta contenido dudoso solo porque parece real.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo de apoyoTengo dudas sobre esta imagen, audio o video. Dame una lista de se\u0026#241;ales que deber\u0026#237;a revisar antes de creerlo o compartirlo.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.7 Hacia d\u0026#243;nde vamos: confianza digital\u003c/h3\u003e\u003cp\u003eEl futuro traer\u0026#225; asistentes m\u0026#225;s presentes en tel\u0026#233;fonos, computadoras, autos, electrodom\u0026#233;sticos y servicios. Tambi\u0026#233;n veremos m\u0026#225;s im\u0026#225;genes y voces generadas por IA. La habilidad central no ser\u0026#225; saberlo todo, sino saber verificar.\u003c/p\u003e\u003cp\u003eLa confianza digital se construye con cuatro h\u0026#225;bitos: detenerse, verificar, consultar y decidir. Estos h\u0026#225;bitos protegen su informaci\u0026#243;n y su tranquilidad.\u003c/p\u003e\u003cp\u003eTambi\u0026#233;n veremos m\u0026#225;s reglas. Gobiernos, escuelas, bancos y empresas est\u0026#225;n definiendo pol\u0026#237;ticas para el uso de IA. Esto no significa que la tecnolog\u0026#237;a desaparecer\u0026#225;. Significa que se volver\u0026#225; parte de la vida diaria y necesitaremos aprender a usarla con responsabilidad.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.8 Ejercicio de cierre\u003c/h3\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eLea un mensaje simulado o real quitando datos personales.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eMarque se\u0026#241;ales de urgencia, miedo o solicitud de informaci\u0026#243;n sensible.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eUse el c\u0026#243;digo de revisi\u0026#243;n para pedir ayuda a la IA.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCompare la respuesta con su propio criterio.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eDecida qu\u0026#233; fuente oficial deber\u0026#237;a consultar.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"doc-divider\"\u003eM\u0026#243;dulo 4 ampliado: Navegando con Seguridad y Criterio\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.A Seguridad como h\u0026#225;bito, no como miedo\u003c/h3\u003e\u003cp\u003eLa seguridad digital no debe vivirse como miedo permanente. Debe vivirse como una serie de h\u0026#225;bitos. As\u0026#237; como se mira a ambos lados antes de cruzar una calle, tambi\u0026#233;n se puede detener antes de hacer clic, verificar antes de pagar y consultar antes de compartir informaci\u0026#243;n sensible.\u003c/p\u003e\u003cp\u003eLa IA puede ser parte del problema cuando se usa para crear enga\u0026#241;os, pero tambi\u0026#233;n puede ser parte de la soluci\u0026#243;n cuando ayuda a analizar mensajes sospechosos, resumir pol\u0026#237;ticas o identificar se\u0026#241;ales de alerta.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.B Alucinaciones: ejemplos detallados\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eTipo de alucinaci\u0026#243;n\u003c/td\u003e\u003ctd\u003eEjemplo\u003c/td\u003e\u003ctd\u003eC\u0026#243;mo responder\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eFecha incorrecta\u003c/td\u003e\u003ctd\u003eLa IA dice que una ley cambi\u0026#243; en una fecha equivocada.\u003c/td\u003e\u003ctd\u003eBuscar la p\u0026#225;gina oficial o pedir fuente.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCita inventada\u003c/td\u003e\u003ctd\u003eLa IA menciona un estudio que no existe.\u003c/td\u003e\u003ctd\u003ePedir enlace y verificar si el documento existe.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eConsejo general mal aplicado\u003c/td\u003e\u003ctd\u003eLa IA da una recomendaci\u0026#243;n financiera demasiado amplia.\u003c/td\u003e\u003ctd\u003eConsultar a una persona calificada.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eResumen incompleto\u003c/td\u003e\u003ctd\u003eLa IA omite una condici\u0026#243;n importante de una pol\u0026#237;tica.\u003c/td\u003e\u003ctd\u003eLeer el documento original.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eConfusi\u0026#243;n de nombres\u003c/td\u003e\u003ctd\u003eLa IA mezcla compa\u0026#241;\u0026#237;as o productos parecidos.\u003c/td\u003e\u003ctd\u003eConfirmar nombres y detalles.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.C Privacidad en la pr\u0026#225;ctica\u003c/h3\u003e\u003cp\u003eUna forma segura de usar IA es cambiar datos reales por ejemplos ficticios. Si quiere practicar con una factura, puede borrar nombre, direcci\u0026#243;n, n\u0026#250;mero de cuenta y monto exacto. Si quiere practicar con una situaci\u0026#243;n m\u0026#233;dica, puede hablar de preguntas generales sin incluir informaci\u0026#243;n privada.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eEjemplo seguroEn lugar de escribir: \u0026quot;Mi cuenta 123456 del banco X tiene un cargo de $487.23\u0026quot;, escriba: \u0026quot;Tengo una cuenta bancaria con un cargo que no reconozco. \u0026#191;Qu\u0026#233; pasos seguros debo seguir para verificarlo?\u0026quot;\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.D Historias reales ampliadas\u003c/h3\u003e\u003cp\u003eLas noticias sobre IA no deben leerse solo como problemas lejanos. Cada caso ense\u0026#241;a una pr\u0026#225;ctica concreta para la vida diaria.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eHistoria\u003c/td\u003e\u003ctd\u003eQu\u0026#233; ocurri\u0026#243;\u003c/td\u003e\u003ctd\u003ePr\u0026#225;ctica que deja\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRobollamada con voz falsa\u003c/td\u003e\u003ctd\u003eSe investig\u0026#243; una llamada pol\u0026#237;tica con voz generada por IA.\u003c/td\u003e\u003ctd\u003eNo confiar solo en una voz. Verificar por otro canal.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAir Canada chatbot\u003c/td\u003e\u003ctd\u003eUn chatbot dio informaci\u0026#243;n incorrecta sobre una pol\u0026#237;tica de viaje.\u003c/td\u003e\u003ctd\u003eConfirmar pol\u0026#237;ticas en documentos oficiales.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCitas legales falsas\u003c/td\u003e\u003ctd\u003eHerramientas de IA generaron casos legales inexistentes.\u003c/td\u003e\u003ctd\u003eVerificar fuentes cuando haya leyes o documentos.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDebates de derechos de autor\u003c/td\u003e\u003ctd\u003eMedios y autores cuestionan el uso de contenido por sistemas de IA.\u003c/td\u003e\u003ctd\u003eCitar fuentes y respetar contenido ajeno.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRegulaci\u0026#243;n de IA en Europa\u003c/td\u003e\u003ctd\u003eLa Uni\u0026#243;n Europea aprob\u0026#243; reglas para sistemas de IA seg\u0026#250;n riesgo.\u003c/td\u003e\u003ctd\u003eEl mundo est\u0026#225; creando normas para usar IA con responsabilidad.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.E Pr\u0026#225;ctica: revisar mensajes sospechosos\u003c/h3\u003e\u003ch4\u003eMensaje simulado\u003c/h4\u003e\u003cp\u003eSu cuenta ser\u0026#225; suspendida hoy. Haga clic aqu\u0026#237; para evitar el cierre.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo para analizarAnaliza este mensaje. No incluyo datos personales. Dime qu\u0026#233; se\u0026#241;ales de alerta ves y qu\u0026#233; har\u0026#237;as antes de responder.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eMensaje simulado\u003c/h4\u003e\u003cp\u003eSoy su familiar. Cambi\u0026#233; de n\u0026#250;mero. Necesito dinero urgente y no puedo hablar.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo para analizarAnaliza este mensaje. No incluyo datos personales. Dime qu\u0026#233; se\u0026#241;ales de alerta ves y qu\u0026#233; har\u0026#237;as antes de responder.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eMensaje simulado\u003c/h4\u003e\u003cp\u003eGan\u0026#243; un premio. Env\u0026#237;e sus datos bancarios para recibirlo.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo para analizarAnaliza este mensaje. No incluyo datos personales. Dime qu\u0026#233; se\u0026#241;ales de alerta ves y qu\u0026#233; har\u0026#237;as antes de responder.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eMensaje simulado\u003c/h4\u003e\u003cp\u003eTenemos un reembolso para usted. Confirme su c\u0026#243;digo de seguridad.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo para analizarAnaliza este mensaje. No incluyo datos personales. Dime qu\u0026#233; se\u0026#241;ales de alerta ves y qu\u0026#233; har\u0026#237;as antes de responder.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.F Hacia d\u0026#243;nde vamos: seguridad en un mundo de contenido generado\u003c/h3\u003e\u003cp\u003eVeremos m\u0026#225;s contenido creado por IA: voces, im\u0026#225;genes, videos, textos, anuncios, mensajes y res\u0026#250;menes. Algunas creaciones ser\u0026#225;n \u0026#250;tiles y leg\u0026#237;timas. Otras buscar\u0026#225;n enga\u0026#241;ar. Por eso, la verificaci\u0026#243;n ser\u0026#225; tan importante como saber leer.\u003c/p\u003e\u003cp\u003eTambi\u0026#233;n veremos m\u0026#225;s herramientas que ayudan a detectar fraudes, filtrar mensajes y confirmar identidad. La seguridad no depender\u0026#225; de una sola aplicaci\u0026#243;n. Depender\u0026#225; de h\u0026#225;bitos: no apresurarse, verificar fuentes, consultar y proteger datos.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.G Pr\u0026#225;cticas adicionales del m\u0026#243;dulo 4\u003c/h3\u003e\u003ch4\u003eRevisar urgencia\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoEste mensaje intenta que act\u0026#250;e r\u0026#225;pido. Identifica si usa urgencia, miedo o presi\u0026#243;n emocional: [mensaje].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eDespu\u0026#233;s de usar el c\u0026#243;digo, piense qu\u0026#233; har\u0026#237;a usted antes de actuar.\u003c/p\u003e\u003ch4\u003eProteger datos\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoReescribe esta pregunta para que no incluya informaci\u0026#243;n personal: [pregunta].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eDespu\u0026#233;s de usar el c\u0026#243;digo, piense qu\u0026#233; har\u0026#237;a usted antes de actuar.\u003c/p\u003e\u003ch4\u003eVerificar noticia\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoDime qu\u0026#233; partes de esta noticia debo verificar y qu\u0026#233; fuentes ser\u0026#237;an confiables: [noticia].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eDespu\u0026#233;s de usar el c\u0026#243;digo, piense qu\u0026#233; har\u0026#237;a usted antes de actuar.\u003c/p\u003e\u003ch4\u003eCrear regla familiar\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo sugeridoAy\u0026#250;dame a crear una regla familiar simple para verificar llamadas de emergencia.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eDespu\u0026#233;s de usar el c\u0026#243;digo, piense qu\u0026#233; har\u0026#237;a usted antes de actuar.\u003c/p\u003e\u003c/section\u003e","\u003cdiv class=\"doc-divider\"\u003eM\u0026#243;dulo 5: Taller Creativo y Pr\u0026#225;ctico\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eContenidoSesi\u0026#243;n final de aplicaci\u0026#243;n real y convivencia.A trav\u0026#233;s de din\u0026#225;micas grupales y escenarios independientes, los estudiantes aplicar\u0026#225;n sus c\u0026#243;digos para resolver retos reales y desarrollar un proyecto personal.En este nivel final se consolidar\u0026#225; la confianza digital y se celebrar\u0026#225; la capacidad de seguir aprendiendo en la era moderna.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.1 Preparaci\u0026#243;n para el taller\u003c/h3\u003e\u003cp\u003eEn este m\u0026#243;dulo usted aplicar\u0026#225; lo aprendido. No se trata de demostrar perfecci\u0026#243;n. Se trata de practicar con una necesidad real y ver c\u0026#243;mo la IA puede ayudarle a avanzar.\u003c/p\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eElija una necesidad real: viaje, carta, presupuesto, historia familiar, salud general, seguridad o aprendizaje.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eEscriba un primer c\u0026#243;digo.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eRevise la respuesta.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003ePida mejoras.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eVerifique la informaci\u0026#243;n importante.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eConvierta el resultado en algo \u0026#250;til.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.2 Reto 1: Planificar un viaje tranquilo\u003c/h3\u003e\u003cp\u003eLa IA puede ayudar a crear un itinerario, pero usted debe confirmar precios, horarios y disponibilidad. Este reto muestra c\u0026#243;mo pedir un plan realista y c\u0026#243;mo revisarlo antes de usarlo.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digoPlanifica un viaje de 3 d\u0026#237;as a [ciudad] con actividades tranquilas, descansos, opciones de transporte sencillo y un presupuesto aproximado.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEscriba el destino.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAgregue fechas o temporada.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida actividades tranquilas.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida descansos entre actividades.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise si el plan parece realista.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eVerifique horarios en sitios oficiales.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida una versi\u0026#243;n m\u0026#225;s econ\u0026#243;mica o con menos caminata si lo necesita.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.3 Reto 2: Redactar una carta importante\u003c/h3\u003e\u003cp\u003eDespu\u0026#233;s de recibir la carta, puede pedir: \u0026quot;hazla m\u0026#225;s corta\u0026quot;, \u0026quot;hazla m\u0026#225;s amable\u0026quot; o \u0026quot;agrega una frase de agradecimiento\u0026quot;. Lea el resultado antes de enviarlo.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digoRedacta una carta formal, clara y respetuosa para solicitar informaci\u0026#243;n sobre [tema]. Que sea breve y f\u0026#225;cil de entender.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eDefina a qui\u0026#233;n va dirigida la carta.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eExplique qu\u0026#233; necesita.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida tono formal y respetuoso.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise nombres, fechas y datos.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eGuarde la versi\u0026#243;n final.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.4 Reto 3: Organizar informaci\u0026#243;n de salud sin compartir datos sensibles\u003c/h3\u003e\u003cp\u003eLa IA puede ayudarle a prepararse, pero no reemplaza a un profesional. Este reto se enfoca en ordenar preguntas, no en recibir diagn\u0026#243;sticos.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digoAy\u0026#250;dame a preparar una lista de preguntas generales para mi pr\u0026#243;xima cita m\u0026#233;dica sobre [tema]. No des diagn\u0026#243;stico; solo preguntas para conversar con un profesional.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEscriba el tema general.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEvite nombres, n\u0026#250;meros de expediente o datos privados.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida preguntas para llevar a la cita.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eElija las preguntas m\u0026#225;s importantes.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eConsulte al profesional correspondiente.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.5 Reto 4: Detectar una posible estafa\u003c/h3\u003e\u003cp\u003eQuite nombres, n\u0026#250;meros de cuenta, direcciones y cualquier informaci\u0026#243;n privada antes de pegar el mensaje. Si el mensaje pide dinero o c\u0026#243;digos, no responda hasta verificar.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digoAnaliza este mensaje sin datos personales. Dime si parece sospechoso, qu\u0026#233; se\u0026#241;ales de alerta tiene y qu\u0026#233; deber\u0026#237;a hacer antes de responder.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCopie el mensaje.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eQuite datos privados.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida an\u0026#225;lisis de se\u0026#241;ales de alerta.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise la respuesta.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eConsulte una fuente oficial.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eDecida con calma.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.6 Reto 5: Crear una historia familiar\u003c/h3\u003e\u003cp\u003eEste ejercicio conecta tecnolog\u0026#237;a con memoria, familia y legado. La IA puede ordenar sus ideas, pero la historia sigue siendo suya.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digoAy\u0026#250;dame a convertir estos recuerdos en una historia breve, c\u0026#225;lida y respetuosa. Mant\u0026#233;n mi voz personal y no inventes detalles que no escrib\u0026#237;.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEscriba recuerdos en frases cortas.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida que los organice como historia.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise si la IA invent\u0026#243; algo.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eElimine detalles incorrectos.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAgregue su toque personal.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.7 Práctica independiente: el mensaje sospechoso\u003c/h3\u003e\u003cp\u003eEn este ejercicio, una persona lee un mensaje simulado y otra persona debe identificar se\u0026#241;ales de alerta. Luego se usa IA para revisar el mensaje y comparar resultados.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eMensaje simulado\u003c/td\u003e\u003ctd\u003eSe\u0026#241;al de alerta\u003c/td\u003e\u003ctd\u003eRespuesta segura\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u0026quot;Su cuenta ser\u0026#225; cerrada hoy. Haga clic aqu\u0026#237;\u0026quot;.\u003c/td\u003e\u003ctd\u003eUrgencia y enlace desconocido.\u003c/td\u003e\u003ctd\u003eNo hacer clic. Entrar al sitio oficial por cuenta propia.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u0026quot;Soy su nieto, necesito dinero y no le diga a nadie\u0026quot;.\u003c/td\u003e\u003ctd\u003ePresi\u0026#243;n emocional y secreto.\u003c/td\u003e\u003ctd\u003eLlamar al familiar por un n\u0026#250;mero conocido.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u0026quot;Gan\u0026#243; un premio, env\u0026#237;e sus datos bancarios\u0026quot;.\u003c/td\u003e\u003ctd\u003ePremio inesperado y solicitud financiera.\u003c/td\u003e\u003ctd\u003eIgnorar y reportar si es posible.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u0026quot;Debe pagar con tarjeta de regalo hoy\u0026quot;.\u003c/td\u003e\u003ctd\u003eForma de pago sospechosa.\u003c/td\u003e\u003ctd\u003eNo pagar. Verificar con la organizaci\u0026#243;n oficial.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.8 Proyecto personal final\u003c/h3\u003e\u003cp\u003eElija uno de los siguientes proyectos y complete los pasos. Puede hacerlo solo o con apoyo.\u003c/p\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003ePlan de viaje seguro.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eCarta formal.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003ePresupuesto mensual simple.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eLista de preguntas para una cita.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eHistoria familiar.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eAn\u0026#225;lisis de mensaje sospechoso.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eResumen de una noticia.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eDise\u0026#241;o de una invitaci\u0026#243;n o tarjeta.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003ePasos del proyecto\u003c/h4\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEscriba el objetivo de su proyecto.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eElija la herramienta que usar\u0026#225;.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEscriba un c\u0026#243;digo claro.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eLea la respuesta.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida una mejora.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eVerifique informaci\u0026#243;n importante.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eGuarde o copie el resultado final.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.9 Plantillas de proyectos\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eProyecto\u003c/td\u003e\u003ctd\u003eC\u0026#243;digo inicial\u003c/td\u003e\u003ctd\u003eProducto final\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePresupuesto mensual\u003c/td\u003e\u003ctd\u003eCrea una tabla sencilla para organizar estos gastos por categor\u0026#237;a: [lista].\u003c/td\u003e\u003ctd\u003eTabla revisada de gastos.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eResumen de noticia\u003c/td\u003e\u003ctd\u003eResume esta noticia en lenguaje sencillo y dime qu\u0026#233; datos verificar.\u003c/td\u003e\u003ctd\u003eResumen con notas de verificaci\u0026#243;n.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMensaje familiar\u003c/td\u003e\u003ctd\u003eRedacta un mensaje c\u0026#225;lido para [situaci\u0026#243;n], con tono cercano y breve.\u003c/td\u003e\u003ctd\u003eMensaje revisado.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eInvitaci\u0026#243;n\u003c/td\u003e\u003ctd\u003eCrea texto para una invitaci\u0026#243;n a [evento], con tono elegante y claro.\u003c/td\u003e\u003ctd\u003eTexto para tarjeta o WhatsApp.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLista de preguntas\u003c/td\u003e\u003ctd\u003eAy\u0026#250;dame a preparar preguntas para hablar con [profesional u oficina] sobre [tema].\u003c/td\u003e\u003ctd\u003eLista organizada de preguntas.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.10 Cierre: hacia d\u0026#243;nde estamos yendo\u003c/h3\u003e\u003cp\u003eLa IA seguir\u0026#225; apareciendo en m\u0026#225;s lugares: tel\u0026#233;fonos, buscadores, documentos, llamadas, im\u0026#225;genes, servicios p\u0026#250;blicos y atenci\u0026#243;n al cliente. Algunas herramientas ser\u0026#225;n muy \u0026#250;tiles; otras requerir\u0026#225;n cuidado.\u003c/p\u003e\u003cp\u003eEl futuro no ser\u0026#225; solamente aprender botones nuevos. Ser\u0026#225; aprender a pensar con criterio en un mundo donde la informaci\u0026#243;n se produce m\u0026#225;s r\u0026#225;pido que nunca.\u003c/p\u003e\u003cp\u003eUsted ya tiene una ventaja: experiencia de vida. Este curso suma una nueva herramienta a esa experiencia. La meta no es depender de la IA, sino usarla como apoyo para vivir con m\u0026#225;s autonom\u0026#237;a, seguridad y confianza.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eMensaje finalInnovar sin miedo no significa creer todo. Significa aprender, preguntar, practicar, verificar y decidir con seguridad.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"doc-divider\"\u003eM\u0026#243;dulo 5 ampliado: Taller Creativo y Pr\u0026#225;ctico\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.A Antes de comenzar el proyecto\u003c/h3\u003e\u003cp\u003eUn proyecto pr\u0026#225;ctico no tiene que ser complicado. Debe resolver una necesidad real. Puede ser una carta, un presupuesto, una lista de preguntas, un resumen de noticia, un plan de viaje o una historia familiar. Lo importante es completar el ciclo: idea, c\u0026#243;digo, resultado, revisi\u0026#243;n y uso.\u003c/p\u003e\u003cp\u003eEl proyecto debe terminar con algo que usted pueda guardar, imprimir, enviar o usar. No se trata solo de practicar por practicar; se trata de producir algo \u0026#250;til.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.B Proyecto 1 ampliado: plan de viaje seguro\u003c/h3\u003e\u003cp\u003eUn buen plan de viaje no solo enumera lugares bonitos. Tambi\u0026#233;n considera tiempos de descanso, transporte, clima, presupuesto y confirmaci\u0026#243;n de horarios. La IA puede preparar un borrador r\u0026#225;pido, pero usted debe confirmar detalles.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo inicialPlanifica un viaje de 3 d\u0026#237;as a [ciudad] con actividades tranquilas, descansos, opciones de transporte sencillo, presupuesto aproximado y recomendaciones de seguridad.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida primero un itinerario general.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eLuego pida una versi\u0026#243;n con menos caminata.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida una lista de documentos o reservas necesarias.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida una tabla de presupuesto aproximado.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eVerifique horarios y precios en sitios oficiales.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eGuarde el plan final.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.C Proyecto 2 ampliado: presupuesto mensual simple\u003c/h3\u003e\u003cp\u003eUn presupuesto no tiene que ser complejo. La IA puede ayudar a ordenar gastos en categor\u0026#237;as y detectar \u0026#225;reas para revisar. No escriba n\u0026#250;meros de cuenta ni informaci\u0026#243;n bancaria.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo inicialOrganiza estos gastos mensuales por categor\u0026#237;a, calcula un total aproximado y sugiere tres preguntas para revisar gastos innecesarios: [lista].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEscriba gastos sin datos bancarios.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida categor\u0026#237;as.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise si los c\u0026#225;lculos tienen sentido.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida una versi\u0026#243;n m\u0026#225;s simple.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCopie la tabla final en un documento o cuaderno.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.D Proyecto 3 ampliado: historia familiar\u003c/h3\u003e\u003cp\u003eLa IA puede ayudar a ordenar recuerdos sin quitarles valor personal. La regla m\u0026#225;s importante es pedir que no invente detalles. Usted aporta la memoria; la herramienta ayuda con estructura.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo inicialAy\u0026#250;dame a convertir estos recuerdos en una historia breve, c\u0026#225;lida y respetuosa. No inventes detalles. Mant\u0026#233;n mi voz personal: [recuerdos].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEscriba recuerdos en frases cortas.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida una historia breve.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise si hay datos inventados.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCorrija nombres, fechas y lugares.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida una versi\u0026#243;n m\u0026#225;s emotiva o m\u0026#225;s sencilla.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eComparta solo si se siente c\u0026#243;modo.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.E Proyecto 4 ampliado: carta o correo importante\u003c/h3\u003e\u003cp\u003eEscribir una carta puede tomar tiempo. La IA puede crear un primer borrador, pero usted debe revisar que el mensaje diga exactamente lo que desea.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo inicialRedacta una carta formal, clara y respetuosa para [destinatario] sobre [tema]. Incluye asunto, saludo, tres p\u0026#225;rrafos cortos y cierre amable.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eComplete destinatario y tema.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida el borrador.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise si el tono es correcto.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida una versi\u0026#243;n m\u0026#225;s breve si es necesario.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eVerifique datos antes de enviar.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.F Proyecto 5 ampliado: verificador personal de noticias\u003c/h3\u003e\u003cp\u003eEste proyecto ayuda a evitar compartir informaci\u0026#243;n falsa. Consiste en resumir una noticia, identificar afirmaciones importantes y decidir qu\u0026#233; verificar.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eC\u0026#243;digo inicialResume esta noticia en lenguaje sencillo. Separa hechos, opiniones y afirmaciones que necesitan verificaci\u0026#243;n. Sugiere fuentes confiables para confirmar.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePegue una noticia o fragmento.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePida separar hechos y opiniones.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRevise qu\u0026#233; datos requieren verificaci\u0026#243;n.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eBusque al menos una fuente adicional.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eDecida si conviene compartirla.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.G Escenarios de seguridad independientes\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSituaci\u0026#243;n\u003c/td\u003e\u003ctd\u003eRol A\u003c/td\u003e\u003ctd\u003eRol B\u003c/td\u003e\u003ctd\u003eObjetivo\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMensaje urgente del banco\u003c/td\u003e\u003ctd\u003eLee el mensaje simulado.\u003c/td\u003e\u003ctd\u003eIdentifica se\u0026#241;ales de alerta.\u003c/td\u003e\u003ctd\u003ePracticar pausa y verificaci\u0026#243;n.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLlamada de familiar pidiendo dinero\u003c/td\u003e\u003ctd\u003eAct\u0026#250;a como quien recibe la llamada.\u003c/td\u003e\u003ctd\u003eSugiere pasos seguros.\u003c/td\u003e\u003ctd\u003ePracticar verificaci\u0026#243;n por canal alterno.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNoticia impactante\u003c/td\u003e\u003ctd\u003ePresenta una noticia breve.\u003c/td\u003e\u003ctd\u003ePregunta qu\u0026#233; datos verificar.\u003c/td\u003e\u003ctd\u003ePracticar pensamiento cr\u0026#237;tico.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCorreo largo de una compa\u0026#241;\u0026#237;a\u003c/td\u003e\u003ctd\u003eLee un fragmento.\u003c/td\u003e\u003ctd\u003ePide resumen y se\u0026#241;ales de riesgo.\u003c/td\u003e\u003ctd\u003ePracticar uso de IA como apoyo.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.H Hacia d\u0026#243;nde estamos yendo\u003c/h3\u003e\u003cp\u003eLa IA se est\u0026#225; moviendo hacia asistentes m\u0026#225;s personales, m\u0026#225;s visuales y m\u0026#225;s integrados. Es probable que pronto muchas tareas se hagan hablando con un dispositivo o pidiendo ayuda dentro de una aplicaci\u0026#243;n. Tambi\u0026#233;n veremos IA en atenci\u0026#243;n al cliente, educaci\u0026#243;n, salud, transporte y entretenimiento.\u003c/p\u003e\u003cp\u003eEsto no significa que debamos usar todo. Significa que conviene entender lo b\u0026#225;sico para decidir. La persona que sabe preguntar, revisar y verificar tendr\u0026#225; m\u0026#225;s control que la persona que solo acepta lo que la pantalla dice.\u003c/p\u003e\u003cp\u003eEl aprendizaje no termina con este curso. Este curso abre una puerta. Cada pr\u0026#225;ctica adicional fortalece la confianza digital.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.I Lista final de c\u0026#243;digos favoritos\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eUso\u003c/td\u003e\u003ctd\u003eC\u0026#243;digo favorito\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eExplicar\u003c/td\u003e\u003ctd\u003eExpl\u0026#237;came [tema] con palabras sencillas y una analog\u0026#237;a.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eResumir\u003c/td\u003e\u003ctd\u003eResume este texto en 5 puntos y dime qu\u0026#233; debo verificar.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRedactar\u003c/td\u003e\u003ctd\u003eRedacta un mensaje [tono] para [situaci\u0026#243;n].\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOrganizar\u003c/td\u003e\u003ctd\u003eConvierte esta informaci\u0026#243;n en una tabla clara: [informaci\u0026#243;n].\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eComparar\u003c/td\u003e\u003ctd\u003eCompara estas opciones con ventajas, desventajas y preguntas.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSeguridad\u003c/td\u003e\u003ctd\u003eAnaliza este mensaje y dime si parece sospechoso.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eProyecto\u003c/td\u003e\u003ctd\u003eAy\u0026#250;dame a crear un plan paso a paso para [objetivo].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.J Cierre ampliado\u003c/h3\u003e\u003cp\u003eLa tecnolog\u0026#237;a cambia r\u0026#225;pido, pero los principios aprendidos aqu\u0026#237; seguir\u0026#225;n siendo \u0026#250;tiles: hacer buenas preguntas, pedir claridad, revisar resultados, proteger datos y verificar informaci\u0026#243;n importante.\u003c/p\u003e\u003cp\u003eLa IA puede ser una herramienta de autonom\u0026#237;a, creatividad y aprendizaje. El prop\u0026#243;sito no es reemplazar su criterio, sino darle un apoyo nuevo para tareas que antes pod\u0026#237;an tomar m\u0026#225;s tiempo o resultar confusas.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eMensaje finalLa mejor forma de avanzar es practicar sin miedo y verificar con calma. Preguntar bien, revisar con atenci\u0026#243;n y decidir con criterio es la base de una vida digital m\u0026#225;s segura.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e"];
    const documentModuleDetailsEn=["\u003cdiv class=\"doc-divider\"\u003eModule 1: My First Encounter with Artificial Intelligence (AI)\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eContentFirst Steps with Confidence: A journey from the origins of technology to the present.Simple analogies will be used, such as that of the Robot Chef, to understand that Artificial Intelligence is not magic, but a tool that learns from information to help us in everyday tasks.The main objective will be to lose fear and understand the reason for this technological revolution.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e1.1 Take the first steps with confidence\u003c/h3\u003e\u003cp\u003eWhen a new technology appears, it is normal to feel doubts. Many people wonder if it will be difficult, if they will be able to use it, or if it might pose a risk. These questions are reasonable. Learning AI does not mean blindly trusting a machine; It means understanding it enough to use it judiciously.\u003c/p\u003e\u003cp\u003eAI is a technology that allows a computer to perform tasks that we previously associated with human intelligence: answering questions, sorting information, recognizing images, translating texts or suggesting ideas. The difference with a traditional calculator is that the AI ​​does not just follow a fixed operation; can work with language, context and examples.\u003c/p\u003e\u003cp\u003eThink of an assistant who can read an instruction, organize ideas, and propose an outcome. That assistant can be very helpful, but he doesn\u0026#39;t know all the details of your life. That is why the final decision always remains in your hands.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSimple explanationAI is not a
