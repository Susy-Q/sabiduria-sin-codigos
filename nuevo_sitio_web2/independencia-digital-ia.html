Describe this image and tell me what important information appears.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLearning\u003c/td\u003e\u003ctd\u003eCreate a 10-minute practice to learn [topic] with easy steps.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCreativity\u003c/td\u003e\u003ctd\u003eGive me 10 ideas for [project], with easy-to-do options.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.E Using images with care\u003c/h3\u003e\u003cp\u003eWhen a tool allows you to analyze images, it can be tempting to upload any screenshot. Before doing so, check for names, addresses, account numbers, codes, faces of people who did not give permission, or medical information. If there is sensitive data, please describe the situation in words instead of uploading the image.\u003c/p\u003e\u003cp\u003eA good alternative is to write: \u0026quot;I received a screenshot saying my account will be closed today if I don\u0026#39;t click a link. What red flags should I look for?\u0026quot; This way you get help without sharing the image.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.F Bibliographic search and sources\u003c/h3\u003e\u003cp\u003eSearching for sources is not just for students or researchers. It also serves to confirm news, procedures, benefits, policy changes, health information and financial decisions. AI can help find the way, but confirmation must come from a trusted source.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eType of information\u003c/td\u003e\u003ctd\u003eMost reliable source\u003c/td\u003e\u003ctd\u003eVerification example\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGovernment procedure\u003c/td\u003e\u003ctd\u003eOfficial government site\u003c/td\u003e\u003ctd\u003eConfirm requirements and dates.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eHealth\u003c/td\u003e\u003ctd\u003eDoctor, clinic, hospital or recognized institution\u003c/td\u003e\u003ctd\u003eConfirm general recommendations.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBank or card\u003c/td\u003e\u003ctd\u003eOfficial website or telephone number of the institution\u003c/td\u003e\u003ctd\u003eConfirm charges or alerts.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTravel\u003c/td\u003e\u003ctd\u003eOfficial airline, hotel or agency\u003c/td\u003e\u003ctd\u003eConfirm policies, prices and schedules.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eNews\u003c/td\u003e\u003ctd\u003eRecognized media and various sources\u003c/td\u003e\u003ctd\u003eCompare coverage and date.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.G News: the risk of sounding convincing\u003c/h3\u003e\u003cp\u003eThe case of lawyers sanctioned for using fake quotes generated by ChatGPT showed something very important: an answer can look professional and still be wrong. This is especially dangerous because correct language can give a false sense of security.\u003c/p\u003e\u003cp\u003eThe correct practice is not to stop using AI, but to ask for help responsibly. It can help draft, summarize, and organize ideas. But if an answer mentions laws, studies, figures or names of documents, it should be verified.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e3.H Additional practices of module 3\u003c/h3\u003e\u003ch4\u003eImprove tone\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeRewrite this message in a friendly, clear and respectful tone: [message].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003ePractice asking for a second version: shorter, clearer, or with examples.\u003c/p\u003e\u003ch4\u003eAsk for steps\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeExplain to me how to do [task] in numbered steps and in simple words.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003ePractice asking for a second version: shorter, clearer, or with examples.\u003c/p\u003e\u003ch4\u003eRequest table\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeTurn this information into a table with columns: topic, action and priority.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003ePractice asking for a second version: shorter, clearer, or with examples.\u003c/p\u003e\u003ch4\u003eRequest review\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested code Review this text and tell me if there is anything confusing, repetitive, or too technical.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003ePractice asking for a second version: shorter, clearer, or with examples.\u003c/p\u003e\u003ch4\u003eRequest fonts\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeSuggest reliable sources to verify this information: [text].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003ePractice asking for a second version: shorter, clearer, or with examples.\u003c/p\u003e\u003c/section\u003e ","\u003cdiv class=\"doc-divider\"\u003eModule 4: Browsing with Safety and Criterion\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eContentSafe Browsing: Critical digital literacy for responsible use. We will learn to identify AI hallucinations, or errors, and develop the habit of verifying information with reliable sources. This module will focus on protecting user privacy and ensuring that technology is always a support, never a risk.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.1 What are AI hallucinations?\u003c/h3\u003e\u003cp\u003eA hallucination occurs when the AI makes up information or presents as true something that is not confirmed. The problem is that the answer may sound very safe. That is why we should not measure the truth by the tone of assurance, but by verification.\u003c/p\u003e\u003cp\u003eAI generates probable answers. Sometimes he\u0026#39;s right, sometimes he\u0026#39;s wrong. In simple matters it can be a great help. In delicate issues it should be only the first step.\u003c/p\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eYou can make up dates.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eYou can mix data from different places.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eYou can create references that do not exist.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eYou may give a general recommendation that does not apply to your situation.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eYou can summarize a document poorly if you don\u0026#39;t understand the context.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSimple ruleIf the answer could affect your health, money, safety, documents or important decisions, check before acting.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.2 How to verify information\u003c/h3\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk the AI: \u0026quot;What parts of this answer should I check?\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eLook for an official source: government, bank, hospital, university, company or original document.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCompare at least two sources when the topic is important.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCheck the publication date.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eIf the issue involves money, health or law, consult a qualified person.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eSave evidence if a tool gave you an important instruction, but confirm before acting.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eVerification codeRead this answer and tell me which statements require verification. Then suggest what type of source would be reliable for each statement.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.3 Privacy: what you should not share\u003c/h3\u003e\u003cp\u003eA good security practice is to treat AI as a public tool, especially if you don\u0026#39;t know exactly how the data is stored. You can use it to learn and organize ideas, but avoid pasting sensitive information.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eDon\u0026#39;t share\u003c/td\u003e\u003ctd\u003eYou can write instead\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003ePasswords\u003c/td\u003e\u003ctd\u003eSay, \u0026quot;I have a password that I want to make stronger.\u0026quot;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eFull account numbers\u003c/td\u003e\u003ctd\u003eSay, \u0026quot;I have a bank account, what signs should I check?\u0026quot;\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eVerification codes\u003c/td\u003e\u003ctd\u003eNever paste them into an AI or share them over the phone.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSocial Security number or identification\u003c/td\u003e\u003ctd\u003eUse fictional examples if you need to practice.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDetailed medical information with full name\u003c/td\u003e\u003ctd\u003eRemove names, numbers and personal information.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eDocuments with full address\u003c/td\u003e\u003ctd\u003eUse an edited version or describe the situation without private data.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.4 Real news about AI and security\u003c/h3\u003e\u003cp\u003eAI has been in big news because it can help, but it can also be misused. Knowing these cases helps us to be alert and practice the rule: Stop, Check, Consult and Decide.\u003c/p\u003e\u003ch4\u003eCase 1: Robocall with fake voice\u003c/h4\u003e\u003cp\u003eIn 2024, US authorities investigated robocalls that used a fake AI-generated voice imitating President Joe Biden before a primary election in New Hampshire. History showed that it is no longer enough to recognize a voice; You also have to check the context and source.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eWhat We LearnIf you receive an urgent call from someone you know asking for money or immediate action, hang up and call the number you already know yourself.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eCase 2: Chatbot with incorrect information\u003c/h4\u003e\u003cp\u003eThe Air Canada case showed that a chatbot can give incorrect information about policies or services. Although the tool seems official, it is advisable to confirm it in official documents or with customer service.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eWhat we learnTake screenshots if a tool gives you an important instruction, but confirm before spending money or making a decision.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eCase 3: AI Regulation\u003c/h4\u003e\u003cp\u003eThe European Union passed an AI law that came into effect in 2024 and sets rules for different levels of risk. This shows where the world is going: more use of AI, but also more need for rules, transparency and accountability.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eWhat we learnAI will continue to grow. Security, privacy and verification will be basic digital life skills.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eCase 4: Copyright and content on the internet\u003c/h4\u003e\u003cp\u003eSeveral media companies have questioned how some AI tools use content published on the internet. This debate is important because it shows that AI affects not only individual users, but also writers, journalists, artists, businesses and educators.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eWhat we learnWhen using AI to create content, review whether you should cite sources, ask permission, or clarify that it is an AI-assisted creation.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.5 Warning signs in suspicious messages\u003c/h3\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eThey ask you to act immediately.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eThey tell him not to consult anyone.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eThey ask you for codes, passwords or account numbers.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eThey offer him an unexpected prize.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eThe message has strange errors or strange links.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eUse fear: \u0026quot;your account will be closed.\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eUse emotion: \u0026quot;a family member is in trouble.\u0026quot;\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eThey ask you to pay with gift cards, cryptocurrencies, or urgent transfers.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003eStep-by-step practice: review a suspicious message\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCode of PracticeAnalyze this message. I do not include personal data. Let me know if it looks like a scam, what red flags you see, and what safe steps I should take.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCopy the suspicious message.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRemove names, numbers and private data.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePaste the review code.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRead the warning signs.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eDon\u0026#39;t answer yet.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eVerify through an official channel.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.6 Verification of images, videos and voices\u003c/h3\u003e\u003cp\u003eModern AI can create fake images, videos or voices. Therefore, seeing an image or hearing a voice is no longer always enough to trust. When something seems urgent or emotional, it is best to check through another channel.\u003c/p\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eIf a familiar voice asks for money, call the number you already know.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eIf an image seems scandalous, look to see if other credible media outlets are reporting it.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eIf a video seems strange, check date, source and context.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eDon\u0026#39;t share questionable content just because it looks real.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSupport codeI have questions about this image, audio or video. Give me a list of signs I should check before believing it or sharing it.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.7 Where we are going: digital trust\u003c/h3\u003e\u003cp\u003eThe future will bring more present assistants in phones, computers, cars, appliances and services. We will also see more AI-generated images and voices. The central skill will not be knowing everything, but knowing how to verify.\u003c/p\u003e\u003cp\u003eDigital trust is built with four habits: stop, check, consult and decide. These habits protect your information and your peace of mind.\u003c/p\u003e\u003cp\u003eWe will also see more rules. Governments, schools, banks and companies are defining policies for the use of AI. This does not mean that the technology will disappear. It means that it will become part of daily life and we will need to learn to use it responsibly.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.8 Closing exercise\u003c/h3\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRead a simulated or real message removing personal data.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eMark signs of urgency, fear or request for sensitive information.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eUse the review code to ask the AI for help.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCompare the answer with your own criteria.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eDecide which official source you should consult.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"doc-divider\"\u003eExpanded Module 4: Navigating with Safety and Criterion\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.A Safety as a habit, not as fear\u003c/h3\u003e\u003cp\u003eDigital security should not be experienced as a permanent fear. It must be lived as a series of habits. Just as you look both ways before crossing a street, you can also stop before clicking, check before paying, and ask before sharing sensitive information.\u003c/p\u003e\u003cp\u003eAI can be part of the problem when it is used to create hoaxes, but it can also be part of the solution when it helps analyze suspicious messages, summarize policies, or identify red flags.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.B Hallucinations: detailed examples\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003etype of hallucination\u003c/td\u003e\u003ctd\u003eExample\u003c/td\u003e\u003ctd\u003eHow to respond\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIncorrect date\u003c/td\u003e\u003ctd\u003eThe AI ​​says a law changed on the wrong date.\u003c/td\u003e\u003ctd\u003eSearch the official website or request a source.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003emade up quote\u003c/td\u003e\u003ctd\u003eThe AI mentions a study that does not exist.\u003c/td\u003e\u003ctd\u003eRequest a link and verify if the document exists.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGeneral advice poorly applied\u003c/td\u003e\u003ctd\u003eAI gives too broad a financial recommendation.\u003c/td\u003e\u003ctd\u003eConsult a qualified person.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eIncomplete summary\u003c/td\u003e\u003ctd\u003eAI omits an important condition of a policy.\u003c/td\u003e\u003ctd\u003eRead the original document.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eName confusion\u003c/td\u003e\u003ctd\u003eAI mixes similar companies or products.\u003c/td\u003e\u003ctd\u003eConfirm names and details.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.C Privacy in practice\u003c/h3\u003e\u003cp\u003eA safe way to use AI is to swap real data for fictional examples. If you want to practice with an invoice, you can delete name, address, account number and exact amount. If you want to practice with a medical situation, you can talk about general questions without including private information.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSecure ExampleInstead of writing: \u0026quot;My account 123456 at bank\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.D Expanded real stories\u003c/h3\u003e\u003cp\u003eNews about AI should not be read only as distant problems. Each case teaches a specific practice for daily life.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eHistory\u003c/td\u003e\u003ctd\u003eWhat happened\u003c/td\u003e\u003ctd\u003ePractice that leaves\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eRobocall with fake voice\u003c/td\u003e\u003ctd\u003eA political call with AI-generated voice was investigated.\u003c/td\u003e\u003ctd\u003eDon\u0026#39;t trust just one voice. Check through another channel.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAir Canada chatbot\u003c/td\u003e\u003ctd\u003eA chatbot gave incorrect information about a travel policy.\u003c/td\u003e\u003ctd\u003eConfirm policies in official documents.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eFake legal quotes\u003c/td\u003e\u003ctd\u003eAI tools generated non-existent legal cases.\u003c/td\u003e\u003ctd\u003eVerify sources when there are laws or documents.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCopyright debates\u003c/td\u003e\u003ctd\u003eMedia and authors question the use of content by AI systems.\u003c/td\u003e\u003ctd\u003eCite sources and respect other people\u0026#39;s content.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAI regulation in Europe\u003c/td\u003e\u003ctd\u003eThe European Union approved rules for risk-based AI systems.\u003c/td\u003e\u003ctd\u003eThe world is creating standards to use AI responsibly.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.E Practice: review suspicious messages\u003c/h3\u003e\u003ch4\u003eSimulated message\u003c/h4\u003e\u003cp\u003eYour account will be suspended today. Click here to avoid closure.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCode to analyzeAnalyze this message. I do not include personal data. Tell me what red flags you see and what you would do before responding.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eSimulated message\u003c/h4\u003e\u003cp\u003eI am your relative. I changed my number. I need money urgently and I can\u0026#39;t talk.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCode to analyzeAnalyze this message. I do not include personal data. Tell me what red flags you see and what you would do before responding.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eSimulated message\u003c/h4\u003e\u003cp\u003eHe won a prize. Submit your bank details to receive it.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCode to analyzeAnalyze this message. I do not include personal data. Tell me what red flags you see and what you would do before responding.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003ch4\u003eSimulated message\u003c/h4\u003e\u003cp\u003eWe have a refund for you. Confirm your security code.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCode to analyzeAnalyze this message. I do not include personal data. Tell me what red flags you see and what you would do before responding.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.F Where are we going: security in a world of generated content\u003c/h3\u003e\u003cp\u003eWe will see more content created by AI: voices, images, videos, texts, ads, messages and summaries. Some creations will be useful and legitimate. Others will seek to deceive. Therefore, verification will be as important as knowing how to read.\u003c/p\u003e\u003cp\u003eWe will also see more tools that help detect fraud, filter messages and confirm identity. Security will not depend on a single application. It will depend on habits: not rushing, verifying sources, consulting and protecting data.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e4.G Additional practices of module 4\u003c/h3\u003e\u003ch4\u003eCheck urgency\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested CodeThis message is trying to get you to act quickly. Identify if you use urgency, fear or emotional pressure: [message].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAfter using the code, think about what you would do before acting.\u003c/p\u003e\u003ch4\u003eProtect data\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeRewrite this question so that it does not include personal information: [question].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAfter using the code, think about what you would do before acting.\u003c/p\u003e\u003ch4\u003eCheck news\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested code Tell me which parts of this news I should check and what sources would be reliable: [news].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAfter using the code, think about what you would do before acting.\u003c/p\u003e\u003ch4\u003eCreate family rule\u003c/h4\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSuggested codeHelp me create a simple family rule for checking emergency calls.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cp\u003eAfter using the code, think about what you would do before acting.\u003c/p\u003e\u003c/section\u003e ","\u003cdiv class=\"doc-divider\"\u003eModule 5: Creative and Practical Workshop\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eContentIndependent final application. Through independent practice and independent scenarios, students will apply their codes to solve real challenges and develop a personal project. In this final level, digital confidence will be consolidated and the ability to continue learning in the modern era will be celebrated.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.1 Preparation for the workshop\u003c/h3\u003e\u003cp\u003eIn this module you will apply what you learned. It\u0026#39;s not about demonstrating perfection. It\u0026#39;s about practicing with a real need and seeing how AI can help you move forward.\u003c/p\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eChoose a real need: travel, letter, budget, family history, general health, safety or learning.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eWrite some first code.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eReview the answer.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eAsk for improvements.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eCheck important information.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eTurn the result into something useful.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.2 Challenge 1: Plan a quiet trip\u003c/h3\u003e\u003cp\u003eAI can help create an itinerary, but you must confirm prices, times and availability. This challenge shows how to ask for a realistic plan and how to review it before using it.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCodePlan a 3-day trip to [city] with leisurely activities, breaks, easy transportation options, and a rough budget.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite the destination.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAdd dates or season.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for quiet activities.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for breaks between activities.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCheck if the plan seems realistic.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCheck schedules on official sites.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eOrder a cheaper version or one with less walking if you need it.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.3 Challenge 2: Write an important letter\u003c/h3\u003e\u003cp\u003eAfter you receive the letter, you can ask: \u0026quot;make it shorter,\u0026quot; \u0026quot;make it nicer,\u0026quot; or \u0026quot;add a thank you phrase.\u0026quot; Read the result before submitting it.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCodeWrite a formal, clear and respectful letter to request information about [topic]. Make it brief and easy to understand.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eDefine who the letter is addressed to.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eExplain what you need.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for a formal and respectful tone.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eReview names, dates and data.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eSave the final version.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.4 Challenge 3: Organize health information without sharing sensitive data\u003c/h3\u003e\u003cp\u003eAI can help you prepare, but it is not a substitute for a professional. This challenge focuses on ordering questions, not on receiving diagnoses.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCodeHelp me prepare a list of general questions for my next doctor\u0026#39;s appointment about [topic]. Don\u0026#39;t give a diagnosis; Just questions to talk to a professional.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite the general topic.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAvoid names, file numbers or private information.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk questions to bring to the appointment.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eChoose the most important questions.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eConsult the corresponding professional.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.5 Challenge 4: Detect a possible scam\u003c/h3\u003e\u003cp\u003eRemove names, account numbers, addresses, and any private information before pasting the message. If the message asks for money or codes, do not respond until you verify.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCodeAnalyze this message without personal data. Tell me if it looks suspicious, what red flags it has, and what I should do before responding.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCopy the message.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRemove private data.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for analysis of red flags.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eReview the answer.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eConsult an official source.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eDecide calmly.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.6 Challenge 5: Create a family history\u003c/h3\u003e\u003cp\u003eThis exercise connects technology with memory, family and legacy. The AI ​​can organize your ideas, but the story is still yours.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eCodeHelp me turn these memories into a short, warm and respectful story. Keep my voice personal and don\u0026#39;t make up details I didn\u0026#39;t write down.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite memories in short sentences.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk them to organize them as a story.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCheck if the AI invented something.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eDelete incorrect details.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAdd your personal touch.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.7 Independent scenario practice: the suspicious message\u003c/h3\u003e\u003cp\u003eIn this exercise, one person reads a simulated message and another person must identify red flags. AI is then used to review the message and compare results.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSimulated message\u003c/td\u003e\u003ctd\u003eWarning sign\u003c/td\u003e\u003ctd\u003eSafe response\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u0026quot;Your account will be closed today. Click here.\u0026quot;\u003c/td\u003e\u003ctd\u003eUrgency and unknown link.\u003c/td\u003e\u003ctd\u003eDon\u0026#39;t click. Enter the official site on your own.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u0026quot;I\u0026#39;m your grandson, I need money and don\u0026#39;t tell anyone.\u0026quot;\u003c/td\u003e\u003ctd\u003eEmotional pressure and secrecy.\u003c/td\u003e\u003ctd\u003eCall the family member by a known number.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u0026quot;You won a prize, please send your bank details.\u0026quot;\u003c/td\u003e\u003ctd\u003eUnexpected prize and financial request.\u003c/td\u003e\u003ctd\u003eIgnore and report if possible.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u0026quot;You must pay with a gift card today.\u0026quot;\u003c/td\u003e\u003ctd\u003eSuspicious payment method.\u003c/td\u003e\u003ctd\u003eDo not pay. Check with the official organization.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.8 Final personal project\u003c/h3\u003e\u003cp\u003eChoose one of the following projects and complete the steps. You can do it alone or with support.\u003c/p\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eSafe travel plan.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eFormal letter.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eSimple monthly budget.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eList of questions for a date.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eFamily history.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eSuspicious message analysis.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eSummary of a news story.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e•\u003c/span\u003e\u003cp\u003eDesign for an invitation or card.\u003c/p\u003e\u003c/div\u003e\u003ch4\u003eProject steps\u003c/h4\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite the objective of your project.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eChoose the tool you will use.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite clear code.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eRead the answer.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for an upgrade.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCheck important information.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eSave or copy the final result.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.9 Project templates\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eProject\u003c/td\u003e\u003ctd\u003eInitial code\u003c/td\u003e\u003ctd\u003eFinal product\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eMonthly budget\u003c/td\u003e\u003ctd\u003eCreate a simple table to organize these expenses by category: [list].\u003c/td\u003e\u003ctd\u003eRevised expense table.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003enews summary\u003c/td\u003e\u003ctd\u003eSummarize this news in simple language and tell me what data to verify.\u003c/td\u003e\u003ctd\u003eSummary with verification notes.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003efamily message\u003c/td\u003e\u003ctd\u003eWrite a warm message for [situation], with a close and brief tone.\u003c/td\u003e\u003ctd\u003eRevised message.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eInvitation\u003c/td\u003e\u003ctd\u003eCreate text for an invitation to [event], with an elegant and clear tone.\u003c/td\u003e\u003ctd\u003eText for card or WhatsApp.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eList of questions\u003c/td\u003e\u003ctd\u003eHelp me prepare questions to talk to [professional or office] about [topic].\u003c/td\u003e\u003ctd\u003eOrganized list of questions.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.10 Closing: where we are going\u003c/h3\u003e\u003cp\u003eAI will continue to appear in more places: phones, search engines, documents, calls, images, utilities and customer service. Some tools will be very useful; others will require care.\u003c/p\u003e\u003cp\u003eThe future will not just be learning new buttons. It will be learning to think judiciously in a world where information is produced faster than ever.\u003c/p\u003e\u003cp\u003eYou already have one advantage: life experience. This course adds a new tool to that experience. The goal is not to depend on AI, but to use it as a support to live with more autonomy, security and confidence.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eFinal messageInnovating without fear does not mean believing everything. It means learning, asking, practicing, verifying and deciding with confidence.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003cdiv class=\"doc-divider\"\u003eExpanded Module 5: Creative and Practical Workshop\u003c/div\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.A Before starting the project\u003c/h3\u003e\u003cp\u003eA practical project doesn\u0026#39;t have to be complicated. It must solve a real need. It can be a letter, a budget, a list of questions, a news summary, a travel plan, or a family story. The important thing is to complete the cycle: idea, code, result, review and use.\u003c/p\u003e\u003cp\u003eThe project should end with something you can save, print, send, or use. It\u0026#39;s not just about practicing for the sake of practicing; It\u0026#39;s about producing something useful.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.B Expanded Project 1: Safe Travel Plan\u003c/h3\u003e\u003cp\u003eA good travel plan doesn\u0026#39;t just list pretty places. It also considers rest times, transportation, weather, budget and confirmation of schedules. The AI ​​can prepare a quick draft, but you must confirm details.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eStarter codePlan a 3-day trip to [city] with leisurely activities, breaks, easy transportation options, an approximate budget, and safety recommendations.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for a general itinerary first.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eThen order a version with less walking.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for a list of necessary documents or reservations.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for an approximate budget table.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCheck schedules and prices on official sites.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eSave the final plan.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.C Expanded Project 2: Simple Monthly Budget\u003c/h3\u003e\u003cp\u003eA budget doesn\u0026#39;t have to be complex. AI can help sort expenses into categories and detect areas to review. Do not write down account numbers or banking information.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eInitial codeOrganize these monthly expenses by category, calculate an approximate total, and suggest three questions to review unnecessary expenses: [list].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eEnter expenses without bank details.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for categories.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCheck if the calculations make sense.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for a simpler version.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCopy the final table into a document or notebook.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.D Expanded Project 3: Family History\u003c/h3\u003e\u003cp\u003eAI can help sort memories without taking away their personal value. The most important rule is to ask that you not make up details. You provide the memory; The tool helps with structure.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eInitial codeHelp me turn these memories into a short, warm and respectful story. Don\u0026#39;t make up details. Keep my voice personal: [memories].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eWrite memories in short sentences.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for a short story.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCheck for fabricated data.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCorrect names, dates and places.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for a more emotional or simpler version.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eShare only if you feel comfortable.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.E Expanded Project 4: important letter or email\u003c/h3\u003e\u003cp\u003eWriting a letter can take time. The AI ​​can create a first draft, but you should check that the message says exactly what you want.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eInitial codeWrite a formal, clear and respectful letter to [recipient] on [topic]. Includes subject, greeting, three short paragraphs and polite closing.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eComplete recipient and subject.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for the draft.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eCheck if the tone is correct.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk for a shorter version if necessary.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eVerify data before sending.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.F Expanded Project 5: Personal News Checker\u003c/h3\u003e\u003cp\u003eThis project helps avoid sharing false information. It consists of summarizing a news story, identifying important claims and deciding what to verify.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eInitial codeSummarize this news in simple language. Separate facts, opinions and statements that need verification. Suggest reliable sources to confirm.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003ePaste a news story or fragment.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eAsk to separate facts and opinions.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eReview which data requires verification.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eFind at least one additional source.\u003c/p\u003e\u003c/div\u003e\u003cdiv class=\"doc-list-item\"\u003e\u003cspan\u003e›\u003c/span\u003e\u003cp\u003eDecide if it is appropriate to share it.\u003c/p\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.G Independent Safety Scenarios\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eSituation\u003c/td\u003e\u003ctd\u003eRole A\u003c/td\u003e\u003ctd\u003eRole B\u003c/td\u003e\u003ctd\u003eObjective\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eUrgent message from the bank\u003c/td\u003e\u003ctd\u003eRead the simulated message.\u003c/td\u003e\u003ctd\u003eIdentify warning signs.\u003c/td\u003e\u003ctd\u003ePractice pausing and checking.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCall from family asking for money\u003c/td\u003e\u003ctd\u003eAct as the one receiving the call.\u003c/td\u003e\u003ctd\u003eSuggest safe steps.\u003c/td\u003e\u003ctd\u003ePractice verification through alternate channel.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eShocking news\u003c/td\u003e\u003ctd\u003ePresents a short news story.\u003c/td\u003e\u003ctd\u003eAsk what data to verify.\u003c/td\u003e\u003ctd\u003ePractice critical thinking.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eLong email from a company\u003c/td\u003e\u003ctd\u003eRead a fragment.\u003c/td\u003e\u003ctd\u003eAsk for summary and risk signs.\u003c/td\u003e\u003ctd\u003ePractice using AI as support.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.H Where are we going?\u003c/h3\u003e\u003cp\u003eAI is moving toward more personal, more visual, and more integrated assistants. Many tasks will likely soon be done by talking to a device or asking for help within an app. We will also see AI in customer service, education, healthcare, transportation and entertainment.\u003c/p\u003e\u003cp\u003eThis doesn\u0026#39;t mean we should use everything. It means that it is advisable to understand the basics to decide. The person who knows how to ask, review and verify will have more control than the person who only accepts what the screen says.\u003c/p\u003e\u003cp\u003eThe learning does not end with this course. This course opens a door. Each additional practice strengthens digital confidence.\u003c/p\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.I Final list of favorite codes\u003c/h3\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eUse\u003c/td\u003e\u003ctd\u003eFavorite code\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eExplain\u003c/td\u003e\u003ctd\u003eExplain [topic] to me with simple words and an analogy.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSummarize\u003c/td\u003e\u003ctd\u003eSummarize this text in 5 points and tell me what I should check.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eWrite\u003c/td\u003e\u003ctd\u003eCompose a message [tone] for [situation].\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eOrganize\u003c/td\u003e\u003ctd\u003eConvert this information into a clear table: [information].\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCompare\u003c/td\u003e\u003ctd\u003eCompare these options with advantages, disadvantages and questions.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eSecurity\u003c/td\u003e\u003ctd\u003eAnalyze this message and tell me if it looks suspicious.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eProject\u003c/td\u003e\u003ctd\u003eHelp me create a step-by-step plan for [goal].\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e\u003csection class=\"doc-section\"\u003e\u003ch3\u003e5.J Extended closure\u003c/h3\u003e\u003cp\u003eTechnology changes quickly, but the principles learned here will still be useful: ask good questions, ask for clarity, review results, protect data, and verify important information.\u003c/p\u003e\u003cp\u003eAI can be a tool for autonomy, creativity and learning. The purpose is not to replace your judgment, but rather to give you new support for tasks that may have previously taken longer or been confusing.\u003c/p\u003e\u003cdiv class=\"doc-table-wrap\"\u003e\u003ctable class=\"doc-table\"\u003e\u003ctr\u003e\u003ctd\u003eFinal messageThe best way to move forward is to practice without fear and check calmly. Asking well, reviewing carefully and deciding wisely is the basis of a safer digital life.\u003c/td\u003e\u003c/tr\u003e\u003c/table\u003e\u003c/div\u003e\u003c/section\u003e"];

        ["Comprender las alucinaciones y errores de la IA","Cómo verificar información y fuentes confiables","Proteger la privacidad y los datos personales","Reconocer mensajes sospechosos y posibles estafas","Verificar imágenes, videos y voces manipuladas"],
        ["Preparar un proyecto personal con IA","Planificar un viaje seguro y organizado","Redactar cartas y mensajes importantes","Organizar información de salud sin exponer datos privados","Detectar estafas y completar un proyecto práctico final"]
      ]
    };
    function escapeOutlineText(value){return String(value).replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]))}
    function getCourseOutlineTopics(moduleIndex){return courseOutlineTopics[lang][moduleIndex]}
    function courseOutlineContent(currentIndex=null){return `<aside class="course-outline-panel" role="dialog" aria-modal="true" aria-label="${t("courseContent")}"><div class="outline-head"><h2>${t("courseContent")}</h2><button class="outline-close" type="button" data-close-outline aria-label="${t("close")}">×</button></div><p class="outline-intro">${t("courseContentIntro")}</p><div class="outline-list">${modules.map((module,moduleIndex)=>({module,moduleIndex})).filter(({moduleIndex})=>isModuleUnlocked(moduleIndex)).map(({module,moduleIndex})=>{const topics=getCourseOutlineTopics(moduleIndex);return `<article class="outline-item ${moduleIndex===currentIndex?"current":""}"><span class="outline-number">0${moduleIndex+1}</span><div><strong>${module[lang].title}</strong><p>${module[lang].short}</p><span class="outline-topics-title">${t("mainTopics")}</span><ul class="outline-topics">${topics.map(topic=>`<li>${escapeOutlineText(topic)}</li>`).join("")}</ul></div><span class="outline-state" aria-hidden="true">✓</span></article>`}).join("")}</div></aside>`}
    function renderHomeCourseOutline(){const overlay=document.getElementById("homeCourseOutline");if(overlay)overlay.innerHTML=courseOutlineContent()}
    function getModuleNavigationTopics(moduleIndex){
      const container=document.createElement("div");
      container.innerHTML=(lang==="en"?documentModuleDetailsEn:documentModuleDetailsEs)[moduleIndex];
      const pattern=new RegExp(`^${moduleIndex+1}\\.\\d+\\s+`);
      return [...container.querySelectorAll("h3,h4")].map(heading=>heading.textContent.trim()).filter(title=>pattern.test(title));
    }
    function applyTranslations(){
      document.documentElement.lang=lang;
      document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t(el.dataset.i18n));
      document.querySelectorAll("[data-i18n-html]").forEach(el=>el.innerHTML=t(el.dataset.i18nHtml));
      document.querySelectorAll("[data-lang]").forEach(btn=>btn.classList.toggle("active",btn.dataset.lang===lang));
      document.getElementById("brandButton").title=t("logoTitle");
      renderHomeCourseOutline();
      renderMenus();
      if(currentModule!==null)renderModule(currentModule,false);
      updateProgress();
    }

    function renderMenus(){
      submenu.innerHTML=modules.map((m,i)=>({m,i})).filter(({i})=>isModuleUnlocked(i)).map(({m,i})=>`<a href="#module-${i+1}" data-open="${i}"><span class="menu-num">#0${i+1}</span><span><strong>${m[lang].title}</strong><small>${t("menuSubtitle")} · #module-${i+1}</small></span></a>`).join("");
      const visibleModules=modules.map((m,i)=>({m,i,unlocked:isModuleUnlocked(i)}));
      courseSidebarNav.innerHTML=visibleModules.map(({m,i,unlocked})=>{const topics=getModuleNavigationTopics(i),open=openSidebarTopics.has(i),reached=topicProgress(i);return `<div class="sidebar-module ${open?"topics-open":""}"><div class="sidebar-module-head"><a class="sidebar-link ${unlocked?"":"locked"} ${currentModule===i?"active":""}" href="${unlocked?`#module-${i+1}`:"#"}" ${unlocked?`data-open="${i}"`:`data-locked="true" aria-disabled="true"`}><span class="sidebar-number">0${i+1}</span><span><strong>${m[lang].title}</strong><small>${unlocked?t("menuSubtitle"):t("locked")}</small></span></a><button class="sidebar-topics-toggle" type="button" data-sidebar-topics="${i}" aria-expanded="${open}" aria-label="${lang==="es"?"Mostrar temas del módulo":"Show module topics"}">+</button></div><div class="sidebar-topic-list">${topics.map((topic,topicIndex)=>{const parts=topic.match(/^(\d+\.\d+)\s+(.+)$/),available=unlocked&&topicIndex<=reached,completed=isModuleComplete(i)||topicIndex<reached,active=currentModule===i&&currentTopicIndex===topicIndex;return `<button class="sidebar-topic-item ${completed?"completed":""} ${active?"active":""}" type="button" ${available?`data-topic-open="${i}" data-topic-index="${topicIndex}"`:`disabled`}><strong>${escapeOutlineText(parts?.[1]||"")}</strong><span>${escapeOutlineText(parts?.[2]||topic)}</span><span class="sidebar-topic-state" aria-hidden="true">${completed?"✓":available?"→":"🔒"}</span></button>`}).join("")}</div></div>`}).join("");
      document.getElementById("moduleMap").innerHTML=visibleModules.filter(({unlocked})=>unlocked).map(({m,i})=>`<a class="map-card course-overview" href="#module-${i+1}" data-open="${i}"><span class="map-icon">${m.icon}</span><small>${t("module")} #0${i+1}</small><h3>${m[lang].title}</h3><p>${m[lang].short}</p><span class="module-card-gallery">${moduleGalleries[i].map(image=>`<img src="${image.src}" alt="${image[lang]}" loading="lazy">`).join("")}</span><span class="map-arrow">→</span></a>`).join("");
    }

    function prepareModuleTopicNavigation(moduleIndex){
      const pattern=new RegExp(`^${moduleIndex+1}\\.\\d+\\s+`);
      const headings=[...moduleView.querySelectorAll(".document-content h3,.document-content h4")].filter(heading=>pattern.test(heading.textContent.trim()));
      headings.forEach((heading,index)=>{
        heading.id=`module-${moduleIndex+1}-topic-${index}`;
        heading.dataset.courseTopic=String(index);
        const button=document.createElement("button");
        button.type="button";
        button.className="topic-complete-button";
        button.dataset.completeTopic=String(index);
        button.dataset.completeModule=String(moduleIndex);
        const nextHeading=headings[index+1],section=heading.closest(".doc-section");
        if(nextHeading&&nextHeading.closest(".doc-section")===section)nextHeading.before(button);else (section||heading.parentElement).append(button);
      });
      syncModuleTopicButtons(moduleIndex);
      currentTopicIndex=Math.min(topicProgress(moduleIndex),Math.max(0,headings.length-1));
    }

    function syncModuleTopicButtons(moduleIndex){
      const buttons=[...moduleView.querySelectorAll(`[data-complete-module="${moduleIndex}"]`)];
      const reached=topicProgress(moduleIndex);
      buttons.forEach(button=>{
        const index=Number(button.dataset.completeTopic);
        const completed=index<reached,current=index===reached;
        button.disabled=!current;
        button.classList.toggle("topic-button-current",current);
        button.classList.toggle("topic-button-completed",completed);
        button.classList.toggle("topic-button-future",!completed&&!current);
        button.textContent=completed?(lang==="es"?"✓ Tema completado":"✓ Topic completed"):(!current?(lang==="es"?"🔒 Complete el tema anterior para continuar":"🔒 Complete the previous topic to continue"):(index===buttons.length-1?(lang==="es"?"Finalizar tema":"Complete topic"):(lang==="es"?"Finalizar tema y habilitar el siguiente":"Complete topic and unlock the next one")));
      });
    }

    function completeModuleTopic(moduleIndex,topicIndex){
      if(currentModule!==moduleIndex||topicIndex!==topicProgress(moduleIndex))return;
      const wasComplete=isModuleComplete(moduleIndex);
      const headings=[...moduleView.querySelectorAll("[data-course-topic]")];
      saveTopicProgress(moduleIndex,Math.min(topicIndex+1,headings.length));
      window.dispatchEvent(new CustomEvent("course-progress-changed"));
      currentTopicIndex=Math.min(topicIndex+1,Math.max(0,headings.length-1));
      syncModuleTopicButtons(moduleIndex);
      const nowComplete=isModuleComplete(moduleIndex);
      updateProgress();renderMenus();renderHomeCourseOutline();
      if(!wasComplete&&nowComplete){renderModule(moduleIndex,false);showModuleCompletion(moduleIndex)}
    }

    function goToModuleTopic(moduleIndex,topicIndex){
      if(!isModuleUnlocked(moduleIndex)||topicIndex>topicProgress(moduleIndex))return;
      if(currentModule!==moduleIndex)renderModule(moduleIndex,false);
      currentTopicIndex=topicIndex;
      renderMenus();
      requestAnimationFrame(()=>requestAnimationFrame(()=>{const heading=document.getElementById(`module-${moduleIndex+1}-topic-${topicIndex}`);if(!heading)return;heading.classList.remove("topic-arrival");heading.scrollIntoView({behavior:"smooth",block:"start"});requestAnimationFrame(()=>heading.classList.add("topic-arrival"))}));
    }

    function renderModule(index,scroll=true){
      if(!isModuleUnlocked(index)){lockedMessage();showHome();return}
      document.body.classList.remove("outline-open");
      currentModule=index;
      openSidebarTopics.clear();
      openSidebarTopics.add(index);
      renderMenus();
      const m=modules[index][lang],icon=modules[index].icon;
      moduleView.innerHTML=`
        <div class="module-hero"><div class="wrap">
          <div class="module-toolbar"><button class="back" type="button" data-home>${t("back")}</button></div>
          <div class="module-hero-grid"><div><span class="module-tag">${t("module")} 0${index+1} · ${m.short}</span><h1>${m.title}</h1><p>${m.intro}</p><div class="module-progress-card"><strong id="currentModuleProgress">${moduleProgress(index)}%</strong><div><span>${t("moduleProgress")}</span><div class="progress-track"><div class="progress-fill" style="width:${moduleProgress(index)}%"></div></div></div></div></div><span class="big-icon">${icon}</span></div>
        </div></div>
        <div class="module-body"><div class="lesson-layout wrap">
          <div class="lesson-content">
            <section class="content-card" id="overview"><span class="label">${t("youWillLearn")}</span><h2>${m.title}</h2><p>${m.intro}</p>
              <div class="learning-grid">${m.goals.map(g=>`<div><span>${g[0]}</span><strong>${g[1]}</strong><p>${g[2]}</p></div>`).join("")}</div>
            </section>
            <section class="content-card document-card" id="complete-content">
              <div class="document-content">${(lang==="en"?documentModuleDetailsEn:documentModuleDetailsEs)[index]}</div>
            </section>
            <section class="content-card activity-card" id="activities"><span class="label">${t("activities")}</span><h2>${t("activityIntro")}</h2>
              <div class="activity-list">${m.activities.map((a,i)=>{const key=activityStorageKey(index,i),done=localStorage.getItem(key)==="1";return `<label class="activity ${done?"done":""}"><input type="checkbox" data-activity="${key}" ${done?"checked":""}><span><strong>${a[0]}</strong><span>${a[1]}</span></span></label>`}).join("")}</div>
            </section>
            <section class="content-card" id="resources"><span class="label">${t("resources")}</span><h2>${t("resourcesIntro")}</h2>
              <div class="resource-grid">${m.resources.map(r=>`<div class="resource"><b>${r[0]}</b><strong>${r[1]}</strong><p>${r[2]}</p></div>`).join("")}</div>
            </section>
            <div class="module-footer-nav">
              ${index>0?`<button class="nav-button" type="button" data-open="${index-1}">${t("previous")}</button>`:""}
              ${index<modules.length-1?(isModuleUnlocked(index+1)?`<button class="nav-button next" type="button" data-open="${index+1}">${t("next")}</button>`:`<button class="nav-button next" type="button" data-locked="true">🔒 ${t("next")}</button>`):`<button class="nav-button next" type="button" data-certificate ${isModuleComplete(index)?"":"disabled"}>${isModuleComplete(index)?"🏆":"🔒"} ${t("generateCertificate")}</button>`}
            </div>
          </div>
        </div></div>`;
      homeView.classList.remove("active");moduleView.classList.add("active");
      prepareModuleTopicNavigation(index);
      renderMenus();
      location.hash=`module-${index+1}`;
      if(scroll)window.scrollTo({top:0,behavior:"smooth"});
    }

    function showHome(){
      document.body.classList.remove("outline-open");currentModule=null;renderMenus();moduleView.classList.remove("active");homeView.classList.add("active");location.hash="home";window.scrollTo({top:0,behavior:"smooth"})
    }

    function closeCourseOutline(){document.querySelectorAll("[data-outline-overlay]").forEach(overlay=>{overlay.classList.remove("open");overlay.setAttribute("aria-hidden","true")});document.querySelectorAll("[data-toggle-outline]").forEach(trigger=>trigger.setAttribute("aria-expanded","false"));document.body.classList.remove("outline-open")}

    function moduleProgress(index){
      const activityTotal=modules[index].en.activities.length,topicTotal=getModuleNavigationTopics(index).length,reviewTotal=5,total=activityTotal+topicTotal+reviewTotal+(index===4?1:0);
      let done=Math.min(topicProgress(index),topicTotal);modules[index].en.activities.forEach((activity,i)=>{if(localStorage.getItem(activityStorageKey(index,i))==="1"&&activityHasEvidence(index,i))done++});for(let questionIndex=0;questionIndex<reviewTotal;questionIndex++){if(localStorage.getItem(moduleReviewStorageKey(index,questionIndex))==="1")done++}
      if(index===4&&finalProjectComplete())done++;
      return Math.round(done/total*100);
    }

    function updateProgress(){
      const total=modules.reduce((count,module,index)=>count+module[lang].activities.length+getModuleNavigationTopics(index).length+5+(index===4?1:0),0);
      let done=0;modules.forEach((m,i)=>{done+=Math.min(topicProgress(i),getModuleNavigationTopics(i).length);m[lang].activities.forEach((a,j)=>{if(localStorage.getItem(activityStorageKey(i,j))==="1"&&activityHasEvidence(i,j))done++});for(let questionIndex=0;questionIndex<5;questionIndex++){if(localStorage.getItem(moduleReviewStorageKey(i,questionIndex))==="1")done++}if(i===4&&finalProjectComplete())done++});
      const percent=Math.round(done/total*100);document.getElementById("progressPercent").textContent=percent+"%";document.getElementById("headerProgressPercent").textContent=percent+"%";
      const progressColor=percent===100?"#58e39a":percent>=80?"#b990ff":percent>=60?"#ff9f68":percent>=40?"#ffd166":percent>=20?"#5fd7cf":percent>0?"#6fb8ff":"#78909c";
      document.querySelectorAll(".progress-ring").forEach(ring=>{ring.style.setProperty("--course-progress",percent);ring.style.setProperty("--course-progress-color",progressColor)});
      progressPanel.innerHTML=`<h3>${t("progressTitle")}</h3><div class="progress-overall"><span>${t("overallProgress")}</span><strong>${percent}%</strong></div><div class="progress-list">${modules.map((module,index)=>({module,index})).filter(({index})=>isModuleUnlocked(index)).map(({module,index})=>{const value=moduleProgress(index);return `<div class="progress-row"><span>${t("module")} ${index+1} · ${module[lang].title}</span><strong>${value}%</strong><div class="progress-track"><div class="progress-fill" style="width:${value}%"></div></div></div>`}).join("")}</div>`;
      const current=document.getElementById("currentModuleProgress");if(current&&currentModule!==null){const value=moduleProgress(currentModule);current.textContent=value+"%";const fill=current.parentElement.querySelector(".progress-fill");if(fill)fill.style.width=value+"%"}
    }

    document.addEventListener("click",e=>{
      if(e.target.closest("#progressToggle")){const open=progressPanel.classList.toggle("open");progressToggle.setAttribute("aria-expanded",String(open))}
      const sidebarTopicsButton=e.target.closest("[data-sidebar-topics]");if(sidebarTopicsButton){const moduleIndex=Number(sidebarTopicsButton.dataset.sidebarTopics);openSidebarTopics.has(moduleIndex)?openSidebarTopics.delete(moduleIndex):openSidebarTopics.add(moduleIndex);renderMenus()}
      const topicButton=e.target.closest("[data-topic-open]");if(topicButton)goToModuleTopic(Number(topicButton.dataset.topicOpen),Number(topicButton.dataset.topicIndex));
      const completeTopicButton=e.target.closest("[data-complete-topic]");if(completeTopicButton)completeModuleTopic(Number(completeTopicButton.dataset.completeModule),Number(completeTopicButton.dataset.completeTopic));
      if(e.target.closest("[data-certificate]"))generateCertificate();
      if(e.target.closest("[data-toggle-outline]")){const trigger=e.target.closest("[data-toggle-outline]"),overlay=document.getElementById(trigger.dataset.outlineTarget);if(overlay){closeCourseOutline();overlay.classList.add("open");overlay.setAttribute("aria-hidden","false");trigger.setAttribute("aria-expanded","true");document.body.classList.add("outline-open")}}
      if(e.target.closest("[data-close-outline]")||e.target.matches("[data-outline-overlay]"))closeCourseOutline();
      const open=e.target.closest("[data-open]");if(open){renderModule(Number(open.dataset.open));submenu.classList.remove("open");menuTrigger.setAttribute("aria-expanded","false")}
      if(e.target.closest("[data-locked]")){e.preventDefault();lockedMessage()}
      if(e.target.closest("[data-home]"))showHome();
      if(!e.target.closest(".course-menu")){submenu.classList.remove("open");menuTrigger.setAttribute("aria-expanded","false")}
      if(!e.target.closest(".progress-menu")){progressPanel.classList.remove("open");progressToggle.setAttribute("aria-expanded","false")}
    });
    document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCourseOutline()});
    document.addEventListener("change",e=>{if(e.target.matches("[data-activity]")){const response=e.target.closest(".activity")?.querySelector(".exercise-response");if(e.target.checked&&(!response||response.value.trim().length<10)){e.target.checked=false;const status=e.target.closest(".activity")?.querySelector(".exercise-save-status");if(status)status.textContent=lang==="es"?"Escriba al menos una oración sobre lo que aprendió antes de completar la actividad.":"Write at least one sentence about what you learned before completing the activity.";response?.focus();return}const wasComplete=isModuleComplete(currentModule);localStorage.setItem(e.target.dataset.activity,e.target.checked?"1":"0");e.target.closest(".activity").classList.toggle("done",e.target.checked);window.dispatchEvent(new CustomEvent("course-progress-changed"));const nowComplete=isModuleComplete(currentModule);updateProgress();renderMenus();renderHomeCourseOutline();if(!wasComplete&&nowComplete){renderModule(currentModule,false);showModuleCompletion(currentModule)}}});
    menuTrigger.addEventListener("click",()=>{const open=submenu.classList.toggle("open");menuTrigger.setAttribute("aria-expanded",String(open))});
    document.getElementById("logoutButton").addEventListener("click",()=>{
      sessionStorage.removeItem("id-course-browser-session");
      if(location.pathname.startsWith("/course")){
        const logoutForm=document.createElement("form");logoutForm.method="post";logoutForm.action="/api/logout";document.body.appendChild(logoutForm);logoutForm.submit();return;
      }
      location.href="index.html";
    });
    document.querySelectorAll("[data-lang]").forEach(btn=>btn.addEventListener("click",()=>{lang=btn.dataset.lang;localStorage.setItem("id-course-language",lang);window.dispatchEvent(new CustomEvent("course-progress-changed"));applyTranslations()}));

    const logoInput=document.getElementById("logoInput"),brandLogo=document.getElementById("brandLogo");
    document.getElementById("brandButton").addEventListener("click",()=>logoInput.click());
    logoInput.addEventListener("change",()=>{
      const file=logoInput.files[0];if(!file)return;
      if(file.size>1500000){alert(lang==="es"?"Elija una imagen menor de 1.5 MB.":"Choose an image smaller than 1.5 MB.");return}
      const reader=new FileReader();reader.onload=()=>{localStorage.setItem("id-course-logo",reader.result);brandLogo.innerHTML=`<img src="${reader.result}" alt="Company logo">`};reader.readAsDataURL(file);
    });
    const savedLogo=localStorage.getItem("id-course-logo");if(savedLogo)brandLogo.innerHTML=`<img src="${savedLogo}" alt="Company logo">`;
    document.getElementById("year").textContent=new Date().getFullYear();
    applyTranslations();
    const hashMatch=location.hash.match(/^#module-(\d)$/);if(hashMatch)renderModule(Number(hashMatch[1])-1,false);
  </script>
  <script src="accesibilidad.js"></script>
  <script src="lectura-guiada.js"></script>
  <script src="ejercicios-interactivos.js"></script>
  <script src="registro-bienvenida.js"></script>
  <script src="orientacion-estudiante.js"></script>
  <script src="navegacion-mejorada.js"></script>
  <script src="cierre-pedagogico.js"></script>
  <script src="temas-secuenciales.js"></script>
  <script src="metodologia-autodidactica.js"></script>
  <script src="sincronizacion-progreso.js"></script>
  <script src="pie-sitio.js"></script>
</body>
