<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso privado del revisor</title><style>:root{--navy:#173f56;--cream:#fbf8f0;--ink:#183044;--muted:#60727d;--line:#cfdfdf}*{box-sizing:border-box}body{display:grid;min-height:100vh;place-items:center;margin:0;padding:24px;background:linear-gradient(135deg,var(--navy),#246378);font-family:"Segoe UI",Arial,sans-serif;color:var(--ink)}main{width:min(100%,520px);padding:38px;border-radius:25px;background:var(--cream);box-shadow:0 25px 70px rgba(0,0,0,.2)}h1{margin:0 0 10px;font-size:42px;letter-spacing:-.04em}p{color:var(--muted);line-height:1.6}.field{display:grid;gap:7px;margin-top:24px}.field label{font-weight:800}.field input{min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:12px;font:inherit}.button{width:100%;min-height:52px;margin-top:15px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:850;cursor:pointer}.message{display:none;margin-top:12px;padding:11px;border-radius:10px;background:#ffe5df;color:#843426}.message.show{display:block}.back{display:block;margin-top:17px;color:#297b91;text-align:center;text-decoration:none;font-weight:800}</style><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="pie-sitio.css"><link rel="stylesheet" href="encabezado-mejorado.css"></head><body class="reviewer-page"><main><h1>Acceso del revisor</h1><p>Ingrese la contraseña privada para revisar los cinco módulos. Este acceso no modifica el progreso de los estudiantes.</p><form id="reviewForm"><div class="field"><label for="password">Contraseña del revisor</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="button" type="submit">Abrir los cinco módulos</button><p class="message" id="message" role="alert"></p></form><a class="back" href="/login">Volver al acceso estudiantil</a></main><script src="/acceso-revisor.js"></script><script src="pie-sitio.js"></script></body></html>
