<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Wisdom Without Code</title><style>
:root{--ink:#183044;--navy:#173f56;--blue:#297b91;--aqua:#61c8c5;--cream:#fbf8f0;--muted:#60727d;--line:#cfdfdf}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,var(--navy),#246378);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;font-size:17px}.shell{display:grid;min-height:100vh;grid-template-columns:.9fr 1.1fr;align-items:center;gap:7vw;width:min(calc(100% - 9vw),1050px);margin:auto;padding:42px 0}.intro{color:#fff}.brand{display:flex;align-items:center;gap:13px;margin-bottom:48px}.mark{display:grid;width:58px;height:58px;flex:0 0 58px;place-items:center;border:1px solid rgba(255,255,255,.3);border-radius:17px;background:rgba(255,255,255,.11);color:#fff;font-size:17px;font-weight:900;line-height:1;text-align:center}.brand-name{display:block;color:#fff;font-size:17px;font-weight:850;line-height:1.2}.brand-name small{display:block;margin-top:4px;color:rgba(255,255,255,.58);font-size:10px;letter-spacing:.08em;text-transform:uppercase}.label{color:#a7ebe5;font-size:12px;font-weight:850;letter-spacing:.12em}h1{margin:15px 0 20px;font-size:clamp(3.2rem,5.5vw,5.8rem);line-height:.94;letter-spacing:-.06em}.intro>p{color:rgba(255,255,255,.72);line-height:1.7}.login-panel{display:flex;flex-direction:column}.top-actions{display:flex;align-items:center;align-self:flex-end;gap:8px;margin-bottom:12px}.language{display:flex;padding:3px;border:1px solid rgba(255,255,255,.25);border-radius:11px}.language button{padding:6px 9px;border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,.72);font-weight:850;cursor:pointer}.language button.active{background:#fff;color:var(--navy)}.home-link{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border:1px solid rgba(255,255,255,.25);border-radius:11px;color:#fff;text-decoration:none;font-size:12px;font-weight:850}.card{padding:38px;border-radius:25px;background:var(--cream);box-shadow:0 24px 70px rgba(24,48,68,.2)}.card h2{margin:4px 0 6px;font-size:35px}.card>p{margin:0 0 24px;color:var(--muted);font-size:13px}.field{display:grid;gap:6px;margin-bottom:15px}.field label{font-size:12px;font-weight:850}.field input{width:100%;min-height:52px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;outline:0}.field input:focus{border-color:var(--aqua);box-shadow:0 0 0 4px rgba(97,200,197,.14)}.submit{width:100%;min-height:53px;margin-top:4px;border:0;border-radius:13px;background:var(--navy);color:#fff;font-weight:850;cursor:pointer}.submit:disabled{opacity:.6}.message{display:none;margin:13px 0 0;padding:11px;border-radius:10px;font-size:12px}.message.show{display:block}.message.error{background:#ffe5df;color:#843426}.switch{margin-top:19px;padding-top:17px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center}.switch a{color:var(--blue);font-weight:850;text-decoration:none}@media(max-width:800px){.shell{grid-template-columns:1fr;width:min(calc(100% - 34px),620px)}.intro{padding-top:25px}.login-panel{margin-bottom:35px}}@media(max-width:520px){.card{padding:31px 22px}}
</style><link rel="stylesheet" href="acceso-mejorado.css"><link rel="stylesheet" href="responsive.css"><link rel="stylesheet" href="pie-sitio.css"><link rel="stylesheet" href="encabezado-mejorado.css"></head><body><main class="shell">
<section class="intro"><div class="brand"><span class="mark" aria-label="SC">SC</span><span class="brand-name"><span data-en="Wisdom Without Code" data-es="Sabiduría Sin Códigos">Wisdom Without Code</span><small data-en="Clear, useful and safe AI" data-es="IA clara, útil y segura">Clear, useful and safe AI</small></span></div><span class="label" data-en="STUDENT ACCESS" data-es="ACCESO DEL ESTUDIANTE">STUDENT ACCESS</span><h1 data-en="Welcome back." data-es="Bienvenido nuevamente.">Welcome back.</h1><p data-en="Enter the email and password used during registration to continue your course." data-es="Ingrese el correo y la contraseña utilizados durante el registro para continuar su curso.">Enter the email and password used during registration to continue your course.</p><figure class="login-illustration"><img src="Imagenes de del curso/inicio-sesion-adultos-mayores.png" alt="Older couple signing in together to their artificial intelligence course" data-alt-en="Older couple signing in together to their artificial intelligence course" data-alt-es="Pareja de adultos mayores iniciando sesión juntos en su curso de inteligencia artificial"></figure></section>
<div class="login-panel"><div class="top-actions"><div class="language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button></div><a class="home-link" id="homeLink" href="index.html"><span>⌂</span><span data-en="Home" data-es="Inicio">Home</span></a></div><section class="card"><h2 data-en="Sign in" data-es="Iniciar sesión">Sign in</h2><p data-en="Use your registered student credentials." data-es="Utilice sus credenciales de estudiante registrado.">Use your registered student credentials.</p><form id="loginForm"><div class="field"><label for="email" data-en="Email" data-es="Correo electrónico">Email</label><input id="email" name="email" type="email" autocomplete="username" required maxlength="254" data-placeholder-en="name@example.com" data-placeholder-es="nombre@ejemplo.com"></div><div class="field"><label for="password" data-en="Password" data-es="Contraseña">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="200"></div><button class="submit" type="submit" data-en="Sign in to the course" data-es="Ingresar al curso">Sign in to the course</button><p class="message" id="message" role="alert"></p></form><div class="switch"><span data-en="Do not have an account?" data-es="¿No tiene una cuenta?">Do not have an account?</span> <a href="registro.html" data-en="Register" data-es="Registrarme">Register</a></div></section></div>
</main><script src="acceso-local.js"></script><script src="pie-sitio.js"></script></body></html>
