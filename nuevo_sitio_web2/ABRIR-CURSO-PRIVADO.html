<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Abrir curso privado | Sabiduría Sin Códigos</title>
  <style>
    :root{--navy:#173f56;--blue:#297b91;--aqua:#61c8c5;--cream:#fbf8f0;--ink:#183044;--muted:#60727d}
    *{box-sizing:border-box}body{display:grid;min-height:100vh;place-items:center;margin:0;padding:24px;background:linear-gradient(135deg,var(--navy),#246378);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif}
    main{width:min(100%,720px);padding:42px;border-radius:26px;background:var(--cream);box-shadow:0 28px 80px rgba(0,0,0,.2)}
    .top{display:flex;align-items:center;justify-content:space-between;gap:20px}.mark{display:grid;width:58px;height:58px;place-items:center;border-radius:17px;background:var(--navy);color:#fff;font-weight:900}
    .languages{display:flex;gap:6px}.languages button{padding:8px 11px;border:1px solid #cfdfdf;border-radius:9px;background:#fff;color:var(--muted);font-weight:800;cursor:pointer}.languages button.active{background:var(--navy);color:#fff}
    .label{display:block;margin-top:34px;color:var(--blue);font-size:12px;font-weight:850;letter-spacing:.12em}h1{margin:12px 0 16px;font-size:clamp(2.6rem,7vw,5rem);line-height:.95;letter-spacing:-.055em}p{color:var(--muted);font-size:18px;line-height:1.65}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}.button{display:inline-flex;min-height:52px;align-items:center;justify-content:center;padding:0 20px;border:0;border-radius:13px;background:var(--navy);color:#fff;text-decoration:none;font-weight:850;cursor:pointer}.button.secondary{border:1px solid #cfdfdf;background:#fff;color:var(--blue)}
    @media(max-width:520px){main{padding:28px 22px}.actions{flex-direction:column}.button{width:100%}}
  </style>
</head>
<body>
  <main>
    <div class="top"><span class="mark">SC</span><div class="languages"><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button></div></div>
    <span class="label" data-en="PRIVATE LOCAL COURSE" data-es="CURSO LOCAL PRIVADO">CURSO LOCAL PRIVADO</span>
    <h1 data-en="Open your course." data-es="Abra su curso.">Abra su curso.</h1>
    <p data-en="Your registration, credentials, contact messages, and course information remain on this computer." data-es="Su registro, credenciales, mensajes de contacto e información del curso permanecen en esta computadora.">Su registro, credenciales, mensajes de contacto e información del curso permanecen en esta computadora.</p>
    <div class="actions">
      <a class="button" href="http://127.0.0.1:4317/register" data-en="Register for the course" data-es="Registrarme en el curso">Registrarme en el curso</a>
      <a class="button secondary" href="http://127.0.0.1:4317/login" data-en="I already have an account" data-es="Ya tengo una cuenta">Ya tengo una cuenta</a>
      <a class="button secondary" href="index.html" data-en="View course information" data-es="Ver información del curso">Ver información del curso</a>
    </div>
  </main>
  <script>
    let lang=localStorage.getItem("id-course-language")||"es";
    function applyLanguage(){document.documentElement.lang=lang;document.querySelectorAll("[data-en]").forEach(element=>element.textContent=element.dataset[lang]);document.querySelectorAll("[data-lang]").forEach(button=>button.classList.toggle("active",button.dataset.lang===lang))}
    document.querySelectorAll("[data-lang]").forEach(button=>button.addEventListener("click",()=>{lang=button.dataset.lang;localStorage.setItem("id-course-language",lang);applyLanguage()}));
    applyLanguage();
  </script>
</body>
</html>
